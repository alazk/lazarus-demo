<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Newton — Lazarus Scan</title>
<meta name="description" content="Screen a wallet for its distance to a known Lazarus Group address, and have an operator quorum attest the decision onchain." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink-90:#1B171A; --ink-70:#77767A; --ink-50:#B0B4BA;
    --ink-30:#E0E0E3; --ink-10:#F0F0FA; --paper:#FFFFFF;

    --s-05:4px; --s-1:8px; --s-15:12px; --s-2:16px; --s-3:24px;
    --s-4:32px; --s-5:40px; --s-6:48px; --s-8:64px;
    --box-pad:16px;

    --pass-a:#DFFDCF; --pass-b:#B4DCB8;
    --block-a:#FAE1C2; --block-b:#E5BB8F;
    --fail-a:#EFEDEA; --fail-b:#D6D2CD;

    --on-22:rgba(27,23,26,.22); --on-35:rgba(27,23,26,.35);
    --on-62:rgba(27,23,26,.62);
    --veil:rgba(255,255,255,.5); --veil-strong:rgba(255,255,255,.85);

    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --pill:999px;
    --inset:clamp(var(--s-3),4vw,var(--s-6));
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--ink-10); color:var(--ink-90);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    padding:var(--s-3); display:flex; flex-direction:column; gap:var(--s-3);
    height:100vh; height:100dvh; overflow:hidden;
  }
  :focus-visible { outline:2px solid var(--ink-90); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }

  .h1 { font-size:clamp(34px,4.4vw,60px); line-height:1.04; font-weight:700; letter-spacing:-.025em; }
  .h2 { font-size:clamp(28px,3.2vw,44px); line-height:1.1; font-weight:700; letter-spacing:-.02em; }
  .h4 { font-size:20px; line-height:32px; font-weight:700; }
  .h6 { font-size:12px; line-height:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  .p-lg { font-size:18px; line-height:28px; }
  .p-std { font-size:16px; line-height:24px; }
  .p-sm { font-size:14px; line-height:24px; }
  .mono { font-family:var(--mono); }
  .muted { color:var(--ink-70); }

  .mast {
    background:var(--paper); border:1px solid var(--ink-30); border-radius:var(--r-lg);
    display:flex; align-items:center; justify-content:space-between;
    gap:var(--s-3); padding:var(--s-15) var(--inset); flex-wrap:wrap; flex-shrink:0;
  }
  .brand { display:flex; align-items:center; gap:var(--s-2); }
  .wordmark { height:22px; width:auto; color:var(--ink-90); display:block; }
  .badge {
    background:var(--ink-90); color:var(--paper); border-radius:var(--r-sm);
    padding:var(--s-1) var(--s-2); font-size:12px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase;
    border:none; font-family:var(--sans); cursor:pointer;
    transition:opacity .12s;
  }
  .badge:hover { opacity:.82; }
  .pill {
    display:flex; align-items:center; gap:var(--s-1); height:40px;
    border:1px solid var(--ink-30); border-radius:var(--r-sm);
    padding:0 var(--s-2); background:var(--ink-10);
    font-size:14px; font-weight:500; white-space:nowrap;
  }
  .dot { width:8px; height:8px; border-radius:50%; background:#00CC8F; }

  .stage {
    background:var(--paper); border:1px solid var(--ink-30);
    border-radius:var(--r-xl); overflow:hidden; display:flex;
    justify-content:center; flex:1; min-height:0;
  }

  /* ── Intro ──────────────────────────────────────────────────── */
  .intro {
    width:100%; display:flex; flex-direction:column; justify-content:center;
    padding-block:var(--s-5);
    padding-inline:max(var(--inset), calc((100% - 1200px) / 2));
    min-height:0; overflow-y:auto;
  }
  .act { max-width:44ch; }
  /* The copy crossfades rather than cutting, so the eye follows the argument
     from one act to the next. */
  #act-copy { transition:opacity .18s ease, transform .18s ease; }
  #act-copy.fading { opacity:0; transform:translateY(6px); }
  .act .h6 { color:var(--ink-50); }
  .act .h2 { margin-top:var(--s-2); }
  .act p { margin:var(--s-3) 0 0; color:var(--ink-70); }
  .intro-foot {
    display:flex; align-items:center; gap:var(--s-3);
    margin-top:var(--s-4); flex-wrap:wrap;
  }
  .acts { display:flex; gap:var(--s-1); }
  .act-dot {
    width:var(--s-1); height:var(--s-1); padding:0; border:none;
    border-radius:var(--pill); background:var(--ink-30); cursor:pointer;
    transition:background .2s;
  }
  .act-dot.on { background:var(--ink-90); }

  .intro-grid {
    display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr);
    gap:var(--s-6); align-items:center; width:100%;
  }
  .act-figure { min-width:0; }

  /* One diagram, three readings: the marks and the bracket carry the argument. */
  .chain { display:flex; flex-direction:column; gap:var(--s-1); }
  .cn-row { display:flex; align-items:flex-start; }
  .cn-cell { display:flex; flex-direction:column; align-items:center; gap:var(--s-1); flex:1; min-width:0; }
  .cn {
    width:100%; min-height:var(--s-6); padding:var(--s-1) var(--s-15);
    display:flex; align-items:center; justify-content:center; text-align:center;
    border:1px solid var(--ink-30); border-radius:var(--r-sm);
    background:var(--paper); font-size:14px; font-weight:500; color:var(--ink-90);
    transition:background .3s, border-color .3s, color .3s, opacity .3s;
  }
  .cn.known { border-color:var(--ink-90); }
  .cn { transform:translateZ(0); }
  .cn.off   { color:var(--ink-50); opacity:.5; }
  .cn.pass  { background:var(--pass-a); border-color:var(--pass-b); }
  .cn.hit   { background:var(--block-a); border-color:var(--block-b); }
  .cn-cap {
    font-size:12px; color:var(--ink-50); text-align:center; min-height:16px;
    transition:color .3s;
  }
  .cn-link { flex:0 0 var(--s-4); height:1px; background:var(--ink-30); margin-top:var(--s-3); }

  /* The bracket spans whole cells, so its width is computed from the count
     rather than guessed, and it holds when the row reflows. */
  .cn-bracket {
    width:calc((100% - 3 * var(--s-4)) * var(--span) / 4 + (var(--span) - 1) * var(--s-4));
    display:flex; flex-direction:column; align-items:center; gap:var(--s-05);
    opacity:0; transition:width .42s cubic-bezier(.4,0,.2,1), opacity .3s ease;
  }
  .cn-bracket.on { opacity:1; }
  .cn-rule { width:100%; height:1px; background:var(--ink-50); }
  .cn-blabel {
    font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-70); text-align:center;
  }

  /* The example wallets sit on the same chain the diagram just explained. */
  /* Five two-line labels on one row: the cells need room to breathe and the
     text needs to wrap inside them rather than spilling past the border. */
  .picker { display:flex; align-items:flex-start; gap:var(--s-1); margin-top:var(--s-1); }
  .pk-cell { display:flex; flex-direction:column; align-items:stretch; gap:var(--s-05); flex:1 1 0; min-width:0; }
  .pk {
    width:100%; min-height:56px; padding:var(--s-1) var(--s-05);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; text-align:center;
    border:1px solid var(--ink-30); border-radius:var(--r-sm);
    background:var(--paper); cursor:pointer; font-family:var(--sans);
    font-size:13px; font-weight:500; color:var(--ink-90); line-height:17px;
    overflow-wrap:anywhere; hyphens:auto;
    transition:border-color .12s, background .12s, color .12s;
  }
  .pk:hover:not(.chosen) { border-color:var(--ink-90); }
  .pk.chosen { border-color:var(--ink-90); background:var(--ink-90); color:var(--paper); }
  .pk-name { font-size:14px; font-weight:600; }
  .pk-addr { font-family:var(--mono); font-size:11px; color:var(--ink-50); }
  .pk.chosen .pk-addr { color:var(--ink-30); }
  .pk-link { display:none; }

  .deployed {
    margin-top:auto; padding-top:var(--s-2); border-top:1px solid var(--ink-30);
    display:flex; align-items:center; gap:var(--s-1); flex-wrap:wrap;
  }
  .fact-link {
    font-family:var(--mono); font-size:14px; font-weight:500;
    color:var(--ink-90); text-decoration:none; border-bottom:1px solid var(--ink-30);
  }
  .fact-link:hover { border-color:var(--ink-90); }

/* ── Console ────────────────────────────────────────────────── */
  .console {
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:stretch; gap:var(--s-4); align-content:center;
    padding:var(--s-3) var(--inset); max-width:1400px; width:100%; margin:0 auto;
    min-height:0; overflow-y:auto;
  }
  .col { display:flex; flex-direction:column; gap:var(--s-15); min-width:0; }
  .card {
    display:flex; flex-direction:column; min-height:0; height:100%;
    border-radius:var(--r-md); padding:var(--s-3);
    background:var(--paper); border:1px solid var(--ink-30);
  }
  .card-body { min-height:0; display:flex; flex-direction:column; }
  .card-body { flex:1; }
  .card-check .card-body { gap:var(--s-2); }

  .rule { margin:var(--s-2) 0 0; max-width:40ch; font-size:20px; line-height:30px; }

  /* The rail is the distance control: reach is shown by what is lit. */
  .rail { display:flex; align-items:center; margin-top:var(--s-3); }
  .rail-node {
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    height:var(--s-4); padding:0 var(--s-15);
    border:1px solid var(--ink-30); border-radius:var(--r-sm);
    background:var(--paper); font-family:var(--sans);
    font-size:12px; font-weight:600; color:var(--ink-50);
  }
  .rail-node.on { border-color:var(--ink-90); color:var(--ink-90); }
  .rail-node.sel { background:var(--ink-90); border-color:var(--ink-90); color:var(--paper); }
  .rail-node.end { background:var(--ink-90); border-color:var(--ink-90); color:var(--paper); }
  button.rail-node { cursor:pointer; transition:border-color .12s, background .12s, color .12s; }
  span.rail-node { cursor:default; }
  button.rail-node:hover:not(.sel) { background:var(--ink-10); }
  .rail-link { flex:1; height:1px; background:var(--ink-30); min-width:var(--s-1); }
  .rail-link.on { background:var(--ink-90); }

  .label { font-size:14px; font-weight:500; color:var(--ink-70); }
  .vals { display:flex; gap:var(--s-1); margin-top:var(--s-1); }
  .val {
    flex:1; height:var(--s-4); padding:0 var(--s-15);
    border:1px solid var(--ink-30); border-radius:var(--r-sm);
    background:var(--paper); cursor:pointer; font-family:var(--sans);
    font-size:14px; font-weight:500; color:var(--ink-70);
    transition:border-color .12s, background .12s, color .12s;
  }
  .val:hover:not(.sel) { border-color:var(--ink-90); color:var(--ink-90); }
  .val.sel { border-color:var(--ink-90); background:var(--ink-90); color:var(--paper); }

  .flow-row {
    display:flex; align-items:flex-start; gap:var(--s-15);
    font-size:14px; line-height:20px; color:var(--ink-70); min-width:0;
  }
  .flow-row > span:last-child { flex:1; min-width:0; }
  .flow-n {
    width:20px; height:20px; flex-shrink:0; margin-top:1px; border-radius:var(--pill);
    background:var(--ink-90); color:var(--paper);
    font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center;
  }


  .field {
    width:100%; height:48px; border:1px solid var(--ink-50);
    border-radius:var(--r-sm); background:var(--paper);
    padding:0 var(--box-pad); font-family:var(--mono); font-size:16px; color:var(--ink-90);
  }
  .field::placeholder { color:var(--ink-50); }
  .field:focus { border-color:var(--ink-90); outline:none; box-shadow:0 0 0 var(--s-05) var(--ink-30); }
  .field.invalid { border-color:#FC5C36; }
  .err { font-size:14px; line-height:20px; color:#932303; margin:0; }
  .err:empty { display:none; }

  .btn {
    border:none; border-radius:var(--pill); cursor:pointer;
    font-family:var(--sans); font-weight:600; text-decoration:none;
    display:inline-flex; align-items:center; justify-content:center; gap:var(--s-1);
    text-align:center; line-height:20px;
    transition:background .12s, border-color .12s, opacity .12s;
  }
  .btn-lg { min-height:48px; padding:var(--s-15) var(--s-4); font-size:16px; }
  .btn-md { min-height:44px; padding:var(--s-15) var(--s-3); font-size:14px; }
  .btn-primary { background:var(--ink-90); color:var(--paper); }
  .btn-primary:hover { background:#000; }
  .btn-primary[disabled] { background:var(--ink-50); cursor:default; }
  .btn-tertiary { background:transparent; color:var(--ink-90); border:1px solid var(--ink-90); }
  .btn-tertiary:hover { background:var(--ink-10); }
  .btn-block { width:100%; margin-top:var(--s-2); flex-shrink:0; }

  /* ── Scan and verdict share one frame ───────────────────────── */
  .intro, .console, .checking, .verdict { min-height:560px; }
  .checking, .verdict {
    width:100%; display:flex; flex-direction:column; justify-content:center;
    padding-block:var(--s-5);
    padding-inline:max(var(--inset), calc((100% - 1200px) / 2));
    min-height:0; overflow-y:auto;
  }
  /* Matches the verdict's actions row so both centre their grid alike. */  /* The actions only exist once there is a decision to act on. */
  #actions-slot { margin:0; opacity:0; transition:opacity .4s ease .15s; }
  #actions-slot.on { margin:var(--s-4) 0 0; opacity:1; }

  .checking::after { content:''; display:block; height:100px; flex-shrink:0; }
  .verdict { transition:background .55s ease; }
  .verdict.pass  { background:linear-gradient(135deg,var(--pass-a),var(--pass-b)); }
  .verdict.block { background:linear-gradient(135deg,var(--block-a),var(--block-b)); }
  .verdict.fail  { background:linear-gradient(135deg,var(--fail-a),var(--fail-b)); }

  .grid {
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:var(--s-8); align-items:start; width:100%;
  }
  .grid.single { grid-template-columns:minmax(0,1fr); }
  .left { display:flex; align-items:flex-start; min-width:0; }
  .right { min-width:0; }

  /* The scan rows and the path nodes are one component, so the chain
     settles into the place the steps occupied rather than replacing them. */
  .steps {
    display:flex; flex-direction:column; align-items:stretch; gap:var(--s-1);
    width:100%; max-width:440px; margin:0;
  }
  .step {
    display:flex; align-items:baseline; justify-content:space-between; gap:var(--s-2);
    min-height:36px; padding:var(--s-1) var(--box-pad);
    border:1px solid var(--on-22); border-radius:var(--r-sm);
    background:var(--veil);
  }
  .step {
    font-size:16px; color:var(--ink-50);
    border-color:var(--ink-30); background:var(--paper);
    transition:opacity .25s, border-color .2s, color .2s, background .2s;
    transition:opacity .25s, border-color .2s, color .2s, background .2s;
  }
  .step.active { border-color:var(--ink-90); color:var(--ink-90); animation:pulse 1.2s ease-in-out infinite; }
  .settled .step.active { animation:none; }
  .step.waiting .step-note { animation:pulse 1.4s ease-in-out infinite; }
  .settled .step.waiting .step-note { animation:none; }
  .step.clear { color:var(--ink-90); border-color:var(--pass-b); background:var(--pass-a); }
  .step.hit   { color:var(--ink-90); border-color:var(--block-b); background:var(--block-a); }
  .step.below { color:var(--ink-90); border-color:var(--fail-b); background:var(--fail-a); }
  .step.idle { opacity:.35; }
  .step-label { flex:1; font-size:16px; }
  .step-note { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.45; } }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  @keyframes settleIn { from { opacity:0; transform:translateY(-4px) scale(.99); } to { opacity:1; transform:none; } }

  /* The steps arrive in sequence, so the scan looks like it is being built
     rather than appearing all at once. */
  .steps .step { animation:rise .34s ease backwards; }
  .steps .step:nth-child(1) { animation-delay:.02s; }
  .steps .step:nth-child(3) { animation-delay:.08s; }
  .steps .step:nth-child(5) { animation-delay:.14s; }
  .steps .step:nth-child(7) { animation-delay:.20s; }
  .steps .arrow { animation:rise .34s ease backwards .1s; }

  /* The verdict settles into the panel the scan left behind. */
  .right .h1, .right .reason, .right .stats, .right .detail { animation:settleIn .4s ease backwards; }
  .right .reason { animation-delay:.06s; }
  .right .stats  { animation-delay:.12s; }

  /* Each figure counts in just after the one before it. */
  .stat { animation:rise .36s ease backwards; }
  .stat:nth-child(1) { animation-delay:.14s; }
  .stat:nth-child(2) { animation-delay:.20s; }
  .stat:nth-child(3) { animation-delay:.26s; }

  /* The console's two cards arrive together but not abruptly. */
  .console .col { animation:rise .4s ease backwards; }
  .console .col:nth-child(2) { animation-delay:.07s; }

  /* The intro figure follows its copy. */
  .act-figure { animation:rise .45s ease backwards .1s; }
  .cn-cell { animation:rise .4s ease backwards; }
  .cn-cell:nth-child(3) { animation-delay:.06s; }
  .cn-cell:nth-child(5) { animation-delay:.12s; }
  .cn-cell:nth-child(7) { animation-delay:.18s; }
  .arrow { align-self:flex-start; margin-left:var(--s-2); color:var(--ink-50); font-size:16px; line-height:16px; text-decoration:none; }
  .arrow::after { content:'↓'; }

  .reason { margin-top:var(--s-3); max-width:44ch; color:var(--ink-90); }
  .detail { font-family:var(--mono); font-size:14px; line-height:20px; color:var(--on-62); margin-top:var(--s-15); max-width:64ch; word-break:break-word; }

  .stats {
    display:grid; grid-template-columns:repeat(3, minmax(0,1fr));
    margin-top:var(--s-5); max-width:560px;
  }
  .stat { padding:0 var(--s-4); }
  .stat:first-child { padding-left:0; }
  .stat + .stat { border-left:1px solid var(--on-22); }
  .stat-k { font-size:14px; color:var(--on-62); }
  .stat-v { font-size:24px; font-weight:700; letter-spacing:-.01em; margin-top:2px; }
  .stat-link {
    display:inline-flex; align-items:baseline; gap:var(--s-05);
    color:var(--ink-90); text-decoration:none; border-bottom:1px solid var(--on-35);
  }
  .stat-link:hover { border-color:var(--ink-90); }
  .stat-ext { font-size:14px; font-weight:500; color:var(--on-62); }

  .actions { display:flex; align-items:center; gap:var(--s-15); margin:var(--s-4) 0 0; flex-wrap:wrap; }
  .actions .line { flex:1; min-width:var(--s-4); height:1px; background:var(--on-22); }

  @media (max-width:860px) { .console { grid-template-columns:1fr; } }
  @media (max-height:900px) {
    body { padding:var(--s-2); gap:var(--s-2); }
    .console { padding:var(--s-2) var(--inset); gap:var(--s-3); }
    .card { padding:var(--s-2); }
    .mast { padding:var(--s-1) var(--inset); }
    .checking, .verdict, .intro { padding-block:var(--s-3); }
  }
  /* Tablets: two columns are too narrow side by side before the phone rules
     take over, so they stack earlier. */
  @media (max-width:900px) {
    .intro-grid { grid-template-columns:minmax(0,1fr); gap:var(--s-4); }
    .act { max-width:none; }
    .grid { grid-template-columns:minmax(0,1fr); gap:var(--s-4); }
  }

  @media (max-width:620px) {
    html,body { height:auto; overflow:visible; }
    body { height:auto; min-height:100dvh; padding:var(--s-15); gap:var(--s-15); }
    .stage { flex:none; }
    .mast { padding:var(--s-15); gap:var(--s-15); }
    .wordmark { height:20px; }
    .console, .checking, .verdict, .intro {
      padding-block:var(--s-3); padding-inline:var(--s-2); overflow:visible;
    }
    .grid, .intro-grid { grid-template-columns:minmax(0,1fr); gap:var(--s-4); }
    .cn-row, .picker { flex-direction:column; align-items:stretch; }
    .cn-link, .pk-link { display:none; }
    .cn-bracket { width:100%; }
    .stats { grid-template-columns:minmax(0,1fr); gap:var(--s-15); }
    .stat, .stat + .stat { border-left:none; padding:0; }
    .stat + .stat { border-top:1px solid var(--on-22); padding-top:var(--s-15); }
    .actions { flex-direction:column; align-items:stretch; }
    .actions .line { display:none; }
    .actions .btn { width:100%; }
    .btn-long { display:none; }
    .card { height:auto; }
    .steps { max-width:none; }
    .h1 { font-size:34px; }
    .h2 { font-size:28px; line-height:1.14; }
    .intro, .console, .checking, .verdict { min-height:0; }
    /* The chain becomes a vertical list: four boxes across is unreadable. */
    .cn { min-height:44px; font-size:13px; }
    .cn-cap { text-align:left; }
    .cn-cell { align-items:stretch; }
    /* The wallet picker wraps to a grid instead of five columns. */
    .picker { flex-wrap:wrap; }
    .pk-cell { flex:1 1 calc(50% - var(--s-1)); }
    .pk { min-height:48px; font-size:13px; }
    .rail-node { padding:0 var(--s-1); font-size:11px; }
    .rail-link { min-width:var(--s-05); }
    .vals { flex-direction:column; }
    .val { width:100%; }
    .rule { font-size:18px; line-height:28px; }
    .intro-foot { gap:var(--s-15); }
    .intro-foot .btn { flex:1 1 auto; }
    .step { min-height:44px; }
    .step-label { font-size:15px; }
    .field { font-size:16px; }
  }
</style>
</head>
<body>

<div class="mast">
  <div class="brand">
    <svg class="wordmark" viewBox="0 0 115.073 24" role="img" aria-label="Newton" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M9.88853 0.248964C10.4764 -0.0829879 11.1963 -0.0829879 11.7842 0.248964L20.7229 5.31822C21.3068 5.64518 21.6698 6.26209 21.6728 6.93199V17.0685C21.6698 17.7384 21.3068 18.3543 20.7229 18.6823L11.7842 23.7495C11.1963 24.0835 10.4764 24.0835 9.88853 23.7495L0.949858 18.6803C0.365945 18.3523 0.00299955 17.7364 0 17.0665V6.92799C0.0039994 6.25909 0.365945 5.64318 0.949858 5.31622L9.88853 0.248964ZM10.5504 1.57277L1.48778 16.9845C1.42279 17.0975 1.42379 17.2365 1.48978 17.3475C1.55577 17.4595 1.67775 17.5274 1.80773 17.5244H19.929C20.058 17.5254 20.179 17.4575 20.244 17.3465C20.309 17.2345 20.31 17.0965 20.245 16.9845L11.1863 1.57277C11.1193 1.46079 10.9984 1.3918 10.8674 1.3918C10.7364 1.3918 10.6154 1.46079 10.5484 1.57277H10.5504ZM15.4277 12.1152C15.4277 14.6209 13.364 16.6486 10.8124 16.6486C8.26277 16.6486 6.19708 14.6209 6.19708 12.1152C6.19708 9.6116 8.26277 7.58389 10.8124 7.58389C13.364 7.58389 15.4297 9.6116 15.4297 12.1152H15.4277ZM8.91267 13.669C8.91267 13.753 8.94667 13.833 9.00566 13.892C9.06565 13.951 9.14664 13.984 9.23062 13.983H12.3942C12.4781 13.984 12.5591 13.951 12.6191 13.892C12.6791 13.834 12.7131 13.753 12.7141 13.669V10.5615C12.7141 10.3895 12.5721 10.2495 12.3962 10.2495H9.23062C9.05265 10.2495 8.91267 10.3895 8.91267 10.5615V13.669Z"/><path fill="currentColor" d="M29.9959 3.00044H32.7435L41.6722 15.7546V3.00244H44.6317V20.9998H41.8841L32.9555 8.24968V21.0018H29.9959V3.00044ZM49.1411 8.51964C50.1269 7.95972 51.2587 7.68376 52.5326 7.68376C53.8044 7.68376 54.9622 7.93973 55.948 8.45365C56.9339 8.96958 57.7118 9.69947 58.2777 10.6393C58.8436 11.5792 59.1376 12.687 59.1536 13.9548C59.1536 14.2988 59.1276 14.6507 59.0736 15.0107H48.9671V15.1647C49.0371 16.3145 49.405 17.2224 50.0669 17.8903C50.7308 18.5582 51.6107 18.8941 52.7125 18.8941C53.5844 18.8941 54.3163 18.6942 54.9122 18.2902C55.5041 17.8863 55.8  18.7921 96.556 18.3842 97.2819 17.5703C98.0058 16.7544 98.3677 15.7066 98.3677 14.4208H98.3697ZM115.071 13.7509V21.0018H112.218V13.9049C112.218 12.653 111.948 11.7012 111.406 11.0513C110.864 10.3994 110.07 10.0754 109.024 10.0754C107.906 10.0754 107.03 10.4574 106.393 11.2212C105.755 11.9831 105.437 13.033 105.437 14.3708V21.0038H102.609V7.83574H105.071L105.385 9.55949C106.399 8.30767 107.828 7.68376 109.68 7.68376C111.268 7.68376 112.566 8.16369 113.567 9.12355C114.571 10.0834 115.073 11.6252 115.073 13.7529L115.071 13.7509Z"/></svg>
    <button class="badge" id="home" type="button">Lazarus Scan</button>
  </div>
  <div class="pills"><span class="pill"><span class="dot"></span>Sepolia</span></div>
</div>

<div class="stage" id="stage" aria-live="polite"></div>

<script>
const stage = document.getElementById("stage");
const short = (a) => (a ? a.slice(0, 6) + "…" + a.slice(-4) : "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function money(n) {
  if (typeof n !== "number") return null;
  if (n >= 1e6) {
    const m = n / 1e6;
    return "$" + (m >= 10 || Number.isInteger(m) ? Math.round(m) : m.toFixed(1)) + "m";
  }
  if (n >= 1e3) return "$" + Math.round(n / 1e3) + "k";
  return "$" + Math.round(n);
}
const usdLabel = (v) =>
  v === 0 ? "any amount"
  : v >= 1e6 ? "over $" + (v / 1e6).toFixed(1) + "m"
  : "over $" + Math.round(v / 1e3) + "k";

/* The deployed contracts, so the policy can be read rather than trusted. */
const POLICY_ADDRESS = "0x5A46A90e0B26Ed56201F24620dbF701D53433BB8";

/* Every combination below is a policy client already bound to the policy
   with those parameters. Selecting one selects which contract the check is
   submitted to, so the rule is fixed onchain before the wallet is screened. */
const RULES = [
  { hops: 1, usd: 0 },
  { hops: 2, usd: 0 },
  { hops: 3, usd: 0 }, { hops: 3, usd: 1000000 },
];
const HOP_SHOWN = [1, 2, 3];
const HOP_CHOICES = [...new Set(RULES.map((r) => r.hops))].sort();
const USD_CHOICES = [...new Set(RULES.map((r) => r.usd))].sort((a, b) => a - b);

const STEP_LABELS = [
  "Checking the wallet itself",
  "Looking one hop out",
  "Looking two hops out",
  "Looking three hops out",
];

/* Captions say where the wallet sits without naming the verdict. */
const LABELS = {
  direct: "Wallet A", one: "Wallet B", two: "Wallet C",
  three: "Wallet D", clean: "Wallet E",
};

let view = "intro";
let act = 0;
let hops = 3;
let usd = 0;
let inFlight = false;
let presets = [];


/* The chain reads differently in each act: first only the listed address is
   known, then a list check clears everything downstream of it, then the scan
   covers the whole path. Same four nodes throughout, so the argument is made
   by what lights up rather than by three separate diagrams. */
const CHAIN = ["Lazarus wallet", "Direct counterparty", "Second degree", "Wallet you pay"];

const ACTS = [
  { kicker: "Why this exists", title: "The Lazarus Group",
    body: "A North Korean state hacking operation. They have taken billions from "
        + "exchanges and bridges, and their addresses are designated by OFAC.",
    marks: ["known", "off", "off", "off"],
    captions: ["on the list", "", "", "the wallet you pay"] },

  { kicker: "The gap", title: "A list checks one address.",
    body: "It compares the wallet you are paying against a set of designated "
        + "addresses. But the money moved along a path. The wallet is not on "
        + "the list, it is one transfer from a wallet that is, and a list check "
        + "cannot tell you that.",
    marks: ["hit", "pass", "pass", "pass"],
    captions: ["caught", "clears", "clears", "clears the list"],
    bracket: { span: 1, label: "What a list covers" } },

  { kicker: "The policy", title: "Screen the path, not the address.",
    body: "Lazarus Scan walks the transfer graph outward from the wallet you are "
        + "paying and reports how far a known address sits, and how much moved "
        + "along the way.",
    marks: ["hit", "hit", "hit", "hit"],
    captions: ["flagged", "traced", "traced", "blocked, 3 hops"],
    bracket: { span: 4, label: "What the policy covers" } },
];

const flowSteps = () => [
  "The wallet\u2019s transfers are read from the live graph.",
  `The scan walks outward up to ${hops} ${hops === 1 ? "hop" : "hops"}, `
    + "stopping at the first flagged address.",
  "An operator quorum attests the decision onchain.",
];

/* The chain is built once and then only its classes change, so the nodes
   transition between acts instead of being replaced. Re-rendering the markup
   would restart every element and nothing would animate. */
function renderChain() {
  const cells = CHAIN.map((label, i) => `
    <div class="cn-cell">
      <div class="cn" data-node="${i}">${esc(label)}</div>
      <div class="cn-cap" data-cap="${i}"></div>
    </div>`);
  const row = cells.reduce((acc, cell, i) =>
    i === 0 ? cell : acc + '<span class="cn-link"></span>' + cell, "");
  return `<div class="chain">
    <div class="cn-row">${row}</div>
    <div class="cn-bracket" id="bracket" style="--span:0">
      <span class="cn-rule"></span>
      <span class="cn-blabel" id="blabel"></span>
    </div>
  </div>`;
}

/** Move the whole intro to an act: the copy crossfades, the chain restates. */
function paintAct(n, animate = true) {
  act = n;
  const a = ACTS[n];

  const copy = document.getElementById("act-copy");
  const apply = () => {
    copy.innerHTML = `
      <div class="h6">${esc(a.kicker)}</div>
      <div class="h2">${esc(a.title)}</div>
      <p class="p-lg">${esc(a.body)}</p>`;
    copy.classList.remove("fading");
  };
  if (animate && copy) {
    copy.classList.add("fading");
    setTimeout(apply, 180);
  } else if (copy) { apply(); }

  // The nodes carry their own transition, so setting the class is the whole
  // animation. Staggering makes the chain read left to right.
  CHAIN.forEach((_, i) => {
    const node = stage.querySelector(`[data-node="${i}"]`);
    const cap = stage.querySelector(`[data-cap="${i}"]`);
    const set = () => {
      if (node) node.className = "cn " + a.marks[i];
      if (cap) cap.textContent = a.captions[i] || "";
    };
    animate ? setTimeout(set, 90 * i) : set();
  });

  const bracket = document.getElementById("bracket");
  const blabel = document.getElementById("blabel");
  const b = a.bracket;
  const settle = () => {
    bracket.style.setProperty("--span", b ? b.span : 0);
    bracket.classList.toggle("on", Boolean(b));
    blabel.textContent = b ? b.label : "";
  };
  if (bracket) animate ? setTimeout(settle, 90 * CHAIN.length) : settle();

  stage.querySelectorAll(".act-dot").forEach((d, i) =>
    d.classList.toggle("on", i === n));
}

function renderIntro() {
  stage.className = "stage";
  stage.innerHTML = `
    <div class="intro">
      <div class="intro-grid">
        <div class="act">
          <div id="act-copy"></div>
          <div class="intro-foot">
            <button class="btn btn-primary btn-lg" id="go-console">Screen a wallet</button>
            <button class="btn btn-tertiary btn-md" id="next-act">Next</button>
            <div class="acts">
              ${ACTS.map((_, i) => `<button class="act-dot" type="button"
                data-act="${i}" aria-label="Section ${i + 1}"></button>`).join("")}
            </div>
          </div>
        </div>
        <div class="act-figure">${renderChain()}</div>
      </div>
    </div>`;

  document.getElementById("go-console").onclick = () => {
    stopAuto(); view = "console"; renderConsole();
  };
  const next = document.getElementById("next-act");
  if (next) next.onclick = () => {
    stopAuto();
    if (act >= ACTS.length - 1) { view = "console"; renderConsole(); return; }
    paintAct(act + 1);
  };
  stage.querySelectorAll(".act-dot").forEach((b) => {
    b.onclick = () => { stopAuto(); paintAct(Number(b.dataset.act)); };
  });

  paintAct(act, false);
  startAuto();
}

/* The three acts are an argument, so they advance on their own until the
   reader takes over. Any interaction stops it for good. */
let autoTimer = null;
function startAuto() {
  stopAuto();
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  autoTimer = setInterval(() => {
    if (view !== "intro") return stopAuto();
    if (act >= ACTS.length - 1) {
      stopAuto();
      view = "console";
      renderConsole();
      return;
    }
    paintAct(act + 1);
  }, 5000);
}
function stopAuto() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
}

/* ── Console ─────────────────────────────────────────────────── */
function setRule(nextHops, nextUsd) {
  let value = nextUsd;
  if (!RULES.some((r) => r.hops === nextHops && r.usd === value)) {
    // Not every combination has a deployed client. Fall to the nearest that
    // does rather than refusing the click and looking broken.
    const atHops = RULES.filter((r) => r.hops === nextHops).map((r) => r.usd);
    if (atHops.length === 0) return;
    value = atHops.reduce((best, v) =>
      Math.abs(v - nextUsd) < Math.abs(best - nextUsd) ? v : best);
  }
  hops = nextHops;
  usd = value;
  renderConsole(document.getElementById("addr")?.value || "");
}

/* The rail is the distance control: reach is what is lit. */
function renderRail() {
  const parts = [`<span class="rail-node">You</span>`];
  HOP_SHOWN.forEach((n) => {
    const on = n <= hops;
    const live = HOP_CHOICES.includes(n);
    parts.push(`<span class="rail-link ${on ? "on" : ""}"></span>`);
    parts.push(live
      ? `<button class="rail-node ${on ? "on" : ""} ${n === hops ? "sel" : ""}"
           type="button" data-hops="${n}">${n}</button>`
      : `<span class="rail-node ${on ? "on" : ""}">${n}</span>`);
  });
  const lit = hops >= Math.max(...HOP_SHOWN);
  parts.push(`<span class="rail-link ${lit ? "on" : ""}"></span>`);
  parts.push(`<span class="rail-node end">Lazarus</span>`);
  return `<div class="rail">${parts.join("")}</div>`;
}

function renderConsole(prefill = "", error = "") {
  const ready = presets.filter((p) => p.address);
  stage.className = "stage";
  stage.innerHTML = `
    <div class="console">
      <div class="col">
        <div class="h6 muted">Active policy</div>
        <div class="card">
          <div class="card-body">
            <div class="h4">Lazarus Scan</div>
            <p class="rule">Block a wallet that reaches a known Lazarus address.</p>
            ${renderRail()}
            <p class="p-sm muted" style="margin:var(--s-15) 0 0">
              Each step is one transfer. Click a hop to change how far the scan reaches.
            </p>
            <div class="label" style="margin-top:var(--s-3)">Minimum transfer on that path</div>
            <div class="vals">
              ${USD_CHOICES.map((v) => `<button class="val ${v === usd ? "sel" : ""}"
                type="button" data-usd="${v}">${esc(usdLabel(v))}</button>`).join("")}
            </div>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="h6 muted">Screen a wallet</div>
        <div class="card card-check">
          <div class="card-body">
            ${ready.length ? `
            <div>
              <span class="label">Try one of these</span>
              <div class="picker">
                ${ready.map((p) => `
                  <div class="pk-cell">
                    <button class="pk" type="button" data-addr="${esc(p.address)}"
                            title="${esc(p.address)}">
                      <span class="pk-name">${esc(LABELS[p.key] || p.label)}</span>
                      <span class="pk-addr">${esc(short(p.address))}</span>
                    </button>
                  </div>`).join("")}
              </div>
            </div>` : ""}
            <div style="display:flex;flex-direction:column;gap:var(--s-1)">
              <label class="label" for="addr">Enter any Ethereum address</label>
              <input class="field" id="addr" spellcheck="false" autocomplete="off"
                     placeholder="0x…" value="${esc(prefill)}" />
              <p class="err" id="err">${esc(error)}</p>
            </div>
            <div class="flow">
              ${flowSteps().map((t, i) => `<div class="flow-row">
                <span class="flow-n">${i + 1}</span><span>${esc(t)}</span>
              </div>`).join("")}
            </div>
          </div>
          <button class="btn btn-primary btn-lg btn-block" id="run">Run the check</button>
        </div>
      </div>
    </div>`;

  const input = document.getElementById("addr");
  const run = document.getElementById("run");

  stage.querySelectorAll(".rail-node[data-hops]").forEach((b) => {
    b.onclick = () => setRule(Number(b.dataset.hops), usd);
  });
  stage.querySelectorAll(".val").forEach((b) => {
    b.onclick = () => setRule(hops, Number(b.dataset.usd));
  });
  stage.querySelectorAll(".pk").forEach((b) => {
    b.onclick = () => {
      stage.querySelectorAll(".pk").forEach((x) => x.classList.remove("chosen"));
      b.classList.add("chosen");
      input.value = b.dataset.addr;
      input.classList.remove("invalid");
      document.getElementById("err").textContent = "";
      sync();
    };
  });

  const valid = (v) => /^0x[0-9a-fA-F]{40}$/.test(String(v ?? "").trim());
  const sync = () => { run.disabled = !valid(input.value); };
  input.oninput = () => {
    input.classList.remove("invalid");
    document.getElementById("err").textContent = "";
    stage.querySelectorAll(".pk").forEach((x) =>
      x.classList.toggle("chosen", x.dataset.addr === input.value.trim()));
    sync();
  };
  input.onkeydown = (e) => { if (e.key === "Enter" && !run.disabled) run.click(); };
  run.onclick = () => submit(String(input.value ?? "").trim());
  sync();
  if (window.matchMedia("(min-width: 861px)").matches) input.focus();
}

/* ── Checking, then the verdict in the same frame ────────────────
   One panel for both. The scan runs in the left column and stays exactly
   where it is; when the outcome lands the panel takes its colour and the
   right column fills in. Nothing moves, so the result reads as the scan
   resolving rather than as a new screen. */
function renderChecking(address) {
  stage.className = "stage";
  stage.innerHTML = `
    <div class="verdict" id="panel">
      <div class="grid">
        <div class="left">
          <div class="left-stack">
            <div class="steps">
              ${STEP_LABELS.filter((_, n) => n <= hops).map((label, n) => `
                ${n ? '<span class="arrow" aria-hidden="true"></span>' : ""}
                <div class="step ${n === 0 ? "active" : "idle"}" data-step="${n}">
                  <span class="step-label">${esc(label)}</span>
                  <span class="step-note"></span>
                </div>`).join("")}
            </div>
          </div>
        </div>
        <div class="right" id="right-slot">
          <div class="h1">Checking</div>
          <p class="reason p-lg">Tracing the graph outward from this wallet, then
            waiting on an operator quorum.</p>
          <div class="mono p-sm" style="word-break:break-all;margin-top:var(--s-3);color:var(--on-62)">${esc(address)}</div>
        </div>
      </div>
      <div class="actions" id="actions-slot"></div>
    </div>`;

  const rows = () => [...stage.querySelectorAll(".step")];
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  return {
    /** Walk outward. Clean steps go green; the step that finds the path goes
     *  peach, or grey when a path exists but sits below the threshold. */
    async settle(hitAt, kind) {
      const list = rows();
      if (!list.length) return;
      const hit = hitAt === null || hitAt === undefined ? list.length : hitAt;
      for (let n = 0; n < list.length; n++) {
        const row = list[n];
        row.classList.remove("idle");
        row.classList.add("active");
        await wait(430);
        row.classList.remove("active");
        if (n === hit) {
          row.classList.add(kind);
          row.querySelector(".step-note").textContent =
            kind === "below" ? "below threshold" : "exposure found";
          list.slice(n + 1).forEach((r) => r.classList.add("idle"));
          await wait(500);
          row.classList.add("waiting");
          return;
        }
        row.classList.add("clear");
        row.querySelector(".step-note").textContent = "clear";
      }
      await wait(400);
      // The walk is done but the quorum is not. Saying so beats a finished
      // scan sitting still while the request is in flight.
      const last = list[list.length - 1];
      if (last) {
        const note = last.querySelector(".step-note");
        if (note) note.textContent = "waiting on quorum";
        last.classList.add("waiting");
      }
    },
  };
}

/* ── Submit ──────────────────────────────────────────────────── */
async function submit(address) {
  if (inFlight) return;
  const input = document.getElementById("addr");
  if (!/^0x[0-9a-fA-F]{40}$/.test(address)) {
    if (input) {
      input.classList.add("invalid");
      document.getElementById("err").textContent = "That is not a 42-character Ethereum address.";
      input.focus();
    }
    return;
  }
  inFlight = true;
  const search = renderChecking(address);
  try {
    const resp = await fetch("/api/evaluate?address=" + encodeURIComponent(address)
      + "&max_hops=" + hops + "&min_usd=" + usd);
    const result = await resp.json();
    if (result.status === "INVALID_ADDRESS") return renderConsole(address, result.reason);

    // A path found but allowed means the policy's value floor let it through:
    // its own outcome, not a plain pass.
    const belowThreshold = result.exposure && result.decision === "ALLOW";
    await search.settle(result.exposure ? result.hop_count : null,
                        belowThreshold ? "below" : "hit");
    fillVerdict(result, belowThreshold);
  } catch (e) {
    fillVerdict({
      wallet: address.toLowerCase(), status: "SCREENING_FAILED", decision: "DENY",
      detail: String(e.message || e),
    }, false);
  } finally { inFlight = false; }
}

/* ── Verdict ─────────────────────────────────────────────────── */
function renderStats(r) {
  const max = r.dataset?.max_hops ?? hops;
  const distance = r.direct_match ? "On the list"
    : r.exposure ? `${r.hop_count} ${r.hop_count === 1 ? "hop" : "hops"}`
    : "None";
  const value = r.direct_match ? "—"
    : typeof r.exposure_usd === "number" ? money(r.exposure_usd) : "—";
  const decision = r.decision === "ALLOW" ? "Allowed" : "Blocked";

  // The figure links to its transfer only when that transfer is the one the
  // screening reported. When the smallest sits deeper in the path there is
  // no hash for it, and linking the first edge would point at the wrong one.
  const tx = (r.edges || [])[0]?.tx;
  const isFirstEdge = typeof r.first_edge_usd === "number"
    && r.first_edge_usd === r.exposure_usd;
  const valueCell = (tx && isFirstEdge)
    ? `<a class="stat-v stat-link" href="https://etherscan.io/tx/${esc(tx)}"
         target="_blank" rel="noopener" title="The transfer this figure comes from"
         >${esc(value)} <span class="stat-ext">↗</span></a>`
    : `<div class="stat-v">${esc(value)}</div>`;

  return `<div class="stats">
    <div class="stat"><div class="stat-k">Distance</div>
      <div class="stat-v">${esc(distance)}</div></div>
    <div class="stat"><div class="stat-k">Smallest transfer</div>${valueCell}</div>
    <div class="stat"><div class="stat-k">Decision</div>
      <div class="stat-v">${esc(decision)}</div></div>
  </div>`;
}

/** Fill the panel the scan is already sitting in: colour it, write the right
 *  column, add the path below the settled steps. The steps do not move. */
function fillVerdict(r, belowThreshold) {
  const panel = document.getElementById("panel");
  const right = document.getElementById("right-slot");

  const actions = document.getElementById("actions-slot");
  if (!panel || !right) return;

  const max = r.dataset?.max_hops ?? hops;
  const floor = r.dataset?.min_exposure_usd ?? usd;
  const hopWord = (n) => `${n} ${n === 1 ? "hop" : "hops"}`;
  let tone, headline, reason;

  if (r.status === "SCREENING_FAILED") {
    tone = "fail"; headline = "Screening failed";
    reason = "The transaction graph could not be read, so the wallet was not "
           + "screened. The policy denies by default, which is not a finding of exposure.";
  } else if (r.status === "ATTESTATION_FAILED") {
    tone = "fail"; headline = "Not attested";
    reason = "The wallet was screened, but the decision could not be attested, "
           + "so the policy denies by default.";
  } else if (belowThreshold) {
    tone = "pass"; headline = "Compliant";
    reason = `A path exists at ${hopWord(r.hop_count)}, but its smallest transfer `
           + `of ${money(r.exposure_usd)} is below the ${money(floor)} floor this `
           + "policy acts on.";
  } else if (r.exposure) {
    tone = "block"; headline = "Non Compliant";
    reason = r.direct_match
      ? "This wallet is a known Lazarus Group address."
      : `This wallet reaches a known Lazarus Group address in ${hopWord(r.hop_count)}.`;
  } else {
    tone = "pass"; headline = "Compliant";
    reason = `No path to a known Lazarus Group address was found within `
           + `${hopWord(max)}.`;
  }

  panel.classList.add(tone, "settled");
  // The scan's last note said it was waiting; the verdict answers that.
  stage.querySelectorAll(".step.waiting").forEach((row) => {
    row.classList.remove("waiting");
    const note = row.querySelector(".step-note");
    if (note && note.textContent === "waiting on quorum") {
      note.textContent = row.classList.contains("hit") ? "exposure found"
        : row.classList.contains("below") ? "below threshold" : "clear";
    }
  });

  const detail = r.detail || r.attestation?.detail;
  right.innerHTML = `
    <div class="h1">${esc(headline)}</div>
    <p class="reason p-lg">${esc(reason)}</p>
    ${detail ? `<div class="detail">${esc(detail)}</div>` : ""}
    ${r.status === "SCREENING_FAILED" ? "" : renderStats(r)}`;

  actions.innerHTML = `
    <span class="line"></span>
    <button class="btn btn-tertiary btn-md" id="again">New check</button>
    ${r.explorer_url ? `<a class="btn btn-primary btn-md" href="${esc(r.explorer_url)}"
       target="_blank" rel="noopener">View attestation<span class="btn-long">&nbsp;on the Newton explorer</span> ↗</a>` : ""}`;
  actions.classList.add("on");
  document.getElementById("again").onclick = () => renderConsole(r.wallet || "");
}

/* ── Boot ────────────────────────────────────────────────────────
   Wait for the example wallets before the first paint, with a cap so a slow
   file cannot hold the page blank. Painting twice shows an empty console. */
document.getElementById("home").onclick = () => {
  if (view === "intro") return;
  view = "intro"; act = 0; renderIntro();
};

(async function boot() {
  const wallets = fetch("data/demo_wallets.json")
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null);
  const data = await Promise.race([wallets, new Promise((r) => setTimeout(() => r(null), 1200))]);
  const loaded = data?.wallets;
  if (Array.isArray(loaded)) presets = loaded.filter((w) => w.address);
  renderIntro();
})();
</script>
