<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Newton — Lazarus exposure screening</title>
<meta name="description" content="Screen an Ethereum wallet for direct or indirect exposure to the Lazarus Group within three hops, and enforce the result as a Newton policy." />
<meta property="og:title" content="Newton — Lazarus exposure screening" />
<meta property="og:description" content="Screen the wallet. Trace its exposure. Enforce the result." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ── Tokens (lib/ds.ts) ───────────────────────────────────── */
  :root {
    --ink:#1B1B1B; --ink2:#333333;
    --field:#F1F1F1; --surface:#FFFFFF;
    --hairline:#E2E2E2; --control:#CCCCCC;
    --body:#4A4A4A; --muted:#6B6B6B; --muted2:#767676;
    --pass:#3F6F55; --flag:#C2621A; --error:#8E2B1F;
    --accent:#1B1B1B; --accent-tint:#ECECEC;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --inset:clamp(24px,4vw,48px);
    --r-sm:8px; --r-lg:16px; --r-xl:24px; --pill:999px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    background:var(--field); color:var(--ink);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    letter-spacing:-0.006em;
    padding:24px; display:flex; flex-direction:column; gap:24px;
    min-height:100vh;
  }
  .label { font-size:14px; line-height:20px; font-weight:500; }
  .small { font-size:14px; line-height:20px; font-weight:400; }
  .caption { font-size:14px; color:var(--muted); }
  :focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }

  .preview-note {
    display:none; background:var(--ink); color:var(--surface);
    border-radius:var(--r-sm); padding:12px 16px; font-size:14px;
  }
  body.is-preview .preview-note { display:block; }

  /* ── Masthead ─────────────────────────────────────────────── */
  .mast {
    background:var(--surface); border:1px solid var(--hairline);
    border-radius:var(--r-lg);
    display:flex; align-items:center; justify-content:space-between;
    gap:24px; padding:12px var(--inset); flex-wrap:wrap;
  }
  .brand { display:flex; align-items:center; gap:14px; }
  .wordmark { height:22px; width:auto; color:var(--ink); display:block; }
  .badge {
    background:var(--ink); color:var(--surface); border-radius:var(--pill);
    padding:8px 16px; font-size:12px; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase;
  }
  .networks { display:flex; gap:8px; flex-wrap:wrap; }
  .status {
    display:flex; align-items:center; gap:9px; height:40px;
    border:1px solid var(--hairline); border-radius:var(--pill);
    padding:0 16px; background:var(--field); white-space:nowrap;
  }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--pass); display:block; }
  .dot.idle { background:var(--muted2); }

  .stage {
    position:relative; background:var(--surface);
    border:1px solid var(--hairline); border-radius:var(--r-xl);
    overflow:hidden; display:flex;
  }
  .stage.result { min-height:520px; }

  /* ── Console ──────────────────────────────────────────────── */
  .console {
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:stretch; gap:24px 40px;
    padding:40px var(--inset); max-width:1060px; width:100%;
  }
  @media (min-width:821px) { .console { grid-auto-rows:600px; } }
  @media (max-width:820px) { .console { grid-template-columns:1fr; gap:32px; } }
  .col { display:flex; flex-direction:column; gap:16px; min-width:0; }
  .card {
    flex:1; min-height:0; display:flex; flex-direction:column;
    border-radius:12px; padding:26px; overflow:hidden;
  }
  .card-scroll {
    flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column;
    scrollbar-width:thin; scrollbar-color:var(--control) transparent;
  }
  .card-scroll::-webkit-scrollbar { width:6px; }
  .card-scroll::-webkit-scrollbar-thumb { background:var(--control); border-radius:3px; }
  .head { font-size:14px; font-weight:500; color:var(--ink); }

  .policy-card { background:var(--field); border:1px solid var(--ink); }
  .check-card  { background:var(--surface); border:1px solid var(--hairline); }
  .check-card .card-scroll { gap:16px; }
  .policy-title { font-size:24px; font-weight:600; letter-spacing:-.01em; }
  .policy-body { font-size:16px; line-height:24px; color:var(--body); margin-top:12px; max-width:44ch; }
  .policy-rules {
    margin-top:18px; padding-top:16px; border-top:1px solid var(--control);
    display:flex; flex-direction:column; gap:8px;
  }
  .policy-rule { display:flex; gap:14px; font-size:14px; line-height:20px; color:var(--muted); }
  .policy-rule b {
    font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums;
    min-width:10px;
  }

  .field-label { font-size:14px; font-weight:500; color:var(--muted); }
  .field {
    width:100%; height:64px; border:1px solid var(--control);
    border-radius:var(--r-sm); background:var(--surface);
    padding:0 16px; font-family:var(--mono); font-size:16px; color:var(--ink);
  }
  .field::placeholder { color:var(--muted2); }
  .field.invalid { border-color:var(--error); }

  .examples { display:flex; flex-direction:column; gap:8px; }
  .example {
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    width:100%; min-height:56px; padding:0 20px; text-align:left;
    border:1px solid var(--control); background:var(--surface);
    border-radius:var(--r-sm); font-family:var(--sans); color:var(--ink);
    cursor:pointer; transition:border-color .12s, background .12s;
  }
  .example:hover:not(:disabled) { border-color:var(--ink); background:var(--accent-tint); }
  .example:disabled { cursor:default; opacity:.5; }
  .example-label { font-size:15px; font-weight:500; }
  .example-addr { font-family:var(--mono); font-size:13px; color:var(--muted); }

  .or { display:flex; align-items:center; gap:16px; margin:4px 0; }
  .or-line { flex:1; height:1px; background:var(--hairline); }
  .or-text { font-size:13px; color:var(--muted); }

  .action {
    margin-top:16px; height:64px; flex-shrink:0; width:100%; border-radius:var(--pill);
    background:var(--accent); color:#fff; border:none; cursor:pointer;
    font-family:var(--sans); font-size:14px; font-weight:500;
  }
  .action[disabled] { background:var(--muted2); cursor:default; }
  .action.secondary {
    background:transparent; color:var(--ink); border:1px solid var(--ink);
  }
  .console-error { font-size:14px; color:var(--error); min-height:20px; margin:0; }

  /* ── Checking ─────────────────────────────────────────────── */
  .checking {
    width:100%; padding:clamp(20px,4vh,56px) var(--inset);
    display:flex; flex-direction:column; justify-content:center; gap:20px;
  }
  .checking-head { font-size:clamp(28px,4vw,40px); font-weight:600; letter-spacing:-.02em; }
  .checking-addr { font-family:var(--mono); font-size:15px; color:var(--body); word-break:break-all; }
  .checking-note { font-size:15px; line-height:24px; color:var(--muted); max-width:46ch; }
  .bar { height:2px; background:var(--hairline); border-radius:2px; overflow:hidden; max-width:320px; }
  .bar span {
    display:block; height:100%; width:35%; background:var(--ink);
    animation:slide 1.4s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform:translateX(-100%);} 100% { transform:translateX(320%);} }
  .elapsed { font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }

  /* ── Verdict ──────────────────────────────────────────────── */
  .verdict {
    padding:clamp(20px,4vh,56px) var(--inset); width:100%;
    display:flex; flex-direction:column; justify-content:center;
  }
  .verdict.pass  { background:linear-gradient(135deg,#e7f0ea,#d6e6dc); }
  .verdict.block { background:linear-gradient(135deg,#f6e4d3,#f0d3b8); }
  .verdict.fail  { background:linear-gradient(135deg,#eceaea,#dcd8d8); }
  .headline { font-size:clamp(34px,5.5vw,64px); line-height:1.02; font-weight:600; letter-spacing:-.03em; }
  .reason { font-size:18px; line-height:28px; margin-top:14px; max-width:48ch; }
  .detail {
    font-family:var(--mono); font-size:13px; line-height:20px;
    color:rgba(27,27,27,.66); margin-top:12px; max-width:60ch; word-break:break-word;
  }

  /* ── Hop ladder ───────────────────────────────────────────── */
  .ladder-label { font-size:14px; color:rgba(27,27,27,.66); margin-top:28px; }
  .ladder { display:flex; gap:6px; margin-top:10px; }
  .rung {
    flex:1; display:flex; flex-direction:column; gap:3px; min-width:0;
    border:1px solid rgba(27,27,27,.24); border-radius:10px;
    padding:10px 12px; font-size:13px; color:rgba(27,27,27,.62);
  }
  .rung-n {
    font-variant-numeric:tabular-nums; font-weight:600; font-size:11px;
    color:rgba(27,27,27,.5);
  }
  .rung-l { font-weight:500; }
  .rung.hit {
    border-color:var(--ink); background:var(--ink); color:var(--surface);
  }
  .rung.hit .rung-n { color:rgba(255,255,255,.7); }
  @media (max-width:700px) {
    .ladder { flex-direction:column; }
    .rung { flex-direction:row; align-items:center; gap:10px; }
  }

  /* ── Exposure path ────────────────────────────────────────── */
  .value-row { display:flex; align-items:baseline; gap:14px; margin-top:8px; flex-wrap:wrap; }
  .value-amount { font-size:28px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .value-note { font-size:14px; color:rgba(27,27,27,.62); }
  .path { display:flex; align-items:stretch; gap:10px; margin-top:28px; flex-wrap:wrap; }
  .node {
    display:flex; flex-direction:column; gap:6px; padding:14px 16px;
    border:1px solid rgba(27,27,27,.24); border-radius:12px;
    background:rgba(255,255,255,.55); min-width:0;
  }
  .node.origin { border-color:var(--ink); background:rgba(255,255,255,.9); }
  .node.match  { border-color:var(--ink); background:rgba(27,27,27,.1); }
  .node-addr { font-family:var(--mono); font-size:14px; color:var(--ink); text-decoration:none; }
  .node-addr:hover { text-decoration:underline; }
  .node-role { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:rgba(27,27,27,.62); }
  .arrow { align-self:center; font-size:17px; color:rgba(27,27,27,.5); }
  .arrow::after { content:'→'; }
  @media (max-width:700px) {
    .path { flex-direction:column; align-items:stretch; }
    .arrow { align-self:flex-start; padding-left:22px; }
    .arrow::after { content:'↓'; }
  }

  .rule { display:flex; align-items:center; gap:20px; margin:32px 0 24px; flex-wrap:wrap; }
  .rule .line { flex:1; min-width:32px; height:1px; background:rgba(27,27,27,.18); }
  .btn-out, .btn-fill {
    flex-shrink:0; height:48px; padding:0 24px; border-radius:var(--pill);
    display:flex; align-items:center; font-size:14px; font-weight:500;
    font-family:var(--sans); cursor:pointer; text-decoration:none;
  }
  .btn-out  { border:1px solid var(--ink); background:transparent; color:var(--ink); }
  .btn-fill { background:var(--ink); color:#fff; border:none; }

  .parties { display:flex; align-items:flex-start; gap:32px; flex-wrap:wrap; }
  .party { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .party-label { font-size:14px; color:rgba(27,27,27,.66); }
  .party-addr { font-family:var(--mono); font-size:15px; word-break:break-all; }
  .tag { font-size:12px; font-weight:600; border-radius:var(--pill); padding:2px 10px; margin-left:9px; }
  .tag.clear { border:1px solid var(--pass); color:var(--pass); }
  .tag.desig { background:var(--flag); color:#fff; }
  .tag.unknown { border:1px solid rgba(27,27,27,.4); color:rgba(27,27,27,.7); }

  .copy {
    border:none; background:none; padding:0; margin-left:10px; cursor:pointer;
    font-family:var(--sans); font-size:13px; color:rgba(27,27,27,.66);
    text-decoration:underline; text-underline-offset:2px;
  }

  /* ── Rules disclosure ─────────────────────────────────────── */
  .policy-card .rules { margin-top:auto; border-top:1px solid var(--control); }
  .policy-card .rules summary { padding:14px 0 0; }
  .policy-card .rule-item { padding:12px 0 0; }
  .policy-card .rule-meta { border-top-color:var(--control); }
  .rules { border-top:1px solid var(--hairline); }
  .verdict .rules { margin-top:28px; border-top-color:rgba(27,27,27,.18); }
  .rules summary {
    list-style:none; cursor:pointer; padding:16px 0;
    font-size:14px; font-weight:500; display:flex;
    align-items:center; justify-content:space-between; gap:12px;
  }
  .rules summary::-webkit-details-marker { display:none; }
  .rules summary::after { content:'+'; font-size:18px; font-weight:400; opacity:.55; }
  .rules[open] summary::after { content:'–'; }
  .rule-item { padding:0 0 14px; max-width:62ch; }
  .rule-title { font-size:14px; font-weight:500; }
  .rule-detail { font-size:14px; line-height:20px; color:rgba(27,27,27,.68); margin-top:4px; }
  .rule-meta {
    font-size:13px; line-height:20px; color:rgba(27,27,27,.6);
    padding:12px 0 16px; border-top:1px solid rgba(27,27,27,.14);
  }

  .footnote {
    font-size:13px; line-height:20px; color:var(--muted);
    max-width:78ch; padding:0 var(--inset) 8px;
  }
</style>
</head>
<body>

<p class="preview-note">Preview mode. Results are fixtures, not live screenings.</p>

    <span class="status"><span class="dot"></span><span class="label">Ethereum, traced live</span></span>

<script>
const PREVIEW = new URLSearchParams(location.search).has("preview");
if (PREVIEW) document.body.classList.add("is-preview");

const stage = document.getElementById("stage");
const short = (a) => a ? a.slice(0, 6) + "…" + a.slice(-4) : "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function when(iso) {
  const d = new Date(iso || Date.now());
  const date = d.toLocaleDateString("en-GB",
    { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
  const time = d.toLocaleTimeString("en-GB",
    { hour: "2-digit", minute: "2-digit", timeZone: "UTC" });
  return `${date}, ${time} UTC`;
}

const DEFAULT_PRESETS = [
  { key: "direct", label: "Known Lazarus address", address: "" },
  { key: "one",    label: "1 hop away",           address: "" },
  { key: "two",    label: "2 hops away",          address: "" },
  { key: "three",  label: "3 hops away",          address: "" },
  { key: "clean",  label: "No exposure",          address: "" },
];

let presets = DEFAULT_PRESETS;
let selected = null;
let inFlight = false;

/* ── Fixtures, preview mode only ─────────────────────────────── */
const PREVIEW_RULES = {
  ready: true,
  dataset: {
    seeds: 3597, services: 52659,
    graph_source: "Etherscan, queried at the time of the check",
    coverage: { level1_nodes_found: 2600, level1_nodes_expanded: 2600 },
  },
  rules: [
    { title: "Traversal stops at services",
      detail: "Exchanges, bridges, mixers and contracts can end a path but never sit in the middle of one. Without this, every address that has ever used a major exchange would be three hops from Lazarus." },
    { title: "High-degree addresses are treated the same way",
      detail: "Any address with more than 5000 transactions is treated as a service whether or not it is labelled, which catches the hubs no attribution source has named." },
    { title: "Small transfers are ignored",
      detail: "Edges below 0.1 ETH, or 1000 USDT, 1000 USDC, 1000 DAI, do not count. Without a floor, anyone could taint any wallet by sending it dust, which is an attack that happens rather than a theory." },
    { title: "Only major tokens count",
      detail: "Transfers of tokens outside the list above are ignored entirely, because spam tokens are the main way dust reaches a wallet." },
    { title: "Distance is measured to three hops",
      detail: "Beyond three hops the check says nothing at all. A wallet reported as having no exposure has no path found under these rules, which is not the same as a clean wallet." },
  ],
};

const FIXTURES = {
  direct: { hop_count: 0, direct_match: true, exposure: true },
  one:    { hop_count: 1, exposure: true },
  two:    { hop_count: 2, exposure: true },
  three:  { hop_count: 3, exposure: true },
  clean:  { exposure: false },
};

function fixture(key) {
  const seed = "0x098b716b8aaf21512996dc57eb0615e2383e2f96";
  const chain = ["0x4444444444444444444444444444444444444444",
                 "0x2222222222222222222222222222222222222222",
                 "0x3333333333333333333333333333333333333333"];
  const f = FIXTURES[key] || FIXTURES.clean;
  const base = {
    wallet: chain[0], evaluated_at: new Date().toISOString(),
    dataset: { seeds: 3597, max_depth: 3 },
    direct_match: !!f.direct_match, exposure: f.exposure,
    hop_count: f.hop_count ?? null, matched_wallet: f.exposure ? seed : null,
    path: [], nodes: [], attestation: { status: "NOT_CONFIGURED" },
  };
  if (!f.exposure) return { ...base, status: "COMPLIANT", decision: "ALLOW" };
  const path = f.hop_count === 0 ? [seed]
    : [chain[0], ...chain.slice(1, f.hop_count), seed];
  return {
    ...base,
    wallet: f.hop_count === 0 ? seed : chain[0],
    path,
    nodes: path.map((a) => ({
      address: a, role: a === seed ? "lazarus" : "wallet",
      label: a === seed ? "Lazarus Group" : null,
    })),
    status: "NON_COMPLIANT", decision: "DENY",
  };
}

/* ── Hop ladder ──────────────────────────────────────────────── */
const BANDS = [
  { n: "0", label: "Lazarus wallet" },
  { n: "1", label: "1 hop" },
  { n: "2", label: "2 hops" },
  { n: "3", label: "3 hops" },
  { n: "",  label: "Beyond 3" },
];

function renderLadder(hop) {
  const index = hop === null || hop === undefined ? 4 : hop;
  const rungs = BANDS.map((b, i) => `
    <span class="rung ${i === index ? "hit" : ""}">
      ${b.n ? `<span class="rung-n">${b.n}</span>` : ""}
      <span class="rung-l">${esc(b.label)}</span>
    </span>`).join("");
  return `<div class="ladder-label">Distance to the nearest Lazarus address</div>
          <div class="ladder">${rungs}</div>`;
}

/* ── Rules disclosure ────────────────────────────────────────── */
let rulesCache = null;

async function loadRules() {
  if (rulesCache) return rulesCache;
  if (PREVIEW) { rulesCache = PREVIEW_RULES; return rulesCache; }
  try {
    const resp = await fetch("/api/rules");
    rulesCache = resp.ok ? await resp.json() : null;
  } catch (e) { rulesCache = null; }
  return rulesCache;
}

function renderRules(data) {
  if (!data) return "";
  const items = (data.rules || []).map((r) => `
    <div class="rule-item">
      <div class="rule-title">${esc(r.title)}</div>
      <div class="rule-detail">${esc(r.detail)}</div>
    </div>`).join("");

  const d = data.dataset || {};
  const meta = [
    d.seeds ? `${d.seeds} Lazarus addresses in the seed set` : null,
    d.services ? `${d.services} service addresses treated as terminal` : null,
    d.graph_source ? esc(d.graph_source) : null,
    d.coverage?.level1_nodes_found
      ? `Neighbourhood covers ${d.coverage.level1_nodes_expanded} of ` +
        `${d.coverage.level1_nodes_found} first-hop addresses, highest value first`
      : null,
  ].filter(Boolean).join(" · ");

  return `<details class="rules">
    <summary>How this check works</summary>
    ${items}
    ${meta ? `<div class="rule-meta">${meta}</div>` : ""}
  </details>`;
}

/* ── Console ─────────────────────────────────────────────────── */
function renderConsole(prefill = "", error = "") {
  const ready = presets.filter((p) => p.address);

  stage.className = "stage";
  stage.innerHTML = `
    <div class="console">
      <div class="col">
        <div class="head">Active policy</div>
        <div class="card policy-card">
          <div class="card-scroll">
          <div class="policy-title">Lazarus Exposure</div>
          <div class="policy-body">
            Blocks a wallet that reaches a known Lazarus Group address within three hops.
          </div>
          <div class="policy-rules">
            <span class="policy-rule"><b>0</b><span>the wallet is itself a known address</span></span>
            <span class="policy-rule"><b>1</b><span>it dealt with one directly</span></span>
            <span class="policy-rule"><b>2</b><span>one wallet sits in between</span></span>
            <span class="policy-rule"><b>3</b><span>two wallets sit in between</span></span>
          </div>
          <div class="policy-body" style="margin-top:16px">
            A second threshold sets how much has to have moved along that path
            before the connection counts.
          </div>
          <div id="console-rules"></div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="head">Screen a wallet</div>
        <div class="card check-card">
          <div class="card-scroll">
        ${ready.length ? `<div class="examples" id="presets"></div>
        <div class="or">
          <span class="or-line"></span>
          <span class="or-text">or</span>
          <span class="or-line"></span>
        </div>` : ""}
        <div style="display:flex;flex-direction:column;gap:8px">
          <label class="field-label" for="addr">Any Ethereum address</label>
          <input class="field" id="addr" spellcheck="false" autocomplete="off"
                 placeholder="0x…" value="${esc(prefill)}" />
          <p class="console-error" id="err">${esc(error)}</p>
        </div>
          </div>
          <button class="action" id="go">Run the check</button>
        </div>
      </div>
    </div>`;

  const input = document.getElementById("addr");
  const go = document.getElementById("go");

  // Only wallets with an address are offered. Five dead buttons reading
  // "not yet configured" would be a worse first impression than none.
  const wrap = document.getElementById("presets");
  if (wrap) {
    ready.forEach((p) => {
      const b = document.createElement("button");
      b.className = "example";
      b.type = "button";
      b.innerHTML = `<span class="example-label">${esc(p.label)}</span>` +
        `<span class="example-addr">${esc(short(p.address))}</span>`;
      b.onclick = () => { selected = p.key; submit(p.address); };
      wrap.appendChild(b);
    });
  }

  loadRules().then((data) => {
    const slot = document.getElementById("console-rules");
    if (slot && data) slot.innerHTML = renderRules(data);
  });

  input.oninput = () => { selected = null; input.classList.remove("invalid"); };
  input.onkeydown = (e) => { if (e.key === "Enter") go.click(); };
  go.onclick = () => submit(input.value.trim());

  // Autofocus opens the keyboard on a phone and hides everything above it.
  if (window.matchMedia("(min-width: 821px)").matches) input.focus();
}

/* ── Checking ────────────────────────────────────────────────── */
function renderChecking(address) {
  stage.className = "stage result";
  stage.innerHTML = `
    <div class="checking">
      <div class="checking-head">Checking</div>
      <div class="checking-addr">${esc(address)}</div>
      <div class="bar"><span></span></div>
      <p class="checking-note">
        Tracing the transaction graph, then submitting the result to Newton for
        evaluation. Waiting on an operator quorum can take up to two minutes.
      </p>
      <div class="elapsed" id="elapsed">0s</div>
    </div>`;

  // An honest elapsed counter, rather than invented stages. The page cannot
  // observe where the request is, and pretending otherwise would be a lie the
  // user could catch.
  const started = Date.now();
  const el = document.getElementById("elapsed");
  const tick = setInterval(() => {
    if (!document.getElementById("elapsed")) return clearInterval(tick);
    el.textContent = Math.round((Date.now() - started) / 1000) + "s";
  }, 1000);
  return () => clearInterval(tick);
}

/* ── Submit ──────────────────────────────────────────────────── */
async function submit(address) {
  if (inFlight) return;

  const input = document.getElementById("addr");
  if (!/^0x[0-9a-fA-F]{40}$/.test(address)) {
    if (input) {
      input.classList.add("invalid");
      document.getElementById("err").textContent =
        "That is not a 42-character Ethereum address.";
      input.focus();
    }
    return;
  }

  inFlight = true;
  const stopClock = renderChecking(address);

  try {
    let result;
    if (PREVIEW) {
      await new Promise((r) => setTimeout(r, 1200));
      if (selected === "fail") throw new Error("etherscan unavailable");
      result = fixture(selected || "clean");
    } else {
      const resp = await fetch("/api/evaluate?address=" + encodeURIComponent(address));
      result = await resp.json();
    }
    stopClock();
    if (result.status === "INVALID_ADDRESS") {
      renderConsole(address, result.reason);
      return;
    }
    renderVerdict(result);
  } catch (e) {
    stopClock();
    renderVerdict({
      wallet: address.toLowerCase(),
      status: "SCREENING_FAILED", decision: "DENY",
      reason: "Unable to complete exposure check",
      detail: String(e.message || e),
      evaluated_at: new Date().toISOString(),
    });
  } finally {
    inFlight = false;
  }
}

/* ── Verdict ─────────────────────────────────────────────────── */
function roleLabel(node, index) {
  if (node.role === "lazarus") return node.label || "Lazarus Group";
  if (index === 0) return "Submitted wallet";
  if (node.role === "service") return node.label || "Service";
  return "Intermediary";
}

function money(n) {
  if (typeof n !== "number") return null;
  if (n >= 1e6) return "$" + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "m";
  if (n >= 1e3) return "$" + Math.round(n / 1e3) + "k";
  return "$" + Math.round(n);
}

function renderValue(r) {
  const amount = money(r.exposure_usd);
  if (!amount) return "";
  return `<div class="ladder-label" style="margin-top:24px">Value of the exposure</div>
    <div class="value-row">
      <span class="value-amount">${esc(amount)}</span>
      <span class="value-note">smallest transfer along the path</span>
    </div>`;
}

function renderPath(result) {
  const nodes = result.nodes?.length
    ? result.nodes
    : (result.path || []).map((a) => ({ address: a, role: "wallet" }));
  if (nodes.length < 2) return "";

  const parts = nodes.map((n, i) => {
    const cls = i === 0 ? "origin" : (n.role === "lazarus" ? "match" : "");
    return `<div class="node ${cls}">
      <a class="node-addr" href="https://etherscan.io/address/${esc(n.address)}"
         target="_blank" rel="noopener"
         title="${esc(n.address)}">${esc(short(n.address))}</a>
      <span class="node-role">${esc(roleLabel(n, i))}</span>
    </div>`;
  });

  return `<div class="path">${
    parts.join('<span class="arrow" aria-hidden="true"></span>')
  }</div>`;
}

function renderVerdict(r) {
  document.getElementById("attest-pill").hidden =
    r.attestation?.status !== "ATTESTED";

  const screeningFailed = r.status === "SCREENING_FAILED";
  // A screening that succeeded but could not be attested is neither a pass nor
  // a finding of exposure. Before this branch existed it fell through and a
  // clean wallet rendered as Compliant while the payload said DENY.
  const attestationFailed = r.status === "ATTESTATION_FAILED";

  let tone, headline, reason, body = "", tag;

  if (screeningFailed) {
    tone = "fail";
    headline = "Screening failed";
    reason = "The transaction graph could not be read, so the wallet was not screened. "
           + "The policy denies by default. This is not a finding of exposure.";
    tag = '<span class="tag unknown">Unscreened</span>';
  } else if (attestationFailed) {
    tone = "fail";
    headline = "Not attested";
    reason = "The wallet was screened, but the decision could not be attested, so it "
           + "carries no proof and the policy denies by default.";
    body = renderLadder(r.hop_count) + renderPath(r);
    tag = '<span class="tag unknown">Unattested</span>';
  } else if (r.exposure) {
    tone = "block";
    headline = "Non&nbsp;Compliant";
    reason = r.direct_match
      ? "This wallet is a known Lazarus Group address. The transfer is blocked."
      : "This wallet reaches a known Lazarus Group address in "
        + r.hop_count + (r.hop_count === 1 ? " hop" : " hops") + ". The transfer is blocked.";
    body = renderLadder(r.hop_count) + renderValue(r) + renderPath(r);
    tag = '<span class="tag desig">Exposed</span>';
  } else {
    tone = "pass";
    headline = "Compliant";
    reason = "No path to a known Lazarus Group address was found within three hops. "
           + "The transfer may proceed.";
    body = renderLadder(null);
    tag = '<span class="tag clear">Clear</span>';
  }

  const detail = r.detail || r.attestation?.detail;

  stage.className = "stage result";
  stage.innerHTML = `
    <div class="verdict ${tone}">
      <div class="headline">${headline}</div>
      <div class="reason">${esc(reason)}</div>
      ${detail ? `<div class="detail">${esc(detail)}</div>` : ""}
      ${body}
      <div class="rule">
        <div class="line"></div>
        <button class="btn-out" id="again">New check</button>
        ${r.explorer_url ? `<a class="btn-fill" href="${esc(r.explorer_url)}"
           target="_blank" rel="noopener">View attestation on the Newton explorer ↗</a>` : ""}
      </div>
      <div class="parties">
        <div class="party">
          <span class="party-label">Wallet ${tag}<button class="copy" id="copy">Copy</button></span>
          <span class="party-addr">${esc(r.wallet)}</span>
        </div>
        <div class="party">
          <span class="party-label">Decided</span>
          <span class="small">${esc(when(r.evaluated_at))}</span>
        </div>
      </div>
      <div id="verdict-rules"></div>
    </div>`;

  document.getElementById("again").onclick = () => renderConsole();

  const copy = document.getElementById("copy");
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(r.wallet);
      copy.textContent = "Copied";
      setTimeout(() => { copy.textContent = "Copy"; }, 1600);
    } catch (e) { copy.textContent = "Copy failed"; }
  };

  loadRules().then((data) => {
    const slot = document.getElementById("verdict-rules");
    if (slot && data) slot.innerHTML = renderRules(data);
  });
}

/* ── Boot ────────────────────────────────────────────────────── */
// Paint first. Waiting on a fetch before the first render meant a blank stage
// on a cold start, and nothing at all if the request hung.
renderConsole();

if (!PREVIEW) {
  fetch("data/demo_wallets.json")
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => {
      const loaded = d?.wallets;
      if (Array.isArray(loaded) && loaded.some((w) => w.address)) {
        presets = loaded;
        renderConsole();
      }
    })
    .catch(() => { /* the manual field is always there */ });
}
</script>
</body>
</html>
