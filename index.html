<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Newton — Lazarus exposure screening</title>
<meta name="description" content="Screen an Ethereum wallet for direct or indirect exposure to the Lazarus Group within three hops, and enforce the result as a Newton policy." />
<meta property="og:title" content="Newton — Lazarus exposure screening" />
<meta property="og:description" content="Screen the wallet. Trace its exposure. Enforce the result." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ── Magic design system ──────────────────────────────────────────────
     Colour, spacing and type taken from the system rather than invented:
     8px layout grid, 4px baseline, Inter with a mono face for addresses. */
  :root {
    /* Ink */
    --ink-90:#1B171A; --ink-70:#77767A; --ink-50:#B0B4BA;
    --ink-30:#E0E0E3; --ink-10:#F0F0FA; --paper:#FFFFFF;
    /* Brand and semantics */
    --magic-50:#6859FF; --magic-30:#A790FF; --magic-10:#EEEBFF; --magic-90:#3512B2;
    --leaf-50:#00CC8F; --leaf-10:#A3FAF3; --leaf-90:#005047;
    --ruby-50:#FC5C36; --ruby-10:#FFE3DC; --ruby-90:#932303;
    --black:#000000;
    --gold-50:#DBA550; --gold-10:#F7ECD9;

    /* Spacing: 1 unit = 8px */
    --s-05:4px; --s-1:8px; --s-15:12px; --s-2:16px; --s-3:24px;
    --s-4:32px; --s-5:40px; --s-6:48px; --s-8:64px; --s-10:80px;

    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --pill:999px;
    --inset:clamp(var(--s-3),4vw,var(--s-6));
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    background:var(--ink-10); color:var(--ink-90);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    padding:var(--s-3); display:flex; flex-direction:column; gap:var(--s-3);
    min-height:100vh;
  }
  :focus-visible { outline:2px solid var(--magic-50); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }

  /* ── Type scale ─────────────────────────────────────────────── */
  .h1 { font-size:clamp(34px,4.4vw,60px); line-height:1.04; font-weight:700; letter-spacing:-.025em; }
  .h3 { font-size:clamp(32px,4vw,48px); line-height:1.16; font-weight:700; letter-spacing:-.01em; }
  .h4 { font-size:20px; line-height:32px; font-weight:700; }
  .h6 { font-size:12px; line-height:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  .p-lg { font-size:18px; line-height:28px; }
  .p-std { font-size:16px; line-height:24px; }
  .p-sm { font-size:14px; line-height:24px; }
  .mono { font-family:var(--mono); }
  .muted { color:var(--ink-70); }

  /* ── Masthead ───────────────────────────────────────────────── */
  .mast {
    background:var(--paper); border:1px solid var(--ink-30); border-radius:var(--r-lg);
    display:flex; align-items:center; justify-content:space-between;
    gap:var(--s-3); padding:var(--s-15) var(--inset); flex-wrap:wrap;
  }
  .brand { display:flex; align-items:center; gap:var(--s-2); }
  .wordmark { height:22px; width:auto; color:var(--ink-90); display:block; }
  .badge {
    background:var(--ink-90); color:var(--paper); border-radius:var(--pill);
    padding:var(--s-1) var(--s-2); font-size:12px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase;
  }
  .pills { display:flex; gap:var(--s-1); flex-wrap:wrap; }
  .pill {
    display:flex; align-items:center; gap:var(--s-1); height:40px;
    border:1px solid var(--ink-30); border-radius:var(--pill);
    padding:0 var(--s-2); background:var(--ink-10);
    font-size:14px; font-weight:500; white-space:nowrap;
  }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--leaf-50); }

  /* ── Stage and cards ────────────────────────────────────────── */
  .stage {
    background:var(--paper); border:1px solid var(--ink-30);
    border-radius:var(--r-xl); overflow:hidden; display:flex; flex:1;
  }
  .console {
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:stretch; gap:var(--s-5);
    padding:var(--s-5) var(--inset); max-width:1120px; width:100%;
  }
  @media (max-width:860px) { .console { grid-template-columns:1fr; gap:var(--s-4); } }
  .col { display:flex; flex-direction:column; gap:var(--s-2); min-width:0; }
  .card {
    flex:1; min-height:0; display:flex; flex-direction:column;
    border-radius:var(--r-md); padding:var(--s-3); overflow:hidden;
  }
  @media (min-width:861px) { .card { max-height:600px; } }
  .card-policy { background:var(--ink-10); border:1px solid var(--ink-90); }
  .card-check  { background:var(--paper); border:1px solid var(--ink-30); }
  .card-body {
    flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column;
    scrollbar-width:thin; scrollbar-color:var(--ink-30) transparent;
  }
  .card-body::-webkit-scrollbar { width:6px; }
  .card-body::-webkit-scrollbar-thumb { background:var(--ink-30); border-radius:3px; }
  .card-check .card-body { gap:var(--s-2); }

  .policy-rules {
    margin-top:var(--s-3); padding-top:var(--s-2);
    border-top:1px solid var(--ink-30); display:flex; flex-direction:column; gap:var(--s-1);
  }
  .rule-row { display:flex; gap:var(--s-2); font-size:14px; line-height:24px; color:var(--ink-70); }
  .rule-row b { font-weight:600; color:var(--ink-90); font-variant-numeric:tabular-nums; min-width:12px; }

  /* ── Controls ───────────────────────────────────────────────── */
  .label { font-size:14px; font-weight:500; color:var(--ink-70); }
  .field {
    width:100%; height:56px; border:1px solid var(--ink-50);
    border-radius:var(--r-sm); background:var(--paper);
    padding:0 var(--s-2); font-family:var(--mono); font-size:15px; color:var(--ink-90);
  }
  .field::placeholder { color:var(--ink-50); }
  .field:focus { border-color:var(--magic-50); outline:none; box-shadow:0 0 0 3px var(--magic-10); }
  .field.invalid { border-color:var(--ruby-50); }
  .err { font-size:14px; line-height:24px; color:var(--ruby-90); min-height:24px; margin:0; }

  .examples { display:flex; flex-direction:column; gap:var(--s-1); }
  .example {
    display:flex; align-items:center; justify-content:space-between; gap:var(--s-2);
    width:100%; height:44px; padding:0 var(--s-15); text-align:left;
    border:1px solid var(--ink-30); background:var(--paper);
    border-radius:var(--r-sm); font-family:var(--sans); color:var(--ink-90);
    cursor:pointer; transition:border-color .12s, background .12s;
  }
  .example:hover { border-color:var(--ink-90); background:var(--ink-10); }
  .example-name { font-size:14px; font-weight:500; }
  .example-addr { font-family:var(--mono); font-size:12px; color:var(--ink-70); }

  .divide { display:flex; align-items:center; gap:var(--s-2); margin:var(--s-05) 0; }
  .divide span:first-child, .divide span:last-child { flex:1; height:1px; background:var(--ink-30); }
  .divide-text { font-size:13px; color:var(--ink-70); }

  .btn {
    border:none; border-radius:var(--pill); cursor:pointer;
    font-family:var(--sans); font-weight:600; text-decoration:none;
    display:inline-flex; align-items:center; justify-content:center; gap:var(--s-1);
    transition:background .12s, border-color .12s, opacity .12s;
  }
  .btn-lg { height:56px; padding:0 var(--s-4); font-size:16px; }
  .btn-md { height:44px; padding:0 var(--s-3); font-size:14px; }
  .btn-primary { background:var(--ink-90); color:var(--paper); }
  .btn-primary:hover { background:var(--black); }
  .btn-primary[disabled] { background:var(--ink-50); cursor:default; }
  .btn-tertiary { background:transparent; color:var(--ink-90); border:1px solid var(--ink-90); }
  .btn-tertiary:hover { background:var(--ink-10); }
  .btn-block { width:100%; margin-top:var(--s-2); flex-shrink:0; }

  /* ── Checking ───────────────────────────────────────────────── */
  .checking {
    width:100%; padding:var(--s-6) var(--inset);
    display:flex; flex-direction:column; justify-content:center; gap:var(--s-2);
  }
  .steps { display:flex; flex-direction:column; gap:var(--s-1); margin-top:var(--s-2); max-width:420px; }
  .step {
    display:flex; align-items:center; gap:var(--s-15); height:44px;
    padding:0 var(--s-2); border:1px solid var(--ink-30); border-radius:var(--r-sm);
    font-size:15px; color:var(--ink-50); background:var(--paper);
    transition:opacity .25s, border-color .2s, color .2s, background .2s;
  }
  .step-dot {
    width:8px; height:8px; border-radius:50%; background:var(--ink-30); flex-shrink:0;
    transition:background .2s;
  }
  .step.active { color:var(--ink-90); border-color:var(--ink-90); }
  .step.active .step-dot { background:var(--ink-90); animation:pulse 1s ease-in-out infinite; }
  .step.found { color:var(--ink-90); border-color:var(--ink-90); background:var(--ink-90); }
  .step.found, .step.found .step-label { color:var(--paper); }
  .step.found .step-dot { background:var(--paper); animation:none; }
  .step.cleared { opacity:0; }
  .step-label { flex:1; }
  .step-note { font-size:13px; color:var(--ink-50); }
  .step.found .step-note { color:rgba(255,255,255,.7); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }

  /* ── Verdict ────────────────────────────────────────────────── */
  .verdict {
    padding:var(--s-5) var(--inset); width:100%;
    display:flex; flex-direction:column; justify-content:center;
  }
  .verdict.pass  { background:linear-gradient(135deg,#DFFDCF,#B4DCB8); }
  .verdict.block { background:linear-gradient(135deg,#FAE1C2,#E5BB8F); }
  .verdict.fail  { background:linear-gradient(135deg,#EFEDEA,#D6D2CD); }
  .verdict .h1 { color:var(--ink-90); }
  .reason { margin-top:var(--s-2); max-width:46ch; color:var(--ink-90); }
  .v-head {
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:var(--s-5); flex-wrap:wrap;
  }
  .v-meta { display:flex; flex-direction:column; gap:var(--s-05); min-width:0; padding-top:var(--s-1); }
  .stats { display:flex; gap:var(--s-1); margin-top:var(--s-4); flex-wrap:wrap; }
  .stat {
    flex:1; min-width:150px; padding:var(--s-2);
    border:1px solid rgba(27,23,26,.22); border-radius:var(--r-sm);
    background:rgba(255,255,255,.5);
  }
  .stat-k { font-size:13px; color:rgba(27,23,26,.62); }
  .stat-v { font-size:24px; font-weight:700; letter-spacing:-.01em; margin-top:2px; }
  .detail {
    font-family:var(--mono); font-size:13px; line-height:20px;
    color:var(--ink-70); margin-top:var(--s-15); max-width:64ch; word-break:break-word;
  }

  /* ── Hop ladder ─────────────────────────────────────────────── */
  .ladder-label { margin-top:var(--s-3); color:rgba(27,23,26,.65); }
  .ladder { display:flex; gap:var(--s-1); margin-top:var(--s-1); }
  .rung {
    flex:1; display:flex; flex-direction:column; gap:var(--s-05); min-width:0;
    border:1px solid rgba(27,23,26,.22); border-radius:var(--r-sm);
    padding:var(--s-15); background:rgba(255,255,255,.45);
  }
  .rung-n { font-size:12px; font-weight:600; color:rgba(27,23,26,.5); font-variant-numeric:tabular-nums; }
  .rung-l { font-size:14px; font-weight:500; color:rgba(27,23,26,.7); }
  .rung.hit { background:var(--ink-90); border-color:var(--ink-90); }
  .rung.hit .rung-n { color:var(--ink-50); }
  .rung.hit .rung-l { color:var(--paper); }
  @media (max-width:760px) {
    .ladder { flex-direction:column; }
    .rung { flex-direction:row; align-items:center; gap:var(--s-15); }
  }

  .thr-row { display:flex; gap:var(--s-1); margin-top:var(--s-1); flex-wrap:wrap; }
  .thr {
    display:flex; flex-direction:column; gap:2px; padding:var(--s-1) var(--s-15);
    border:1px solid rgba(27,23,26,.22); border-radius:var(--r-sm);
    background:rgba(255,255,255,.55);
    font-family:var(--sans); cursor:pointer; text-align:left;
    transition:border-color .12s, opacity .12s;
  }
  .thr:hover { border-color:var(--ink-90); }
  .thr-live { border-color:var(--ink-90); border-width:2px; }
  .thr-sel { border-color:var(--ink-90); background:var(--ink-10); }
  .thr-k { font-size:12px; color:rgba(27,23,26,.6); font-variant-numeric:tabular-nums; }
  .thr-v { font-size:14px; font-weight:600; }
  .thr-v.thr-block { color:var(--ruby-90); }
  .thr-v.thr-allow { color:var(--leaf-90); }
  .thr-live { border-color:var(--ink-90); border-width:2px; }
  .value-row { display:flex; align-items:baseline; gap:var(--s-2); margin-top:var(--s-1); flex-wrap:wrap; }
  .value-amount { font-size:26px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }

  /* ── Path ───────────────────────────────────────────────────── */
  .path { display:flex; align-items:stretch; gap:var(--s-15); margin-top:var(--s-3); flex-wrap:wrap; }
  .node {
    display:flex; flex-direction:column; gap:var(--s-05);
    padding:var(--s-15) var(--s-2);
    border:1px solid rgba(27,23,26,.22); border-radius:var(--r-sm);
    background:rgba(255,255,255,.55); min-width:0;
  }
  .node.origin { border-color:var(--ink-90); }
  .node.match  { border-color:var(--ink-90); background:rgba(255,255,255,.85); }
  .node-addr { font-family:var(--mono); font-size:14px; color:var(--ink-90); text-decoration:none; }
  .node-addr:hover { text-decoration:underline; }
  .node-role { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:rgba(27,23,26,.6); }
  .node.match .node-role { color:var(--ink-90); }
  .arrow { align-self:center; color:var(--ink-50); font-size:18px; }
  .arrow::after { content:'→'; }
  @media (max-width:760px) {
    .path { flex-direction:column; align-items:stretch; }
    .arrow { align-self:flex-start; padding-left:var(--s-3); }
    .arrow::after { content:'↓'; }
  }

  .actions {
    display:flex; align-items:center; gap:var(--s-15);
    margin:var(--s-4) 0 var(--s-3); flex-wrap:wrap;
  }
  .actions .line { flex:1; min-width:var(--s-4); height:1px; background:rgba(27,23,26,.2); }
  .parties { display:flex; gap:var(--s-5); flex-wrap:wrap; }
  .party { display:flex; flex-direction:column; gap:var(--s-05); min-width:0; }
  .party-addr { font-family:var(--mono); font-size:15px; word-break:break-all; }
  .parties { margin-top:var(--s-1); }
  .tag {
    font-size:12px; font-weight:600; border-radius:var(--pill);
    padding:2px var(--s-15); margin-left:var(--s-1); display:inline-block;
  }
  .tag { background:rgba(27,23,26,.09); color:rgba(27,23,26,.75); }
  .copy {
    border:1px solid rgba(27,23,26,.35); background:transparent; cursor:pointer;
    border-radius:var(--pill); padding:2px var(--s-15); margin-left:var(--s-1);
    font-family:var(--sans); font-size:13px; font-weight:500; color:var(--ink-90);
  }
  .copy:hover { border-color:var(--ink-90); }

  
/* ── Rules disclosure ───────────────────────────────────────── */
  .rules { padding-top:var(--s-1); border-top:1px solid var(--ink-30); }
  .facts {
    margin-top:var(--s-3); padding-top:var(--s-2);
    border-top:1px solid var(--ink-30); display:flex; flex-direction:column; gap:var(--s-1);
  }
  .fact { display:flex; justify-content:space-between; gap:var(--s-2); font-size:14px; line-height:24px; }
  .fact-k { color:var(--ink-70); }
  .fact-v { font-weight:600; font-variant-numeric:tabular-nums; }
  .verdict .rules { margin-top:var(--s-5); }
  .rules summary {
    list-style:none; cursor:pointer; padding:var(--s-15) 0;
    font-size:14px; font-weight:600; display:flex;
    align-items:center; justify-content:space-between; gap:var(--s-15);
  }
  .rules summary::-webkit-details-marker { display:none; }
  .rules summary::after { content:'+'; font-size:18px; font-weight:400; color:var(--ink-70); }
  .rules[open] summary::after { content:'–'; }
  .rule-item { padding:0 0 var(--s-15); max-width:64ch; }
  .rule-title { font-size:14px; font-weight:600; }
  .rule-detail { font-size:14px; line-height:24px; color:var(--ink-70); margin-top:var(--s-05); }
  .rule-meta {
    font-size:13px; line-height:20px; color:var(--ink-70);
    padding:var(--s-15) 0; border-top:1px solid var(--ink-30);
  }
  .foot { font-size:13px; line-height:20px; color:var(--ink-70); max-width:80ch; padding:0 var(--inset); }
</style>
</head>
<body>

<div class="mast">

98 17.3164 56.09 16.5805H58.9176C58.6916 17.8863 57.9857 19.0601 56.9379 19.872C55.8661 20.7279 54.5263 21.1578 52.9185 21.1578C51.5247 21.1578 50.3049 20.8778 49.267 20.3219C48.2532 19.789 47.4163 18.9711 46.8594 17.9703C46.2915 16.9584 46.0095 15.7846 46.0095 14.4468C46.0095 13.107 46.2835 11.9051 46.8334 10.8853C47.3833 9.86544 48.1512 9.07556 49.1371 8.51964H49.1411ZM55.1122 10.7293C54.4563 10.1894 53.6324 9.91944 52.6365 9.91944C51.7127 9.91944 50.9128 10.1974 50.2409 10.7533C49.569 11.3092 49.1811 12.0531 49.0751 12.977H56.274C56.154 12.0171 55.7661 11.2692 55.1102 10.7273L55.1122 10.7293ZM62.0811 7.83574L65.1467 17.9143L68.2102 7.83574H70.8018L73.7354 17.9143L76.9049 7.83574H79.7845L75.3332 20.9998H72.2976L69.47 12.0531L66.5385 20.9998L63.4749 21.0258L59.1036 7.83574H62.0871H62.0831H62.0811ZM83.8159 4.16028V7.83574H87.0614V10.2754H83.8159V17.1424C83.8159 17.6563 83.9199 18.0203 84.1298 18.2342C84.3378 18.4482 84.6958 18.5562 85.2037 18.5562H87.3514V20.9978H84.6278C83.352 20.9978 82.4281 20.7059 81.8522 20.1239C81.2783 19.542 80.9883 18.6422 80.9883 17.4243V4.15828H83.8159V4.16028ZM88.4312 17.9543C87.8653 16.9344 87.5813 15.7546 87.5813 14.4188C87.5813 13.079 87.8653 11.9291 88.4312 10.9093C88.9871 9.90044 89.823 9.07356 90.8388 8.52964C91.8787 7.96572 93.0685 7.68176 94.4143 7.68176C95.7581 7.68176 96.9499 7.96172 97.9878 8.52964C99.0256 9.09356 99.8275 9.88744 100.395 10.9093C100.963 11.9291 101.245 13.099 101.245 14.4188C101.245 15.7386 100.961 16.9344 100.395 17.9543C99.8415 18.9611 99.0046 19.783 97.9878 20.3179C96.9479 20.8738 95.7561 21.1538 94.4123 21.1538C93.0685 21.1538 91.8767 20.8738 90.8388 20.3179C89.822 19.783 88.9851 18.9611 88.4312 17.9543ZM98.3697 14.4208C98.3697 13.135 98.0058 12.0851 97.2819 11.2712C96.556 10.4554 95.6021 10.0474 94.4143 10.0474C93.2245 10.0474 92.2746 10.4554 91.5607 11.2712C90.8428 12.0851 90.4849 13.135 90.4849 14.4208C90.4849 15.7066 90.8448 16.7544 91.5607 17.5703C92.2766 18.3842 93.2285 18.7921 94.4143 18.7921C95.6001 18.7921 96.556 18.3842 97.2819 17.5703C98.0058 16.7544 98.3677 15.7066 98.3677 14.4208H98.3697ZM115.071 13.7509V21.0018H112.218V13.9049C112.218 12.653 111.948 11.7012 111.406 11.0513C110.864 10.3994 110.07 10.0754 109.024 10.0754C107.906 10.0754 107.03 10.4574 106.393 11.2212C105.755 11.9831 105.437 13.033 105.437 14.3708V21.0038H102.609V7.83574H105.071L105.385 9.55949C106.399 8.30767 107.828 7.68376 109.68 7.68376C111.268 7.68376 112.566 8.16369 113.567 9.12355C114.571 10.0834 115.073 11.6252 115.073 13.7529L115.071 13.7509Z"/></svg>
    <span class="badge">Exposure</span>
  </div>
  <div class="pills">
    <span class="pill"><span class="dot"></span>Sepolia</span>
  </div>
</div>

<div class="stage" id="stage" aria-live="polite"></div>

<p class="foot">
  Illustrative, and not a regulatory or legal determination.
</p>

<script>
const stage = document.getElementById("stage");
const short = (a) => a ? a.slice(0, 6) + "…" + a.slice(-4) : "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function when(iso) {
  const d = new Date(iso || Date.now());
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" })
    + ", " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "UTC" }) + " UTC";
}

function money(n) {
  if (typeof n !== "number") return null;
  if (n >= 1e6) return "$" + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "m";
  if (n >= 1e3) return "$" + Math.round(n / 1e3) + "k";
  return "$" + Math.round(n);
}

const DEFAULT_PRESETS = [
  { key: "direct", label: "Known Lazarus address", address: "" },
  { key: "one",    label: "1 hop away",           address: "" },
  { key: "two",    label: "2 hops away",          address: "" },
  { key: "three",  label: "3 hops away",          address: "" },
  { key: "clean",  label: "No exposure",          address: "" },
];
let presets = DEFAULT_PRESETS;
let inFlight = false;
let rulesCache = null;

/* ── Decision summary ────────────────────────────────────────────
   Distance, value and outcome as three figures. The ladder these replace
   spent a full row rendering a number between zero and three, and the path
   below says the same thing with evidence attached. */
function renderStats(r) {
  const distance = r.direct_match ? "Known address"
    : r.exposure ? `${r.hop_count} ${r.hop_count === 1 ? "hop" : "hops"}`
    : "None within 3";
  const value = r.direct_match ? "—"
    : typeof r.exposure_usd === "number" ? money(r.exposure_usd) : "—";
  const decision = r.decision === "ALLOW" ? "Allowed" : "Blocked";
  return `<div class="stats">
    <div class="stat"><div class="stat-k">Distance</div><div class="stat-v">${esc(distance)}</div></div>
    <div class="stat" title="The smallest transfer along the path">
      <div class="stat-k">Exposure</div><div class="stat-v">${esc(value)}</div></div>
    <div class="stat"><div class="stat-k">Decision</div><div class="stat-v">${esc(decision)}</div></div>
  </div>`;
}

/* ── Value threshold ─────────────────────────────────────────────
   The enforced threshold is a policy parameter held on-chain and the page
   cannot move it. Selecting one here is a comparison, not a change. */
const THRESHOLDS = [0, 1e3, 1e5, 1e6, 1e7];

function thrLabel(t) { return t === 0 ? "any amount" : money(t); }

function renderThresholds(r) {
  if (typeof r.exposure_usd !== "number" || r.direct_match) return "";
  const live = typeof r.dataset?.min_exposure_usd === "number"
    ? r.dataset.min_exposure_usd : 0;
  const cells = THRESHOLDS.map((t) => {
    const blocked = r.exposure_usd >= t;
    return `<button class="thr ${t === live ? "thr-live" : ""}" type="button"
      data-thr="${t}" data-blocked="${blocked}">
      <span class="thr-k">${thrLabel(t)}</span>
      <span class="thr-v ${blocked ? "thr-block" : "thr-allow"}">${blocked ? "Blocked" : "Allowed"}</span>
    </button>`;
  }).join("");
  return `<div class="ladder-label p-sm">If the value threshold were set to</div>
    <div class="thr-row">${cells}</div>
    <p class="p-sm muted" style="margin:var(--s-1) 0 0" id="thr-note">
      Outlined is the one enforced on-chain.
    </p>`;
}

function wireThresholds(r) {
  const note = document.getElementById("thr-note");
  if (!note) return;
  const live = typeof r.dataset?.min_exposure_usd === "number"
    ? r.dataset.min_exposure_usd : 0;
  stage.querySelectorAll(".thr").forEach((b) => {
    b.onclick = () => {
      stage.querySelectorAll(".thr").forEach((x) => x.classList.remove("thr-sel"));
      const t = Number(b.dataset.thr);
      const blocked = b.dataset.blocked === "true";
      if (t === live) {
        note.textContent = "Outlined is the one enforced on-chain.";
        return;
      }
      b.classList.add("thr-sel");
      note.textContent = `At ${thrLabel(t)} this wallet would be `
        + `${blocked ? "blocked" : "allowed"}. The enforced threshold is `
        + `${thrLabel(live)}, so the decision above stands.`;
    };
  });
}

/* ── Rules ───────────────────────────────────────────────────── */
async function loadRules() {
  if (rulesCache) return rulesCache;
  try {
    const resp = await fetch("/api/rules");
    rulesCache = resp.ok ? await resp.json() : null;
  } catch (e) { rulesCache = null; }
  return rulesCache;
}

/* ── Console ─────────────────────────────────────────────────── */
function renderConsole(prefill = "", error = "") {
  const ready = presets.filter((p) => p.address);
  stage.className = "stage";
  stage.innerHTML = `
    <div class="console">
      <div class="col">
        <div class="h6 muted">Active policy</div>
        <div class="card card-policy">
          <div class="card-body">
            <div class="h4">Lazarus Exposure</div>
            <p class="p-std muted" style="margin:var(--s-15) 0 0;max-width:44ch">
              Blocks a wallet that reaches a known Lazarus Group address within three hops.
            </p>
            <div class="policy-rules">
              <span class="rule-row"><b>0</b><span>the wallet is itself a known address</span></span>
              <span class="rule-row"><b>1</b><span>it dealt with one directly</span></span>
              <span class="rule-row"><b>2</b><span>one wallet sits in between</span></span>
              <span class="rule-row"><b>3</b><span>two wallets sit in between</span></span>
            </div>
            <div class="facts">
              <div class="fact"><span class="fact-k">Distance</span><span class="fact-v">3 hops</span></div>
              <div class="fact"><span class="fact-k">Value</span><span class="fact-v">any amount</span></div>
              <div class="fact"><span class="fact-k">Edge floor</span><span class="fact-v">$300</span></div>
              <div class="fact"><span class="fact-k">Seed set</span><span class="fact-v">3,597 addresses</span></div>
            </div>
            <p class="p-sm muted" style="margin:var(--s-3) 0 0">
              Traversal stops at exchanges, bridges, mixers and contracts, so shared use
              of a service is not exposure. Transfers are valued in dollars at the price
              on the day. An exposure is worth its smallest transfer.
            </p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="h6 muted">Screen a wallet</div>
        <div class="card card-check">
          <div class="card-body">
            ${ready.length ? `
            <div style="display:flex;flex-direction:column;gap:var(--s-1)">
              <span class="label">Pick an example</span>
              <div class="examples">
                ${ready.map((p) => `<button class="example" type="button" data-addr="${esc(p.address)}">
                  <span class="example-name">${esc(p.label)}</span>
                  <span class="example-addr">${esc(short(p.address))}</span>
                </button>`).join("")}
              </div>
            </div>
            <div class="divide"><span></span><span class="divide-text">or</span><span></span></div>` : ""}
            <div style="display:flex;flex-direction:column;gap:var(--s-1)">
              <label class="label" for="addr">Enter any Ethereum address</label>
              <input class="field" id="addr" spellcheck="false" autocomplete="off"
                     placeholder="0x…" value="${esc(prefill)}" />
              <p class="err" id="err">${esc(error)}</p>
            </div>
          </div>
          <button class="btn btn-primary btn-lg btn-block" id="go">Run the check</button>
        </div>
      </div>
    </div>`;

  const input = document.getElementById("addr");
  const go = document.getElementById("go");
  // Picking an example fills the field rather than running immediately, so the
  // address is visible before the check and both inputs stay one flow.
  stage.querySelectorAll(".example").forEach((b) => {
    b.onclick = () => {
      input.value = b.dataset.addr;
      input.classList.remove("invalid");
      document.getElementById("err").textContent = "";
    };
  });
  input.oninput = () => input.classList.remove("invalid");
  input.onkeydown = (e) => { if (e.key === "Enter") go.click(); };
  go.onclick = () => submit(input.value.trim());
  if (window.matchMedia("(min-width: 861px)").matches) input.focus();
}

/* ── Checking ────────────────────────────────────────────────────
   The screening genuinely works outward from the wallet, so the steps track
   real stages rather than decorating a wait. When the answer arrives the
   matching step is marked and the rest clear, which makes the result legible
   before the verdict panel replaces it. */
const STEPS = [
  { key: 0, label: "Checking the wallet itself" },
  { key: 1, label: "Looking one hop out" },
  { key: 2, label: "Looking two hops out" },
  { key: 3, label: "Looking three hops out" },
];

function renderChecking(address) {
  stage.className = "stage";
  stage.innerHTML = `
    <div class="checking">
      <div class="h3">Checking</div>
      <div class="mono p-std" style="word-break:break-all">${esc(address)}</div>
      <div class="steps">
        ${STEPS.map((st) => `<div class="step" data-step="${st.key}">
          <span class="step-dot"></span>
          <span class="step-label">${esc(st.label)}</span>
          <span class="step-note"></span>
        </div>`).join("")}
      </div>
    </div>`;

  let i = 0;
  const tick = setInterval(() => {
    const rows = stage.querySelectorAll(".step");
    if (!rows.length) return clearInterval(tick);
    rows.forEach((r, n) => r.classList.toggle("active", n === i % rows.length));
    i += 1;
  }, 700);

  return {
    stop() { clearInterval(tick); },
    /** Mark where the path was found and clear the rest. */
    settle(hop) {
      clearInterval(tick);
      const rows = [...stage.querySelectorAll(".step")];
      if (!rows.length) return Promise.resolve();
      rows.forEach((r) => r.classList.remove("active"));
      const hit = hop === null || hop === undefined ? -1 : hop;
      rows.forEach((r) => {
        const n = Number(r.dataset.step);
        if (n === hit) {
          r.classList.add("found");
          r.querySelector(".step-note").textContent = "found";
        } else {
          r.classList.add("cleared");
        }
      });
      if (hit === -1) {
        const last = rows[rows.length - 1];
        last.classList.remove("cleared");
        last.classList.add("found");
        last.querySelector(".step-label").textContent = "No exposure within three hops";
      }
      return new Promise((r) => setTimeout(r, 1100));
    },
  };
}

/* ── Submit ──────────────────────────────────────────────────── */
async function submit(address) {
  if (inFlight) return;
  const input = document.getElementById("addr");
  if (!/^0x[0-9a-fA-F]{40}$/.test(address)) {
    if (input) {
      input.classList.add("invalid");
      document.getElementById("err").textContent = "That is not a 42-character Ethereum address.";
      input.focus();
    }
    return;
  }
  inFlight = true;
  const search = renderChecking(address);
  try {
    const resp = await fetch("/api/evaluate?address=" + encodeURIComponent(address));
    const result = await resp.json();
    if (result.status === "INVALID_ADDRESS") {
      search.stop();
      return renderConsole(address, result.reason);
    }
    await search.settle(result.exposure ? result.hop_count : null);
    renderVerdict(result);
  } catch (e) {
    search.stop();
    renderVerdict({
      wallet: address.toLowerCase(), status: "SCREENING_FAILED", decision: "DENY",
      reason: "Unable to complete exposure check",
      detail: String(e.message || e), evaluated_at: new Date().toISOString(),
    });
  } finally { inFlight = false; }
}

/* ── Verdict ─────────────────────────────────────────────────── */
function roleLabel(node, index) {
  if (node.role === "lazarus") return node.label || "Lazarus Group";
  if (index === 0) return "Submitted wallet";
  if (node.role === "service") return node.label || "Service";
  return "Intermediary " + index;
}

function renderPath(result) {
  const nodes = result.nodes?.length
    ? result.nodes
    : (result.path || []).map((a) => ({ address: a, role: "wallet" }));
  if (nodes.length < 2) return "";
  const parts = nodes.map((n, i) => {
    const cls = i === 0 ? "origin" : (n.role === "lazarus" ? "match" : "");
    return `<div class="node ${cls}">
      <a class="node-addr" href="https://etherscan.io/address/${esc(n.address)}"
         target="_blank" rel="noopener" title="${esc(n.address)}">${esc(short(n.address))}</a>
      <span class="node-role">${esc(roleLabel(n, i))}</span>
    </div>`;
  });
  return `<div class="path">${parts.join('<span class="arrow" aria-hidden="true"></span>')}</div>`;
}

function renderVerdict(r) {
  const attested = r.attestation?.status === "ATTESTED";

  const failed = r.status === "SCREENING_FAILED";
  const unattested = r.status === "ATTESTATION_FAILED";
  let tone, headline, reason, body = "", tag;

  if (failed) {
    tone = "fail"; headline = "Screening failed";
    reason = "The transaction graph could not be read, so the wallet was not screened. "
           + "The policy denies by default. This is not a finding of exposure.";
    tag = '<span class="tag unknown">Unscreened</span>';
  } else if (unattested) {
    tone = "fail"; headline = "Not attested";
    reason = "The wallet was screened, but the decision could not be attested, so it "
           + "carries no proof and the policy denies by default.";
    body = renderStats(r) + renderPath(r);
    tag = '<span class="tag unknown">Unattested</span>';
  } else if (r.exposure) {
    tone = "block"; headline = "Non&nbsp;Compliant";
    reason = r.direct_match
      ? "This wallet is a known Lazarus Group address. The transfer is blocked."
      : `This wallet reaches a known Lazarus Group address in ${r.hop_count}`
        + ` ${r.hop_count === 1 ? "hop" : "hops"}. The transfer is blocked.`;
    body = renderStats(r) + renderPath(r) + renderThresholds(r);
    tag = '<span class="tag exposed">Exposed</span>';
  } else {
    tone = "pass"; headline = "Compliant";
    reason = "No path to a known Lazarus Group address was found within three hops. "
           + "The transfer may proceed.";
    body = renderStats(r);
    tag = '<span class="tag clear">Clear</span>';
  }

  const detail = r.detail || r.attestation?.detail;
  stage.className = "stage";
  stage.innerHTML = `
    <div class="verdict ${tone}">
      <div class="v-head">
        <div>
          <div class="h1">${headline}</div>
          <p class="reason p-lg">${esc(reason)}</p>
          ${detail ? `<div class="detail">${esc(detail)}</div>` : ""}
        </div>
        <div class="v-meta">
          <span class="p-sm muted">Wallet ${tag}<button class="copy" id="copy">Copy</button></span>
          <span class="party-addr">${esc(r.wallet)}</span>
          <span class="p-sm muted" style="margin-top:var(--s-1)">Decided ${esc(when(r.evaluated_at))}</span>
        </div>
      </div>
      ${body}
      <div class="actions">
        <span class="line"></span>
        <button class="btn btn-tertiary btn-md" id="again">New check</button>
        ${r.explorer_url ? `<a class="btn btn-primary btn-md" href="${esc(r.explorer_url)}"
           target="_blank" rel="noopener">View attestation on the Newton explorer ↗</a>` : ""}
      </div>
    </div>`;

  document.getElementById("again").onclick = () => renderConsole();
  const copy = document.getElementById("copy");
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(r.wallet);
      copy.textContent = "Copied";
      setTimeout(() => { copy.textContent = "Copy"; }, 1600);
    } catch (e) { copy.textContent = "Copy failed"; }
  };
  wireThresholds(r);

}

/* ── Boot ────────────────────────────────────────────────────── */
renderConsole();
fetch("data/demo_wallets.json")
  .then((r) => (r.ok ? r.json() : null))
  .then((d) => {
    const loaded = d?.wallets;
    if (Array.isArray(loaded) && loaded.some((w) => w.address)) {
      presets = loaded;
      renderConsole();
    }
  })
  .catch(() => {});
</script>
</body>
</html>
