<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Newton — Lazarus Scan</title>
<meta name="description" content="Screen an Ethereum wallet for direct or indirect exposure to the Lazarus Group within three hops, and enforce the result as a Newton policy." />
<meta property="og:title" content="Newton — Lazarus exposure screening" />
<meta property="og:description" content="Screen the wallet. Trace its exposure. Enforce the result." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ── Magic design system ──────────────────────────────────────────────
     Colour, spacing and type taken from the system rather than invented:
     8px layout grid, 4px baseline, Inter with a mono face for addresses. */
  :root {
    /* Ink */
    --ink-90:#1B171A; --ink-70:#77767A; --ink-50:#B0B4BA;
    --ink-30:#E0E0E3; --ink-10:#F0F0FA; --paper:#FFFFFF;
    /* Brand and semantics */
    --leaf-50:#00CC8F;
    --ruby-50:#FC5C36; --ruby-90:#932303;
    --black:#000000;

    /* Spacing: 1 unit = 8px */
    --s-05:4px; --s-1:8px; --s-15:12px; --s-2:16px; --s-3:24px;
    --box-pad:16px;   /* horizontal padding inside node, threshold and example boxes */
    --s-4:32px; --s-5:40px; --s-6:48px;

    /* Verdict surfaces, sampled from the sanctions panels */
    --pass-a:#DFFDCF; --pass-b:#B4DCB8;
    --block-a:#FAE1C2; --block-b:#E5BB8F;
    --fail-a:#EFEDEA; --fail-b:#D6D2CD;

    /* Overlays for elements sitting on a tinted surface */
    --on-22:rgba(27,23,26,.22);
    --on-35:rgba(27,23,26,.35); --on-62:rgba(27,23,26,.62);
    --veil:rgba(255,255,255,.5); --veil-strong:rgba(255,255,255,.85);

    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --pill:999px;
    --inset:clamp(var(--s-3),4vw,var(--s-6));
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--ink-10); color:var(--ink-90);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    padding:var(--s-3); display:flex; flex-direction:column; gap:var(--s-3);
    height:100vh; height:100dvh; overflow:hidden;
  }
  :focus-visible { outline:2px solid var(--ink-90); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }

  /* ── Type scale ─────────────────────────────────────────────── */
  .h1 { font-size:clamp(34px,4.4vw,60px); line-height:1.04; font-weight:700; letter-spacing:-.025em; }
  .h3 { font-size:clamp(32px,4vw,48px); line-height:1.16; font-weight:700; letter-spacing:-.01em; }
  .h4 { font-size:20px; line-height:32px; font-weight:700; }
  .h6 { font-size:12px; line-height:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  .p-lg { font-size:18px; line-height:24px; }
  .p-std { font-size:16px; line-height:24px; }
  .p-sm { font-size:14px; line-height:24px; }
  .mono { font-family:var(--mono); }
  .muted { color:var(--ink-70); }

  /* ── Masthead ───────────────────────────────────────────────── */
  .mast {
    background:var(--paper); border:1px solid var(--ink-30); border-radius:var(--r-lg);
    display:flex; align-items:center; justify-content:space-between;
    gap:var(--s-3); padding:var(--s-15) var(--inset); flex-wrap:wrap;
  }
  .brand { display:flex; align-items:center; gap:var(--s-2); }
  .wordmark { height:22px; width:auto; color:var(--ink-90); display:block; }
  .badge {
    background:var(--ink-90); color:var(--paper); border-radius:var(--r-sm);
    padding:var(--s-1) var(--s-2); font-size:12px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase;
  }
  .pills { display:flex; gap:var(--s-1); flex-wrap:wrap; }
  .pill {
    display:flex; align-items:center; gap:var(--s-1); height:40px;
    border:1px solid var(--ink-30); border-radius:var(--r-sm);
    padding:0 var(--s-2); background:var(--ink-10);
    font-size:14px; font-weight:500; white-space:nowrap;
  }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--leaf-50); }

  /* ── Stage and cards ────────────────────────────────────────── */
  .stage {
    background:var(--paper); border:1px solid var(--ink-30);
    border-radius:var(--r-xl); overflow:hidden; display:flex;
    justify-content:center; flex:1; min-height:0;
  }
  .console {
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:stretch; gap:var(--s-4); align-content:center;
    padding:var(--s-3) var(--inset); max-width:1400px; width:100%; margin:0 auto;
    min-height:0; overflow-y:auto;
  }
  @media (max-width:860px) { .console { grid-template-columns:1fr; gap:var(--s-3); } }
  @media (max-height:900px) {
    body { padding:var(--s-2); gap:var(--s-2); }
    .console { padding:var(--s-3) var(--inset); gap:var(--s-4); }
    .card { padding:var(--s-3); }
    .mast { padding:var(--s-1) var(--inset); }
    .verdict, .checking { padding-block:var(--s-3); }
  }
  .col { display:flex; flex-direction:column; gap:var(--s-15); min-width:0; }
  .card {
    display:flex; flex-direction:column; min-height:0; height:100%;
    border-radius:var(--r-md); padding:var(--s-3);
  }
  /* The action sits on the card's bottom edge so both columns end level. */
  .card-check .card-body { flex:1; }

  .card-policy { background:var(--paper); border:1px solid var(--ink-30); }
  .card-check  { background:var(--paper); border:1px solid var(--ink-30); }
  .card-body {
    min-height:0; display:flex; flex-direction:column;
    scrollbar-width:thin; scrollbar-color:var(--ink-30) transparent;
  }
  .card-body::-webkit-scrollbar { width:var(--s-05); }
  .card-body::-webkit-scrollbar-thumb { background:var(--ink-30); border-radius:var(--r-sm); }
  .card-check .card-body { gap:var(--s-2); }


  /* ── Controls ───────────────────────────────────────────────── */
  .label { font-size:14px; font-weight:500; color:var(--ink-70); }
  .field {
    width:100%; height:48px; border:1px solid var(--ink-50);
    border-radius:var(--r-sm); background:var(--paper);
    padding:0 var(--s-2); font-family:var(--mono); font-size:16px; color:var(--ink-90);
  }
  .field::placeholder { color:var(--ink-50); }
  .field:focus { border-color:var(--ink-90); outline:none; box-shadow:0 0 0 var(--s-05) var(--ink-30); }
  .field.invalid { border-color:var(--ruby-50); }
  .err { font-size:14px; line-height:20px; color:var(--ruby-90); margin:0; }
  .err:empty { display:none; }

  .examples { display:flex; flex-direction:column; gap:var(--s-1); }
  .card-check .card-body > div:first-child { flex:1; }
  .card-check .examples { flex:1; }
  .example { flex:1; min-height:40px; }
  .examples { margin-left:calc(var(--box-pad) * -1); width:calc(100% + var(--box-pad)); }
  .example {
    display:flex; align-items:center; justify-content:space-between; gap:var(--s-2);
    width:100%; height:40px; padding:0 var(--box-pad); text-align:left;
    border:1px solid var(--ink-30); background:var(--paper);
    border-radius:var(--r-sm); font-family:var(--sans); color:var(--ink-90);
    cursor:pointer; transition:border-color .12s, background .12s;
  }
  .example:hover { border-color:var(--ink-90); background:var(--ink-10); }
  .example.chosen {
    border-color:var(--ink-90); background:var(--ink-90); color:var(--paper);
  }
  .example.chosen .example-addr { color:var(--ink-50); }
  .example-name { font-size:14px; font-weight:500; }
  .example-addr { font-family:var(--mono); font-size:12px; color:var(--ink-70); }

  .divide { display:flex; align-items:center; gap:var(--s-2); margin:var(--s-05) 0; }
  .divide span:first-child, .divide span:last-child { flex:1; height:1px; background:var(--ink-30); }
  .divide-text { font-size:14px; color:var(--ink-70); }

  .btn {
    border:none; border-radius:var(--pill); cursor:pointer;
    font-family:var(--sans); font-weight:600; text-decoration:none;
    display:inline-flex; align-items:center; justify-content:center; gap:var(--s-1);
    text-align:center; line-height:20px;
    transition:background .12s, border-color .12s, opacity .12s;
  }
  .btn-lg { min-height:48px; padding:var(--s-15) var(--s-4); font-size:16px; }
  .btn-md { min-height:44px; padding:var(--s-15) var(--s-3); font-size:14px; }
  .btn-primary { background:var(--ink-90); color:var(--paper); }
  .btn-primary:hover { background:var(--black); }
  .btn-primary[disabled] { background:var(--ink-50); cursor:default; }
  .btn-tertiary { background:transparent; color:var(--ink-90); border:1px solid var(--ink-90); }
  .btn-tertiary:hover { background:var(--ink-10); }
  .btn-block { width:100%; margin-top:var(--s-2); flex-shrink:0; }

  /* ── Checking ───────────────────────────────────────────────── */
  /* Matches the height of the verdict's actions row, so both panels
     centre their grid at the same point. */
  .checking::after { content:''; display:block; height:100px; flex-shrink:0; }
  .checking {
    width:100%; display:flex; flex-direction:column; justify-content:center;
    padding-block:var(--s-5);
    padding-inline:max(var(--inset), calc((100% - 1200px) / 2));
  }
  .steps, .path {
    display:flex; flex-direction:column; align-items:stretch; gap:var(--s-05);
    width:100%; max-width:380px; margin:0;
  }
  .step, .node {
    display:flex; align-items:baseline; justify-content:space-between; gap:var(--s-2);
    min-height:36px; padding:var(--s-1) var(--box-pad);
    border:1px solid var(--on-22); border-radius:var(--r-sm);
    background:var(--veil);
  }
  .step {
    font-size:16px; color:var(--ink-50); border-color:var(--ink-30);
    background:var(--paper);
    transition:opacity .25s, border-color .2s, color .2s, background .2s;
  }
  .step.active { color:var(--ink-90); border-color:var(--ink-90); }
  .step.active { animation:pulse 1.2s ease-in-out infinite; }
  /* A step that came back clean goes green; the one that found the path goes
     red and the search stops there. */
  .step.clear {
    color:var(--ink-90); border-color:var(--pass-b); background:var(--pass-a);
  }

  .step.hit {
    color:var(--ink-90); border-color:var(--block-b); background:var(--block-a);
  }

  .step.idle { opacity:.35; }
  .step-label { flex:1; font-size:16px; }
  .step-note { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }

  /* ── Verdict ────────────────────────────────────────────────── */
  .verdict {
    /* Full bleed so the gradient fills the stage, with the content still
       capped: the padding centres it rather than a max-width that would
       leave the panel's own background short of the edges.
       Top-anchored, not centred, so the chain lands exactly where the scan
       steps were. */
    width:100%; display:flex; flex-direction:column; justify-content:center;
    min-height:0; overflow-y:auto;
    padding-block:var(--s-5);
    padding-inline:max(var(--inset), calc((100% - 1200px) / 2));
  }
  .verdict.pass  { background:linear-gradient(135deg,var(--pass-a),var(--pass-b)); }
  .verdict.block { background:linear-gradient(135deg,var(--block-a),var(--block-b)); }
  .verdict.fail  { background:linear-gradient(135deg,var(--fail-a),var(--fail-b)); }
  .verdict .h1 { color:var(--ink-90); }
  .reason { margin-top:var(--s-2); max-width:42ch; color:var(--ink-90); }

  /* The decision reads down the left; the evidence for it sits alongside,
     which is what fills the width rather than stretching either one. */
  .v-grid {
    display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr);
    gap:var(--s-6); align-items:start; width:100%;
  }
  /* The scan's heading and the verdict's heading are different sizes; the
     left column must not shift because of it. */
  .checking .v-right .h1, .verdict .v-right .h1 { margin-top:0; }
  .v-grid.single { grid-template-columns:minmax(0,1fr); }
  .v-left, .v-right { min-width:0; }
  .v-left { display:flex; align-items:flex-start; }
  .v-right { min-width:0; }
  .stats {
    display:grid; grid-template-columns:repeat(3, minmax(0, 1fr));
    margin-top:var(--s-4); max-width:520px;
  }

  .stat { padding:0 var(--s-3); }
  .stat:first-child { padding-left:0; }
  .stat + .stat { border-left:1px solid var(--on-22); }
  .stat-k { font-size:14px; color:var(--on-62); }
  .stat-v { font-size:24px; font-weight:700; letter-spacing:-.01em; margin-top:2px; }
  .stat-link {
    display:inline-flex; align-items:baseline; gap:var(--s-05);
    color:var(--ink-90); text-decoration:none;
    border-bottom:1px solid var(--on-35);
  }
  .stat-link:hover { border-color:var(--ink-90); }
  .stat-ext { font-size:14px; font-weight:500; color:var(--on-62); }
  .detail {
    font-family:var(--mono); font-size:14px; line-height:20px;
    color:var(--ink-70); margin-top:var(--s-15); max-width:64ch; word-break:break-word;
  }

  /* ── Hop ladder ─────────────────────────────────────────────── */
  .ladder { display:flex; gap:var(--s-1); margin-top:var(--s-1); }
  @media (max-width:768px) {
    .ladder { flex-direction:column; }
    .rung { flex-direction:row; align-items:center; gap:var(--s-15); }
  }


  /* ── Path ───────────────────────────────────────────────────── */


  .node.origin { border-color:var(--ink-90); }
  .node.match  { border-color:var(--ink-90); background:var(--veil-strong); }
  .node-addr { font-family:var(--mono); font-size:14px; color:var(--ink-90); text-decoration:none; flex-shrink:0; }
  .node-addr:hover { text-decoration:underline; }
  .node-role { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--on-62); white-space:nowrap; }
  .node.match .node-role { color:var(--ink-90); }
  .arrow { align-self:flex-start; margin-left:var(--s-2); color:var(--ink-50); font-size:16px; line-height:16px; }
  .arrow-tx {
    text-decoration:none; color:var(--on-62); cursor:pointer;
    transition:color .12s, transform .12s;
  }
  .arrow-tx:hover { color:var(--ink-90); transform:scale(1.15); }
  .arrow::after { content:'↓'; }


  .actions {
    display:flex; align-items:center; gap:var(--s-15);
    margin:var(--s-4) 0 var(--s-3); flex-wrap:wrap;
  }
  .actions .line { flex:1; min-width:var(--s-4); height:1px; background:var(--on-22); }
  .party { display:flex; flex-direction:column; gap:var(--s-05); min-width:0; }

  
/* ── Rules disclosure ───────────────────────────────────────── */
  .how {
    margin:var(--s-3) 0 0; padding:0; list-style:none;
    counter-reset:how; display:flex; flex-direction:column; gap:var(--s-15);
  }
  .how li {
    counter-increment:how; position:relative; padding-left:var(--s-4);
    font-size:14px; line-height:20px; color:var(--ink-70);
  }
  .how li::before {
    content:counter(how); position:absolute; left:0; top:0;
    width:20px; height:20px; border-radius:var(--pill);
    background:var(--ink-90); color:var(--paper);
    font-size:12px; font-weight:600; display:flex;
    align-items:center; justify-content:center;
  }
  .how b { font-weight:600; color:var(--ink-90); }

  .deployed {
    margin-top:auto; padding-top:var(--s-2);
    border-top:1px solid var(--ink-30);
    display:flex; align-items:center; gap:var(--s-1); flex-wrap:wrap;
  }
  .fact-link {
    font-family:var(--mono); font-size:14px; font-weight:500;
    color:var(--ink-90); text-decoration:none; border-bottom:1px solid var(--ink-30);
  }
  .fact-link:hover { border-color:var(--ink-90); }

  /* A hop is one transfer; the diagram says so faster than a sentence. */
  .hops { display:flex; align-items:center; margin-top:var(--s-2); }
  .hop {
    display:flex; align-items:center; justify-content:center;
    height:var(--s-4); padding:0 var(--s-15); flex-shrink:0;
    border:1px solid var(--ink-30); border-radius:var(--r-sm);
    background:var(--paper); font-family:var(--sans);
  }
  .hop-n { font-size:12px; font-weight:600; color:var(--ink-50); }
  /* Reach is shown by which hops are lit, so the diagram is the control. */
  .hop.on { border-color:var(--ink-90); }
  .hop.on .hop-n { color:var(--ink-90); }
  .hop-pick { cursor:pointer; transition:border-color .12s, background .12s; }
  .hop-pick:hover:not(:disabled) { border-color:var(--ink-90); background:var(--ink-10); }
  .hop-pick:disabled { cursor:default; opacity:.4; }
  .hop-pick.sel { background:var(--ink-90); border-color:var(--ink-90); }
  .hop-pick.sel .hop-n { color:var(--paper); }
  .hop-end { border-color:var(--ink-90); background:var(--ink-90); }
  .hop-end .hop-n { color:var(--paper); }
  .hop-link { flex:1; height:1px; background:var(--ink-30); min-width:var(--s-1); }
  .hop-link.on { background:var(--ink-90); }

  .stat-note { font-size:12px; color:var(--on-62); margin-top:2px; }

  .choices { display:flex; gap:var(--s-1); margin-top:var(--s-1); flex-wrap:wrap; }
  .choice { height:var(--s-4); }
  .choice {
    flex:1; min-width:96px; height:var(--s-5); padding:0 var(--s-15);
    border:1px solid var(--ink-30); border-radius:var(--r-sm);
    background:var(--paper); cursor:pointer;
    font-family:var(--sans); font-size:14px; font-weight:500; color:var(--ink-70);
    transition:border-color .12s, background .12s, color .12s;
  }
  .choice:hover { border-color:var(--ink-90); color:var(--ink-90); }
  .choice.on { border-color:var(--ink-90); background:var(--ink-90); color:var(--paper); }

  .rule {
    margin:var(--s-2) 0 0; max-width:34ch;
    font-size:20px; line-height:36px; color:var(--ink-90);
  }
  .pick {
    display:inline; padding:2px var(--s-1); margin:0 2px;
    border:none; border-bottom:2px solid var(--ink-30); border-radius:0;
    background:none; cursor:pointer;
    font-family:var(--sans); font-size:20px; font-weight:600; color:var(--ink-90);
    transition:border-color .12s, background .12s;
  }
  .pick:hover { border-color:var(--ink-90); background:var(--ink-10); }

  .facts {
    margin-top:var(--s-2); padding-top:var(--s-2);
    border-top:1px solid var(--ink-30); display:flex; flex-direction:column; gap:var(--s-1);
  }
  .fact { display:flex; justify-content:space-between; gap:var(--s-2); font-size:14px; line-height:24px; }
  .fact-k { color:var(--ink-70); }
  .fact-v { font-weight:600; font-variant-numeric:tabular-nums; }
  .verdict .rules { margin-top:var(--s-5); }

  /* ── Phones ─────────────────────────────────────────────────
     Below this width the fixed-height page stops making sense: the
     content is taller than any phone, so the page scrolls normally
     and the panels stop competing for a fixed box. */
  @media (max-width:620px) {
    html,body { height:auto; overflow:visible; }
    body { height:auto; min-height:100dvh; padding:var(--s-15); gap:var(--s-15); }
    .stage { flex:none; }
    .mast { padding:var(--s-15); gap:var(--s-15); }
    .wordmark { height:20px; }
    .console { padding:var(--s-3) var(--s-2); overflow:visible; }
    .verdict, .checking { padding-block:var(--s-3); padding-inline:var(--s-2); overflow:visible; }
    .v-grid { grid-template-columns:minmax(0,1fr); gap:var(--s-4); }
    .v-right { padding-top:0; }
    .stats { grid-template-columns:minmax(0,1fr); gap:var(--s-15); }
    .how li { font-size:14px; }
    .card { height:auto; }
    .example { height:44px; }
    .deployed { margin-top:var(--s-3); }
    .fact { flex-wrap:wrap; gap:var(--s-05); }
    .stat, .stat + .stat { border-left:none; padding:0; }
    .stat + .stat { border-top:1px solid var(--on-22); padding-top:var(--s-15); }
    .actions { gap:var(--s-1); }
    .actions .line { display:none; }
    .actions { flex-direction:column; align-items:stretch; }
    .actions .btn { width:100%; }
    .btn-long { display:none; }
    /* The checking card was mostly empty space on a phone. */
    .checking .h1 { font-size:34px; }
    .checking .h3 { font-size:32px; }
    .steps { max-width:none; }
    /* Two threshold cells per row reads better than an orphan on the second. */
    .path { max-width:none; }
    .examples { margin-left:0; width:100%; }
    /* The headline was taking four lines at the largest clamp. */
    .h1 { font-size:34px; }
    .reason { font-size:16px; line-height:24px; }

  }
</style>
</head>
<body>

<div class="mast">

 18.7921 96.556 18.3842 97.2819 17.5703C98.0058 16.7544 98.3677 15.7066 98.3677 14.4208H98.3697ZM115.071 13.7509V21.0018H112.218V13.9049C112.218 12.653 111.948 11.7012 111.406 11.0513C110.864 10.3994 110.07 10.0754 109.024 10.0754C107.906 10.0754 107.03 10.4574 106.393 11.2212C105.755 11.9831 105.437 13.033 105.437 14.3708V21.0038H102.609V7.83574H105.071L105.385 9.55949C106.399 8.30767 107.828 7.68376 109.68 7.68376C111.268 7.68376 112.566 8.16369 113.567 9.12355C114.571 10.0834 115.073 11.6252 115.073 13.7529L115.071 13.7509Z"/></svg>
    <span class="badge">Lazarus Scan</span>
  </div>
  <div class="pills">
    <span class="pill"><span class="dot"></span>Sepolia</span>

</div>

<div class="stage" id="stage" aria-live="polite"></div>

<script>
const stage = document.getElementById("stage");
const short = (a) => a ? a.slice(0, 6) + "…" + a.slice(-4) : "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));


function money(n) {
  if (typeof n !== "number") return null;
  if (n >= 1e6) return "$" + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "m";
  if (n >= 1e3) return "$" + Math.round(n / 1e3) + "k";
  return "$" + Math.round(n);
}

const DEFAULT_PRESETS = [
  { key: "direct", label: "Known Lazarus address", address: "" },
  { key: "one",    label: "1 hop away",           address: "" },
  { key: "two",    label: "2 hops away",          address: "" },
  { key: "three",  label: "3 hops away",          address: "" },
  { key: "clean",  label: "No exposure",          address: "" },
];
let presets = DEFAULT_PRESETS;
let inFlight = false;
// Thresholds are separate policy clients, so choosing one chooses which
// contract the check is submitted to. Picked before screening, never after.
// The deployed combinations. Each is a policy client; cycling a parameter
// moves to the next rule that exists rather than one that might not.
const RULES = [
  { hops: 3, usd: 0 }, { hops: 3, usd: 100000 }, { hops: 3, usd: 1000000 },
  { hops: 2, usd: 0 },                           { hops: 2, usd: 1000000 },
  { hops: 1, usd: 0 }, { hops: 1, usd: 100000 }, { hops: 1, usd: 1000000 },
];
let hops = 3;
let usd = 0;
const usdLabel = (v) => (v === 0 ? "any amount" : "over " + money(v));

const HOP_CHOICES = [...new Set(RULES.map((r) => r.hops))].sort();

/** Move to a deployed rule. A combination with no client is not offered. */
function setRule(nextHops, nextUsd) {
  let value = nextUsd;
  if (!RULES.some((r) => r.hops === nextHops && r.usd === value)) {
    // Not every combination is deployed. Fall to the nearest value that is,
    // rather than refusing the click and appearing broken.
    const atHops = RULES.filter((r) => r.hops === nextHops).map((r) => r.usd);
    if (atHops.length === 0) return;
    value = atHops.reduce((best, v) =>
      Math.abs(v - nextUsd) < Math.abs(best - nextUsd) ? v : best);
  }
  hops = nextHops;
  usd = value;
  renderConsole(document.getElementById("addr")?.value || "");
}

/** Cycle the value to its next setting that exists at this distance. */
function cycle() {
  const values = [...new Set(RULES.map((r) => r.usd))].sort((a, b) => a - b);
  for (let i = 1; i <= values.length; i++) {
    const next = values[(values.indexOf(usd) + i) % values.length];
    if (RULES.some((r) => r.hops === hops && r.usd === next)) {
      setRule(hops, next);
      return;
    }
  }
}

/** The scan, shown settled, for a result that has no path to draw. */
function renderClearedSteps(maxHops) {
  const shown = STEPS.filter((st) => st.key <= maxHops);
  return `<div class="steps">
    ${shown.map((st, n) => `
      ${n ? '<span class="arrow" aria-hidden="true"></span>' : ""}
      <div class="step clear">
        <span class="step-label">${esc(st.label)}</span>
        <span class="step-note">clear</span>
      </div>`).join("")}
  </div>`;
}

/* ── Decision summary ────────────────────────────────────────────
   Distance, value and outcome as three figures. The ladder these replace
   spent a full row rendering a number between zero and three, and the path
   below says the same thing with evidence attached. */
function renderStats(r) {
  const distance = r.direct_match ? "Known address"
    : r.exposure ? `${r.hop_count} ${r.hop_count === 1 ? "hop" : "hops"}`
    : "None within 3";
  const value = r.direct_match ? "—"
    : typeof r.exposure_usd === "number" ? money(r.exposure_usd) : "—";
  const decision = r.decision === "ALLOW" ? "Allowed" : "Blocked";

  // The exposure figure is the smallest transfer on the path. Where that is
  // the wallet's own transfer, the screening reports its hash and the figure
  // can link to it. Where the smallest transfer is further along the path,
  // inside the precomputed neighbourhood, no hash was returned and the figure
  // stays plain rather than linking to the wrong transaction.
  const tx = (r.edges || [])[0]?.tx;
  const isFirstEdge = typeof r.first_edge_usd === "number"
    && r.first_edge_usd === r.exposure_usd;
  const valueCell = (tx && isFirstEdge)
    ? `<a class="stat-v stat-link" href="https://etherscan.io/tx/${esc(tx)}"
         target="_blank" rel="noopener"
         title="The transfer this figure comes from">${esc(value)} <span class="stat-ext">↗</span></a>`
    : `<div class="stat-v">${esc(value)}</div>`;

  return `<div class="stats">
    <div class="stat"><div class="stat-k">Distance</div><div class="stat-v">${esc(distance)}</div>
      <div class="stat-note">to a known address</div></div>
    <div class="stat">
      <div class="stat-k">Smallest transfer</div>${valueCell}
      <div class="stat-note">on the path above</div></div>
    <div class="stat"><div class="stat-k">Decision</div><div class="stat-v">${esc(decision)}</div>
      <div class="stat-note">by operator quorum</div></div>
  </div>`;
}

/* ── Console ─────────────────────────────────────────────────── */
function renderConsole(prefill = "", error = "") {
  const ready = presets.filter((p) => p.address);
  stage.className = "stage";
  stage.innerHTML = `
    <div class="console">
      <div class="col">
        <div class="h6 muted">Active policy</div>
        <div class="card card-policy">
          <div class="card-body">
            <div class="h4">Lazarus Scan</div>
            <p class="rule">
              Block a wallet within <b>${hops} ${hops === 1 ? "hop" : "hops"}</b>
              of a known Lazarus address, on transfers of
              <button class="pick" id="pick-usd" type="button">${usdLabel(usd)}</button>.
            </p>
            <p class="p-sm muted" style="margin:var(--s-2) 0 0;max-width:46ch">
              Both parameters are held on-chain. Changing either selects a
              different deployed policy, so the rule is fixed before the wallet
              is screened. The address list is fixed at 7 Sept 2026; the
              transaction graph is read live.
            </p>

            <div class="hops" id="hops">
              <span class="hop hop-you"><span class="hop-n">You</span></span>
              ${[1, 2, 3].map((n) => `
                <span class="hop-link ${n <= hops ? "on" : ""}"></span>
                <button class="hop hop-pick ${n === hops ? "sel" : ""} ${n <= hops ? "on" : ""}"
                  type="button" data-hops="${n}"
                  ${HOP_CHOICES.includes(n) ? "" : "disabled"}>
                  <span class="hop-n">${n}</span>
                </button>`).join("")}
              <span class="hop-link ${hops >= 3 ? "on" : ""}"></span>
              <span class="hop hop-end"><span class="hop-n">Lazarus</span></span>
            </div>
            <p class="p-sm muted" style="margin:var(--s-1) 0 0">
              Click a hop to set how far the scan reaches.
            </p>
          </div>
          <div class="deployed">
            <span class="p-sm muted">Policy</span>
            <a class="fact-link" href="https://sepolia.etherscan.io/address/${POLICY_ADDRESS}"
               target="_blank" rel="noopener">${short(POLICY_ADDRESS)}</a>
            <span class="p-sm muted">·</span>
            <span class="p-sm muted">Against 3,597 addresses</span>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="h6 muted">Screen a wallet</div>
        <div class="card card-check">
          <div class="card-body">
            ${ready.length ? `
            <div style="display:flex;flex-direction:column;gap:var(--s-1)">
              <span class="label">Pick an example</span>
              <div class="examples">
                ${ready.map((p) => `<button class="example" type="button" data-addr="${esc(p.address)}">
                  <span class="example-name">${esc(p.label)}</span>
                  <span class="example-addr">${esc(short(p.address))}</span>
                </button>`).join("")}
              </div>
            </div>
            <div class="divide"><span></span><span class="divide-text">or</span><span></span></div>` : ""}
            <div style="display:flex;flex-direction:column;gap:var(--s-1)">
              <label class="label" for="addr">Enter any Ethereum address</label>
              <input class="field" id="addr" spellcheck="false" autocomplete="off"
                     placeholder="0x…" value="${esc(prefill)}" />
              <p class="err" id="err">${esc(error)}</p>
            </div>
          </div>
          <button class="btn btn-primary btn-lg btn-block" id="go">Run the check</button>
        </div>
      </div>
    </div>`;

  const input = document.getElementById("addr");
  const go = document.getElementById("go");
  // Picking an example fills the field rather than running immediately, so the
  // address is visible before the check and both inputs stay one flow.
  stage.querySelectorAll(".example").forEach((b) => {
    b.onclick = () => {
      stage.querySelectorAll(".example").forEach((x) => x.classList.remove("chosen"));
      b.classList.add("chosen");
      input.value = b.dataset.addr;
      input.classList.remove("invalid");
      document.getElementById("err").textContent = "";
      sync();
    };
  });
  // Typing an address clears the chosen example, so the two never disagree.
  input.addEventListener("input", () => {
    stage.querySelectorAll(".example").forEach((x) => {
      x.classList.toggle("chosen", x.dataset.addr === input.value.trim());
    });
  });
  stage.querySelectorAll(".hop-pick").forEach((b) => {
    b.onclick = () => setRule(Number(b.dataset.hops), usd);
  });
  const pickUsd = document.getElementById("pick-usd");
  if (pickUsd) pickUsd.onclick = () => cycle();

  const valid = (v) => /^0x[0-9a-fA-F]{40}$/.test(String(v ?? "").trim());
  const sync = () => { go.disabled = !valid(input.value); };
  input.oninput = () => {
    input.classList.remove("invalid");
    document.getElementById("err").textContent = "";
    sync();
  };
  input.onkeydown = (e) => { if (e.key === "Enter" && !go.disabled) go.click(); };
  go.onclick = () => submit(String(input.value ?? "").trim());
  sync();
  if (window.matchMedia("(min-width: 861px)").matches) input.focus();
}

/* ── Checking ────────────────────────────────────────────────────
   The screening genuinely works outward from the wallet, so the steps track
   real stages rather than decorating a wait. When the answer arrives the
   matching step is marked and the rest clear, which makes the result legible
   before the verdict panel replaces it. */
/* The deployed contracts. Shown so the policy can be inspected rather than
   taken on trust; update these if the policy is redeployed. */
const POLICY_ADDRESS = "0x5A46A90e0B26Ed56201F24620dbF701D53433BB8";
const POLICY_CLIENT  = "0xfD054556b4D00D8B0f897b1Ae377ECD17Fccae78";

const STEPS = [
  { key: 0, label: "Checking the wallet itself" },
  { key: 1, label: "Looking one hop out" },
  { key: 2, label: "Looking two hops out" },
  { key: 3, label: "Looking three hops out" },
];

function renderChecking(address) {
  stage.className = "stage";
  stage.innerHTML = `
    <div class="checking">
      <div class="v-grid">
        <div class="v-left">
          <div class="steps">
            ${STEPS.filter((st) => st.key <= hops).map((st, n) => `
              ${n ? '<span class="arrow" aria-hidden="true"></span>' : ""}
              <div class="step ${n === 0 ? "active" : "idle"}" data-step="${st.key}">
                <span class="step-label">${esc(st.label)}</span>
                <span class="step-note"></span>
              </div>`).join("")}
          </div>
        </div>
        <div class="v-right">
          <div class="h1">Checking</div>
          <p class="reason p-lg">Tracing the graph outward from this wallet, then
            waiting on an operator quorum.</p>
          <div class="mono p-sm" style="word-break:break-all;margin-top:var(--s-3);color:var(--on-62)">${esc(address)}</div>
        </div>
      </div>
    </div>`;

  const rows = () => [...stage.querySelectorAll(".step")];
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  return {
    stop() {},
    /** Walk outward one step at a time. Each step that comes back clean turns
     *  green; the step that finds the path turns red and the walk stops. */
    async settle(hop) {
      const list = rows();
      if (!list.length) return;
      const hit = (hop === null || hop === undefined) ? list.length : hop;

      for (let n = 0; n < list.length; n++) {
        const row = list[n];
        row.classList.remove("idle");
        row.classList.add("active");
        await wait(430);
        row.classList.remove("active");

        if (n === hit) {
          row.classList.add("hit");
          row.querySelector(".step-note").textContent = "exposure found";
          // Anything further out is never reached, so it is not shown as checked.
          list.slice(n + 1).forEach((r) => r.classList.add("idle"));
          await wait(850);
          return;
        }

        row.classList.add("clear");
        row.querySelector(".step-note").textContent = "clear";
      }
      await wait(650);
    },
  };
}

/* ── Submit ──────────────────────────────────────────────────── */
async function submit(address) {
  if (inFlight) return;
  const input = document.getElementById("addr");
  if (!/^0x[0-9a-fA-F]{40}$/.test(address)) {
    if (input) {
      input.classList.add("invalid");
      document.getElementById("err").textContent = "That is not a 42-character Ethereum address.";
      input.focus();
    }
    return;
  }
  inFlight = true;
  const search = renderChecking(address);
  try {
    const resp = await fetch("/api/evaluate?address=" + encodeURIComponent(address)
      + "&max_hops=" + hops + "&min_usd=" + usd);
    const result = await resp.json();
    if (result.status === "INVALID_ADDRESS") {
      search.stop();
      return renderConsole(address, result.reason);
    }
    await search.settle(result.exposure ? result.hop_count : null);
    renderVerdict(result);
  } catch (e) {
    search.stop();
    renderVerdict({
      wallet: address.toLowerCase(), status: "SCREENING_FAILED", decision: "DENY",
      reason: "Unable to complete exposure check",
      detail: String(e.message || e), evaluated_at: new Date().toISOString(),
    });
  } finally { inFlight = false; }
}

/* ── Verdict ─────────────────────────────────────────────────── */
function roleLabel(node, index) {
  if (node.role === "lazarus") return node.label || "Lazarus Group";
  if (index === 0) return "Submitted wallet";
  if (node.role === "service") return node.label || "Service";
  return "Intermediary " + index;
}

function renderPath(result) {
  const nodes = result.nodes?.length
    ? result.nodes
    : (result.path || []).map((a) => ({ address: a, role: "wallet" }));
  if (nodes.length < 2) return "";

  // Each hop corresponds to a transfer. Where the screening reported the
  // transaction, the arrow links to it, so the claim can be checked rather
  // than taken on trust.
  const txFor = (i) => {
    const edge = (result.edges || [])[i];
    return edge?.tx || null;
  };

  const parts = nodes.map((n, i) => {
    const cls = i === 0 ? "origin" : (n.role === "lazarus" ? "match" : "");
    return `<div class="node ${cls}">
      <a class="node-addr" href="https://etherscan.io/address/${esc(n.address)}"
         target="_blank" rel="noopener" title="${esc(n.address)}">${esc(short(n.address))}</a>
      <span class="node-role">${esc(roleLabel(n, i))}</span>
    </div>`;
  });

  const joined = parts.reduce((acc, part, i) => {
    if (i === 0) return part;
    const tx = txFor(i - 1);
    const arrow = tx
      ? `<a class="arrow arrow-tx" href="https://etherscan.io/tx/${esc(tx)}"
           target="_blank" rel="noopener" title="View this transfer on Etherscan"></a>`
      : '<span class="arrow" aria-hidden="true"></span>';
    return acc + arrow + part;
  }, "");
  return `<div class="path">${joined}</div>`;
}


function renderVerdict(r) {
  const attested = r.attestation?.status === "ATTESTED";

  const failed = r.status === "SCREENING_FAILED";
  const unattested = r.status === "ATTESTATION_FAILED";
  let tone, headline, reason, body = { left: "", right: "", foot: "" };

  if (failed) {
    tone = "fail"; headline = "Screening failed";
    reason = "The transaction graph could not be read, so the wallet was not screened. "
           + "The policy denies by default. This is not a finding of exposure.";
  } else if (unattested) {
    tone = "fail"; headline = "Not attested";
    reason = "The wallet was screened, but the decision could not be attested, so it "
           + "carries no proof and the policy denies by default.";
    body = { left: renderPath(r), right: renderStats(r), foot: "" };
  } else if (r.exposure) {
    tone = "block"; headline = "Non&nbsp;Compliant";
    reason = r.direct_match
      ? "This wallet is a known Lazarus Group address. The transfer is blocked."
      : `This wallet reaches a known Lazarus Group address in ${r.hop_count}`
        + ` ${r.hop_count === 1 ? "hop" : "hops"}. The transfer is blocked.`;
    body = { left: renderPath(r), right: renderStats(r), foot: "" };
  } else {
    tone = "pass"; headline = "Compliant";
    reason = "No path to a known Lazarus Group address was found within three hops. "
           + "The transfer may proceed.";
    body = { left: renderClearedSteps(r.dataset?.max_hops ?? 3),
             right: renderStats(r), foot: "" };
  }

  const detail = r.detail || r.attestation?.detail;
  stage.className = "stage";
  stage.innerHTML = `
    <div class="verdict ${tone}">
      <div class="v-grid ${body.left ? "" : "single"}">
        ${body.left ? `<div class="v-left">${body.left}</div>` : ""}
        <div class="v-right">
          <div class="h1">${headline}</div>
          <p class="reason p-lg">${esc(reason)}</p>
          ${detail ? `<div class="detail">${esc(detail)}</div>` : ""}
          ${body.right}
        </div>
      </div>
      <div class="actions">
        <span class="line"></span>
        <button class="btn btn-tertiary btn-md" id="again">New check</button>
        ${r.explorer_url ? `<a class="btn btn-primary btn-md" href="${esc(r.explorer_url)}"
           target="_blank" rel="noopener">View attestation<span class="btn-long">&nbsp;on the Newton explorer</span> ↗</a>` : ""}
      </div>
      ${body.foot}
    </div>`;

  document.getElementById("again").onclick = () => renderConsole(r.wallet);

}

/* ── Boot ────────────────────────────────────────────────────── */
(async function boot() {
  const wallets = fetch("data/demo_wallets.json")
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null);
  // Don't let a slow file hold the page hostage, but do avoid painting the
  // console twice: once empty and once with examples.
  const timeout = new Promise((r) => setTimeout(() => r(null), 1200));
  const data = await Promise.race([wallets, timeout]);
  const loaded = data?.wallets;
  if (Array.isArray(loaded) && loaded.some((w) => w.address)) presets = loaded;
  renderConsole();
})();
</script>
</body>
