<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Newton — Lazarus Scan</title>
<meta name="description" content="Screen a wallet for its distance to a known Lazarus Group address, and have an operator quorum attest the decision onchain." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink-90:#1B171A; --ink-70:#77767A; --ink-50:#B0B4BA;
    --ink-30:#E0E0E3; --ink-10:#F0F0FA; --paper:#FFFFFF;
    --black:#000000; --leaf-50:#00CC8F; --ruby-50:#FC5C36; --ruby-90:#932303;

    --s-05:4px; --s-1:8px; --s-15:12px; --s-2:16px; --s-3:24px;
    --s-4:32px; --s-5:40px; --s-6:48px; --s-8:64px;
    --box-pad:16px;

    --pass-a:#DFFDCF; --pass-b:#B4DCB8; --pass-edge:#5FAE6E;
    --block-a:#FAE1C2; --block-b:#E5BB8F; --block-edge:#C9772E;
    --fail-a:#EFEDEA; --fail-b:#D6D2CD;

    --on-22:rgba(27,23,26,.22); --on-35:rgba(27,23,26,.35);
    --on-62:rgba(27,23,26,.62);
    --veil:rgba(255,255,255,.5); --veil-strong:rgba(255,255,255,.85);

    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --pill:999px;
    --inset:clamp(var(--s-3),4vw,var(--s-6));
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--ink-10); color:var(--ink-90);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    padding:var(--s-3); display:flex; flex-direction:column; gap:var(--s-3);
    height:100vh; height:100dvh; overflow:hidden;
  }
  :focus-visible { outline:2px solid var(--ink-90); outline-offset:2px; }

  /* iOS Safari eats taps three ways; each is closed off here.
     1. Double-tap-to-zoom delays or swallows a single tap on a button.
     2. A tap on a span inside a button can resolve to the span, not the
        button, so the child takes no pointer events.
     3. Hover styles stick after a tap on touch screens; they only apply on
        devices that genuinely hover. */
  button, a, .pk, .rail-node, .act-dot { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .pk *, .btn *, .rail-node * { pointer-events:none; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }

  .h1, .h2, .rule, .reason { text-wrap:balance; }
  .h1 { font-size:clamp(34px,4.4vw,60px); line-height:1.04; font-weight:700; letter-spacing:-.025em; }
  .h2 { font-size:clamp(28px,3.2vw,44px); line-height:1.1; font-weight:700; letter-spacing:-.02em; }
  .h4 { font-size:20px; line-height:32px; font-weight:700; }
  .h6 { font-size:12px; line-height:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  .p-lg { font-size:18px; line-height:28px; }
  .p-std { font-size:16px; line-height:24px; }
  .p-sm { font-size:14px; line-height:24px; }
  .mono { font-family:var(--mono); }
  .muted { color:var(--ink-70); }

  .mast {
    background:var(--paper); border:1px solid var(--ink-30); border-radius:var(--r-lg);
    display:flex; align-items:center; justify-content:space-between;
    gap:var(--s-3); padding:var(--s-15) var(--inset); flex-wrap:wrap; flex-shrink:0;
  }
  .brand { display:flex; align-items:center; gap:var(--s-2); }
  .wordmark { height:22px; width:auto; color:var(--ink-90); display:block; }
  .badge {
    background:var(--ink-90); color:var(--paper); border-radius:var(--r-sm);
    padding:var(--s-1) var(--s-2); font-size:12px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase;
    border:none; font-family:var(--sans); cursor:pointer;
    transition:opacity .12s;
  }
  .badge:hover { opacity:.82; }
  .pill {
    display:flex; align-items:center; gap:var(--s-1); height:40px;
    border:1px solid var(--ink-30); border-radius:var(--r-sm);
    padding:0 var(--s-2); background:var(--ink-10);
    font-size:14px; font-weight:500; white-space:nowrap;
  }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--leaf-50); }

  .stage {
    background:var(--paper); border:1px solid var(--ink-30);
    border-radius:var(--r-xl); overflow:hidden; display:flex;
    justify-content:center; flex:1; min-height:0;
  }

  /* ── Intro ──────────────────────────────────────────────────── */
  .intro {
    width:100%; display:flex; flex-direction:column; justify-content:center;
    padding-block:var(--s-5);
    padding-inline:max(var(--inset), calc((100% - 1200px) / 2));
    min-height:0; overflow-y:auto;
  }
  .act { max-width:44ch; }
  /* The copy crossfades rather than cutting, so the eye follows the argument
     from one act to the next. */
  #act-copy {
    transition:opacity .22s ease, transform .22s ease;
    min-height:clamp(260px, 30vh, 340px);
  }
  #act-copy.fading { opacity:0; transform:translateY(6px); }
  .act .h6 { color:var(--ink-50); }
  .act .h2 { margin-top:var(--s-2); }
  .act p { margin:var(--s-3) 0 0; color:var(--ink-70); }
  .intro-foot {
    display:flex; align-items:center; gap:var(--s-3);
    margin-top:var(--s-4); flex-wrap:wrap;
  }
  .acts { display:flex; gap:var(--s-1); }
  .act-dot {
    width:var(--s-1); height:var(--s-1); padding:0; border:none;
    border-radius:var(--pill); background:var(--ink-30); cursor:pointer;
    transition:background .2s;
  }
  .act-dot.on { background:var(--ink-90); }

  .intro-grid {
    display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr);
    gap:var(--s-6); align-items:center; width:100%;
  }
  .act-figure { min-width:0; }

  /* One diagram, three readings: the marks and the bracket carry the argument. */
  .chain { display:flex; flex-direction:column; gap:var(--s-1); }
  .cn-row { display:flex; align-items:flex-start; }
  .cn-cell { display:flex; flex-direction:column; align-items:center; gap:var(--s-1); flex:1; min-width:0; }
  .cn {
    width:100%; min-height:var(--s-6); padding:var(--s-1) var(--s-15);
    display:flex; align-items:center; justify-content:center; text-align:center;
    border:1px solid var(--ink-30); border-radius:var(--r-sm);
    background:var(--paper); font-size:14px; font-weight:500; color:var(--ink-90);
    transition:background .3s, border-color .3s, color .3s, opacity .3s;
  }
  .cn.known { border-color:var(--ink-90); }
  .cn { transform:translateZ(0); }
  .cn.off   { color:var(--ink-50); opacity:.5; }
  .cn.pass  { background:var(--pass-a); border-color:var(--pass-b); }
  .cn.hit   { background:var(--block-a); border-color:var(--block-b); }
  .cn-cap {
    font-size:12px; color:var(--ink-50); text-align:center; min-height:16px;
    transition:color .3s;
  }
  .cn-link { flex:0 0 var(--s-4); height:1px; background:var(--ink-30); margin-top:var(--s-3); }

  /* The bracket spans whole cells, so its width is computed from the count
     rather than guessed, and it holds when the row reflows. */
  .cn-bracket {
    width:calc((100% - 3 * var(--s-4)) * var(--span) / 4 + (var(--span) - 1) * var(--s-4));
    display:flex; flex-direction:column; align-items:center; gap:var(--s-05);
    opacity:0; transition:width .42s cubic-bezier(.4,0,.2,1), opacity .3s ease;
  }
  .cn-bracket.on { opacity:1; }
  .cn-rule { width:100%; height:1px; background:var(--ink-50); }
  .cn-blabel {
    font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-70); text-align:center;
  }

  /* The example wallets sit on the same chain the diagram just explained. */
  /* Five two-line labels on one row: the cells need room to breathe and the
     text needs to wrap inside them rather than spilling past the border. */
  .picker { display:flex; align-items:flex-start; gap:var(--s-1); margin-top:var(--s-1); }
  .pk-cell { display:flex; flex-direction:column; align-items:stretch; gap:var(--s-05); flex:1 1 0; min-width:0; }
  .pk {
    width:100%; min-height:56px; padding:var(--s-1) var(--s-05);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; text-align:center;
    border:1px solid var(--ink-30); border-radius:var(--r-sm);
    background:var(--paper); cursor:pointer; font-family:var(--sans);
    font-size:13px; font-weight:500; color:var(--ink-90); line-height:17px;
    overflow-wrap:anywhere; hyphens:auto;
    transition:border-color .12s, background .12s, color .12s;
  }
  @media (hover:hover) { .pk:hover:not(.chosen) { border-color:var(--ink-90); } }
  .pk.chosen { border-color:var(--ink-90); background:var(--ink-90); color:var(--paper); }
  .pk:active { transform:scale(.98); }
  .pk-name { font-size:14px; font-weight:600; }
  .pk-addr { font-family:var(--mono); font-size:11px; color:var(--ink-50); }
  .pk.chosen .pk-addr { color:var(--ink-30); }
  .pk-link { display:none; }

  .deployed {
    margin-top:auto; padding-top:var(--s-2); border-top:1px solid var(--ink-30);
    display:flex; align-items:center; gap:var(--s-1); flex-wrap:wrap;
  }
  .fact-link {
    font-family:var(--mono); font-size:14px; font-weight:500;
    color:var(--ink-90); text-decoration:none; border-bottom:1px solid var(--ink-30);
  }
  .fact-link:hover { border-color:var(--ink-90); }

/* ── Console ────────────────────────────────────────────────── */
  .console {
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:stretch; gap:var(--s-4); align-content:center;
    padding:var(--s-3) var(--inset); max-width:1400px; width:100%; margin:0 auto;
    min-height:0; overflow-y:auto;
  }
  .col { display:flex; flex-direction:column; gap:var(--s-15); min-width:0; }
  .card {
    display:flex; flex-direction:column; min-height:0; height:100%;
    border-radius:var(--r-md); padding:var(--s-3);
    background:var(--paper); border:1px solid var(--ink-30);
  }
  .card-body { min-height:0; display:flex; flex-direction:column; }
  .card-body { flex:1; }
  .card-check .card-body { gap:var(--s-2); }

  .rule { margin:var(--s-2) 0 0; max-width:40ch; font-size:20px; line-height:30px; }

  /* The rail is the distance control: reach is shown by what is lit. */
  /* Built like the intro chain: a stop, and what that stop is. */
  .rail { display:flex; align-items:flex-start; margin-top:var(--s-3); }
  .rail-cell {
    display:flex; flex-direction:column; align-items:center; gap:var(--s-05);
    flex:0 0 auto; min-width:0;
  }
  .rail-cap {
    font-size:11px; color:var(--ink-50); text-align:center; white-space:nowrap;
  }
  .rail-node {
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    height:var(--s-4); padding:0 var(--s-15);
    border:1px solid var(--ink-30); border-radius:var(--r-sm);
    background:var(--paper); font-family:var(--sans);
    font-size:12px; font-weight:600; color:var(--ink-50);
  }
  .rail-node.on { border-color:var(--ink-90); color:var(--ink-90); }
  .rail-node.sel { background:var(--ink-90); border-color:var(--ink-90); color:var(--paper); }
  .rail-node.end { background:var(--ink-90); border-color:var(--ink-90); color:var(--paper); }
  button.rail-node { cursor:pointer; transition:border-color .12s, background .12s, color .12s; }
  span.rail-node { cursor:default; }
  @media (hover:hover) { button.rail-node:hover:not(.sel) { background:var(--ink-10); } }
  .rail-link {
    flex:1 1 auto; height:1px; background:var(--ink-30);
    min-width:var(--s-1); margin-top:var(--s-2);
  }
  .rail-link.on { background:var(--ink-90); }
  .rail-cell:has(.sel) .rail-cap { color:var(--ink-90); font-weight:600; }

  .label { font-size:14px; font-weight:500; color:var(--ink-70); }

  .flow-row {
    display:flex; align-items:flex-start; gap:var(--s-15);
    font-size:14px; line-height:20px; color:var(--ink-70); min-width:0;
  }
  .flow-row > span:last-child { flex:1; min-width:0; }
  .flow-n {
    width:20px; height:20px; flex-shrink:0; margin-top:1px; border-radius:var(--pill);
    background:var(--ink-90); color:var(--paper);
    font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center;
  }


  .field {
    width:100%; height:48px; border:1px solid var(--ink-50);
    border-radius:var(--r-sm); background:var(--paper);
    padding:0 var(--box-pad); font-family:var(--mono); font-size:16px; color:var(--ink-90);
  }
  .field::placeholder { color:var(--ink-50); }
  .field:focus { border-color:var(--ink-90); outline:none; box-shadow:0 0 0 var(--s-05) var(--ink-30); }
  .field.invalid { border-color:var(--ruby-50); }
  .err { font-size:14px; line-height:20px; color:var(--ruby-90); margin:0; }
  .err:empty { display:none; }

  .btn {
    border:none; border-radius:var(--pill); cursor:pointer;
    font-family:var(--sans); font-weight:600; text-decoration:none;
    display:inline-flex; align-items:center; justify-content:center; gap:var(--s-1);
    text-align:center; line-height:20px;
    transition:background .12s, border-color .12s, opacity .12s;
  }
  .btn-lg { min-height:48px; padding:var(--s-15) var(--s-4); font-size:16px; }
  .btn-md { min-height:44px; padding:var(--s-15) var(--s-3); font-size:14px; }
  .btn-primary { background:var(--ink-90); color:var(--paper); }
  @media (hover:hover) { .btn-primary:hover { background:var(--black); } }
  .btn-primary[disabled] { background:var(--ink-50); cursor:default; }
  .btn-tertiary { background:transparent; color:var(--ink-90); border:1px solid var(--ink-90); }
  @media (hover:hover) { .btn-tertiary:hover { background:var(--ink-10); } }
  .btn-block { width:100%; margin-top:var(--s-2); flex-shrink:0; }

  /* ── Scan and verdict share one frame ───────────────────────── */
  .intro, .console, .checking, .verdict { min-height:560px; }
  .checking, .verdict {
    width:100%; display:flex; flex-direction:column; justify-content:center;
    padding-block:var(--s-5);
    padding-inline:max(var(--inset), calc((100% - 1200px) / 2));
    min-height:0; overflow-y:auto;
  }  #actions-slot {
    margin:var(--s-4) 0 0; min-height:44px; opacity:0; visibility:hidden;
    transition:opacity .4s ease .15s, visibility 0s linear .15s;
  }
  #actions-slot.on { opacity:1; visibility:visible; transition-delay:.15s, 0s; }

  .verdict { transition:background .7s cubic-bezier(.4,0,.2,1); }
  #right-slot { transition:opacity .22s ease, transform .22s ease; }
  #right-slot.swapping { opacity:0; transform:translateY(6px); }
  .verdict.pass  { background:linear-gradient(135deg,var(--pass-a),var(--pass-b)); }
  .verdict.block { background:linear-gradient(135deg,var(--block-a),var(--block-b)); }
  .verdict.fail  { background:linear-gradient(135deg,var(--fail-a),var(--fail-b)); }

  .grid {
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:var(--s-8); align-items:start; width:100%;
  }
  .grid.single { grid-template-columns:minmax(0,1fr); }
  .left { display:flex; align-items:flex-start; min-width:0; }
  .left-stack { width:100%; }
  .right { min-width:0; min-height:300px; }

  /* The scan rows and the path nodes are one component, so the chain
     settles into the place the steps occupied rather than replacing them. */
  .steps {
    display:flex; flex-direction:column; align-items:stretch; gap:var(--s-1);
    width:100%; max-width:440px; margin:0;
  }
  .step {
    display:flex; align-items:baseline; justify-content:space-between; gap:var(--s-2);
    min-height:36px; padding:var(--s-1) var(--box-pad);
    border:1px solid var(--on-22); border-radius:var(--r-sm);
    background:var(--veil);
  }
  .step {
    font-size:16px; color:var(--ink-50);
    border-color:var(--ink-30); background:var(--paper);
    transition:opacity .25s, border-color .2s, color .2s, background .2s;
    transition:opacity .25s, border-color .2s, color .2s, background .2s;
  }
  .step { position:relative; overflow:hidden; align-items:center; }
  .step.active { border-color:var(--ink-90); color:var(--ink-90); }
  /* A band of light crosses the row while it is being checked, which reads
     as work happening; the old opacity pulse read as a loading glitch. */
  .step.active::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent 0%, var(--ink-10) 45%,
               rgba(255,255,255,.9) 50%, var(--ink-10) 55%, transparent 100%);
    background-size:220% 100%;
    animation:sweep 1.1s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sweep { from { background-position:120% 0; } to { background-position:-120% 0; } }
  .settled .step.active { animation:none; }
  .step.waiting .step-note { animation:pulse 1.4s ease-in-out infinite; }
  .settled .step.waiting .step-note { animation:none; }
  .step.clear { color:var(--ink-90); border-color:var(--pass-edge); background:var(--pass-a); }
  .step { border-width:1.5px; }
  .step.hit   { color:var(--ink-90); border-color:var(--block-edge); background:var(--block-a); }
  .step.below { color:var(--ink-90); border-color:var(--fail-b); background:var(--fail-a); }
  .step.idle { opacity:.35; }
  .step-icon {
    position:relative; z-index:1; flex-shrink:0;
    width:18px; height:18px; border-radius:var(--pill);
    border:1.5px solid var(--ink-30); background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; line-height:1;
    transition:background .25s, border-color .25s, color .25s, transform .25s;
  }
  .step.active .step-icon { border-color:var(--ink-90); }
  .step.clear .step-icon { background:var(--pass-edge); border-color:var(--pass-edge); color:var(--paper); }
  .step.clear .step-icon::before { content:'✓'; }
  .step.hit .step-icon { background:var(--block-edge); border-color:var(--block-edge); color:var(--paper); }
  .step.hit .step-icon::before { content:'!'; }
  .step.below .step-icon { background:var(--ink-50); border-color:var(--ink-50); color:var(--paper); }
  .step.below .step-icon::before { content:'–'; }
  /* One small pop when the answer lands, so each row resolves visibly. */
  .step.resolved .step-icon { animation:pop .32s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform:scale(.4); } 100% { transform:scale(1); } }
  .step-label { flex:1; font-size:16px; position:relative; z-index:1; }
  .lbl-short { display:none; }
  .step-note {
    position:relative; z-index:1;
    font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap;
  }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.45; } }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } }
  @keyframes settleIn { from { opacity:0; transform:translateY(-4px) scale(.99); } }

  /* The steps arrive in sequence, so the scan looks like it is being built
     rather than appearing all at once. */
  .steps .step { animation:rise .34s ease backwards; }
  .steps .step:nth-child(1) { animation-delay:.02s; }
  .steps .step:nth-child(3) { animation-delay:.08s; }
  .steps .step:nth-child(5) { animation-delay:.14s; }
  .steps .step:nth-child(7) { animation-delay:.20s; }
  .steps .arrow { animation:rise .34s ease backwards .1s; }

  /* The verdict settles into the panel the scan left behind. */
  .right .h1, .right .reason, .right .stats, .right .detail { animation:settleIn .4s ease backwards; }
  .right .reason { animation-delay:.06s; }
  .right .stats  { animation-delay:.12s; }

  /* Each figure counts in just after the one before it. */
  .stat { animation:rise .36s ease backwards; }
  .stat:nth-child(1) { animation-delay:.14s; }
  .stat:nth-child(2) { animation-delay:.20s; }
  .stat:nth-child(3) { animation-delay:.26s; }

  /* The console's two cards arrive together but not abruptly. */
  .console .col { animation:rise .4s ease backwards; }
  .console.still .col, .console.still .rail-cell { animation:none; }
  .console .col:nth-child(2) { animation-delay:.07s; }

  /* The intro figure follows its copy. */
  .act-figure { animation:rise .45s ease backwards .1s; }
  .cn-cell { animation:rise .4s ease backwards; }
  .cn-cell:nth-child(3) { animation-delay:.06s; }
  .cn-cell:nth-child(5) { animation-delay:.12s; }
  .cn-cell:nth-child(7) { animation-delay:.18s; }
  .arrow {
    align-self:flex-start; margin-left:var(--s-2); color:var(--ink-30);
    font-size:16px; line-height:16px; text-decoration:none;
    transition:color .3s ease, transform .3s ease;
  }
  .arrow.lit { color:var(--ink-90); transform:translateY(2px); }
  .arrow::after { content:'↓'; }

  .reason { margin-top:var(--s-3); max-width:44ch; color:var(--ink-90); }
  .detail { font-family:var(--mono); font-size:14px; line-height:20px; color:var(--on-62); margin-top:var(--s-15); max-width:64ch; word-break:break-word; }

  .stats {
    display:grid; grid-template-columns:repeat(3, minmax(0,1fr));
    margin-top:var(--s-5); max-width:560px;
  }
  .stat { padding:0 var(--s-4); }
  .stat:first-child { padding-left:0; }
  .stat + .stat { border-left:1px solid var(--on-22); }
  .stat-k { font-size:14px; color:var(--on-62); }
  .stat-v { font-size:24px; font-weight:700; letter-spacing:-.01em; margin-top:2px; }
  .stat-link {
    display:inline-flex; align-items:baseline; gap:var(--s-05);
    color:var(--ink-90); text-decoration:none; border-bottom:1px solid var(--on-35);
  }
  .stat-link:hover { border-color:var(--ink-90); }
  .stat-ext { font-size:14px; font-weight:500; color:var(--on-62); }

  .actions { display:flex; align-items:center; gap:var(--s-15); margin:var(--s-4) 0 0; flex-wrap:wrap; }
  .actions .line { flex:1; min-width:var(--s-4); height:1px; background:var(--on-22); }

  @media (max-width:860px) { .console { grid-template-columns:1fr; } }
  @media (max-height:900px) {
    body { padding:var(--s-2); gap:var(--s-2); }
    .console { padding:var(--s-2) var(--inset); gap:var(--s-3); }
    .card { padding:var(--s-2); }
    .mast { padding:var(--s-1) var(--inset); }
    .checking, .verdict, .intro { padding-block:var(--s-3); }
  }
  /* Tablets: two columns are too narrow side by side before the phone rules
     take over, so they stack earlier. */
  @media (max-width:900px) {
    .intro-grid { grid-template-columns:minmax(0,1fr); gap:var(--s-4); }
    .act { max-width:none; }
    .grid { grid-template-columns:minmax(0,1fr); gap:var(--s-4); }
  }

  @media (max-width:620px) {
    html,body { height:auto; overflow:visible; }
    body { height:auto; min-height:100dvh; padding:var(--s-15); gap:var(--s-15); }
    .stage { flex:none; }
    .mast { padding:var(--s-15); gap:var(--s-15); }
    .wordmark { height:20px; }
    .console, .checking, .verdict, .intro {
      padding-block:var(--s-3); padding-inline:var(--s-2); overflow:visible;
    }
    .grid, .intro-grid { grid-template-columns:minmax(0,1fr); gap:var(--s-4); }
    .cn-row { flex-direction:column; align-items:stretch; gap:var(--s-1); }
    .cn-link, .pk-link { display:none; }
    .cn-bracket { width:100%; }
    .stats { grid-template-columns:minmax(0,1fr); gap:var(--s-15); }
    .stat, .stat + .stat { border-left:none; padding:0; }
    .stat + .stat { border-top:1px solid var(--on-22); padding-top:var(--s-15); }
    .actions { flex-direction:column; align-items:stretch; }
    .actions .line { display:none; }
    .actions .btn { width:100%; }
    .btn-long { display:none; }
    .card { height:auto; }
    .steps { max-width:none; }
    .h1 { font-size:34px; }

    /* Masthead stays on one line. */
    .mast { flex-wrap:nowrap; gap:var(--s-1); }
    .brand { gap:var(--s-1); min-width:0; }
    .wordmark { height:18px; }
    .badge { padding:6px var(--s-1); font-size:11px; letter-spacing:.04em; }
    .pill { height:32px; padding:0 var(--s-1); font-size:12px; gap:6px; }

    /* Intro: the copy box holds less height on a narrow screen. */
    #act-copy { min-height:230px; }
    .cn-cap:empty { display:none; }
    .cn-cell { gap:var(--s-05); }

    /* The rail turns vertical: each stop gets a row, with its caption
       beside it instead of crushed underneath. */
    .rail { flex-direction:column; align-items:stretch; margin-top:var(--s-2); }
    .rail-cell { flex-direction:row; align-items:center; gap:var(--s-15); }
    .rail-node { min-width:64px; height:36px; font-size:13px; }
    .rail-cap { font-size:13px; text-align:left; white-space:nowrap; color:var(--ink-70); }
    .rail-link { flex:none; width:1.5px; height:12px; margin:0 0 0 31px; min-width:0; }

    /* Steps use their short labels so every row stays one line. */
    .lbl-long { display:none; }
    .lbl-short { display:inline; }
    .step { gap:var(--s-15); }
    .h2 { font-size:28px; line-height:1.14; }
    .intro, .console, .checking, .verdict { min-height:0; }
    /* The chain becomes a vertical list: four boxes across is unreadable. */
    .cn { min-height:44px; font-size:13px; }
    .cn-cap { text-align:left; }
    .cn-cell { align-items:stretch; }
    /* The wallet picker wraps to a grid instead of five columns. */
    .picker { flex-wrap:wrap; }
    .pk-cell { flex:1 1 calc(50% - var(--s-1)); }
    .pk { min-height:48px; font-size:13px; }
    .rail-node { padding:0 var(--s-1); font-size:11px; }
    .rail-cap { font-size:10px; white-space:normal; }
    .rail-link { min-width:var(--s-05); }
    .rule { font-size:18px; line-height:28px; }
    .intro-foot { gap:var(--s-15); }
    .intro-foot .btn { flex:1 1 auto; }
    .step { min-height:44px; }
    .step-label { font-size:15px; }
    .field { font-size:16px; }
  }

  /* The reach summary only exists for phones. */
  .reach-line { display:none; }

  /* ── Phones: one screen, with room to breathe ────────────────────
     Measured, every state used about half the screen, so this spends the
     spare height on type and spacing rather than packing things tight.
     Spacing scales with viewport height so short phones still fit and
     tall ones do not look sparse. */
  @media (max-width:620px) {
    html, body { height:100%; overflow:hidden; }
    body { height:100dvh; min-height:0; padding:var(--s-1); gap:var(--s-1); }
    .stage { flex:1 1 auto; min-height:0; overflow-y:auto; }
    .mast { padding:var(--s-1) var(--s-15); }
    .intro, .console, .checking, .verdict { min-height:0; }

    /* ── Intro ── */
    .intro { padding:clamp(20px, 4vh, 40px) var(--s-3); justify-content:center; }
    .intro-grid { gap:clamp(24px, 5vh, 48px); }
    #act-copy { min-height:clamp(210px, 30vh, 260px); }
    .act .h6 { font-size:12px; }
    .act .h2 { font-size:30px; line-height:1.12; margin-top:var(--s-15); }
    .act p { margin-top:var(--s-2); font-size:16px; line-height:25px; }
    .intro-foot { margin-top:var(--s-3); gap:var(--s-15); }
    .intro-foot .btn-lg { min-height:48px; padding:var(--s-15) var(--s-3); font-size:16px; }
    .intro-foot .btn-md { min-height:48px; }
    /* The dots stay small to look at but get a full-size hit area. */
    .act-dot { position:relative; }
    .act-dot::after { content:''; position:absolute; inset:-18px -8px; }
    .acts { gap:var(--s-15); }
    /* One row of four stops, readable. */
    .cn-row { flex-direction:row; align-items:flex-start; gap:0; }
    .cn-link { display:block; flex:0 0 var(--s-15); margin-top:28px; }
    .cn { min-height:56px; padding:var(--s-1) var(--s-05); font-size:13px; line-height:16px; }
    .cn-cap { font-size:12px; line-height:15px; min-height:15px; }
    .cn-cap:empty { display:block; }
    .cn-blabel { font-size:11px; }

    /* ── Console ── */
    .console { padding:clamp(16px, 3vh, 28px) var(--s-2); gap:clamp(16px, 3vh, 24px); align-content:center; }
    .col { gap:0; }
    .col > .h6 { display:none; }
    .card { padding:clamp(18px, 3vh, 24px); }
    .card-policy .h4, .rail-help, .flow { display:none; }
    .card-policy .rule { margin-top:0; font-size:18px; line-height:26px; }
    .reach-line { display:block; margin:var(--s-15) 0 0; font-size:14px; color:var(--ink-70); }
    .rail { flex-direction:row; align-items:center; margin-top:var(--s-2); }
    .rail-cell { flex-direction:column; gap:0; }
    .rail-cap { display:none; }
    .rail-node { min-width:44px; height:48px; padding:0 var(--s-15); font-size:15px; }
    .rail-link { flex:1 1 auto; width:auto; height:1.5px; margin:0; min-width:var(--s-05); }
    .card-check .card-body { gap:clamp(16px, 2.6vh, 22px); }
    .card-check .label { font-size:14px; }
    .picker { flex-wrap:nowrap; gap:var(--s-1); margin-top:var(--s-1); }
    .pk-cell { flex:1 1 0; }
    .pk { min-height:52px; padding:var(--s-05); }
    .pk-w, .pk-addr { display:none; }
    .pk-name { font-size:16px; }
    .field { height:52px; font-size:16px; }
    .err:empty { display:none; }
    .btn-block { margin-top:clamp(16px, 2.6vh, 22px); min-height:52px; font-size:16px; }

    /* ── Checking and verdict ── */
    .checking, .verdict { padding:clamp(18px, 3vh, 28px) var(--s-2); justify-content:flex-start; }
    .grid { gap:clamp(20px, 3.5vh, 32px); }
    .steps { gap:clamp(4px, .8vh, 8px); }
    .step { min-height:48px; padding:var(--s-1) var(--s-2); }
    .step-label { font-size:16px; }
    .step-note { font-size:12px; letter-spacing:.05em; }
    .step-icon { width:20px; height:20px; font-size:12px; }
    .arrow { font-size:13px; line-height:13px; margin-left:var(--s-3); }
    .right { min-height:0; }
    .h1 { font-size:34px; }
    .reason { margin-top:var(--s-15); font-size:16px; line-height:24px; }
    .stats { grid-template-columns:max-content minmax(0,1fr) max-content; gap:0; margin-top:clamp(16px, 3vh, 28px); }
    .stat-k { white-space:nowrap; }
    .stat, .stat + .stat { padding:0 var(--s-15); border-top:none; }
    .stat:first-child { padding-left:0; }
    .stat + .stat { border-left:1px solid var(--on-22); }
    .stat-k { font-size:13px; }
    .stat-v { font-size:20px; margin-top:var(--s-05); }
    /* The figure's link gets a tall enough hit area without growing. */
    .stat-link { position:relative; }
    .stat-link::after { content:''; position:absolute; inset:-14px -6px; }
    #actions-slot { margin-top:clamp(18px, 3.5vh, 32px); }
    .actions { flex-direction:row; align-items:stretch; gap:var(--s-15); }
    .actions .line { display:none; }
    .actions .btn { width:auto; min-height:52px; font-size:15px; }
    .actions .btn-primary { flex:1 1 auto; }
  }

  /* Short phones only: the verdict carries the most, so it gives back a
     little height here rather than making every phone tighter. */
  @media (max-width:620px) and (max-height:700px) {
    .checking, .verdict { padding-block:14px; }
    .grid { gap:16px; }
    .step { min-height:42px; padding-block:6px; }
    .steps { gap:3px; }
    .h1 { font-size:30px; }
    .reason { font-size:15px; line-height:22px; margin-top:var(--s-1); }
    .stats { margin-top:14px; }
    #actions-slot { margin-top:14px; }
    .actions .btn { min-height:48px; }
    .console { padding-block:14px; gap:14px; }
    .card { padding:16px; }
    #act-copy { min-height:200px; }
  }

  
/* ── Phone ladder ─────────────────────────────────────────────── */
  .addr-wrap { display:flex; flex-direction:column; gap:var(--s-1); }
  .m-only { display:none; }
  @media (max-width:620px) {
    .m-only { display:block; }

    /* The desktop reach card and chip row give way to the ladder. */
    .console > .col:first-child, .picker-wrap, .flow { display:none; }
    .card-check .addr-wrap { display:none; }
    .card-check.show-paste .addr-wrap { display:flex; }
    .card-check.show-paste .m-paste { display:none; }
    .m-paste.hide { display:none; }

    /* One column that fills the screen, Run pinned to the bottom. */
    .console { display:flex; flex-direction:column; align-content:stretch; padding:var(--s-2); gap:0; }
    .console > .col:last-child { flex:1 1 auto; min-height:0; }
    .card-check { height:100%; display:flex; flex-direction:column; }
    .card-check .card-body { flex:1 1 auto; min-height:0; gap:var(--s-2); }
    .card-check .btn-block { margin-top:var(--s-2); }

    .m-reach-top { display:flex; align-items:center; justify-content:space-between; gap:var(--s-15); }
    .m-rule { margin:var(--s-15) 0 0; font-size:14px; line-height:20px; color:var(--ink-70); }
    .m-reach .label { font-size:14px; }
    .m-seg {
      display:flex; padding:3px; gap:3px;
      background:var(--ink-10); border-radius:var(--r-sm);
    }
    .m-seg-btn {
      min-width:64px; height:40px; padding:0 var(--s-15);
      border:none; border-radius:6px; background:transparent; cursor:pointer;
      font-family:var(--sans); font-size:14px; font-weight:600; color:var(--ink-70);
      transition:background .15s, color .15s;
    }
    .m-seg-btn.sel { background:var(--paper); color:var(--ink-90); box-shadow:0 1px 2px rgba(27,23,26,.12); }
    .m-seg-btn:disabled { opacity:.35; }

    /* The ladder: one bordered list, rows in order of distance. */
    .m-ladder {
      border:1px solid var(--ink-30); border-radius:var(--r-md); overflow:hidden;
      background:var(--paper);
    }
    .m-row {
      display:flex; align-items:stretch; gap:var(--s-15);
      width:100%; min-height:56px; padding:0 var(--s-2) 0 0;
      border:none; border-top:1px solid var(--ink-10);
      background:transparent; text-align:left; cursor:pointer;
      font-family:var(--sans); color:var(--ink-90);
      transition:background .15s;
    }
    .m-row:first-child { border-top:none; }
    /* The bar down the left: dark for every wallet the reach covers, so the
       reach reads as one continuous line down the list. */
    .m-bar { flex:0 0 4px; background:var(--ink-10); transition:background .25s; }
    .m-row.in .m-bar { background:var(--ink-90); }
    .m-text { flex:1; display:flex; flex-direction:column; justify-content:center; gap:2px; padding-block:var(--s-1); }
    .m-name { font-size:16px; font-weight:500; }
    .m-sub { font-size:13px; color:var(--ink-50); }
    .m-row.in .m-sub { color:var(--ink-70); }
    .m-row.chosen { background:var(--ink-90); color:var(--paper); }
    .m-row.chosen .m-sub { color:var(--ink-30); }
    .m-row.chosen .m-bar { background:var(--paper); }
    .m-row:active { background:var(--ink-10); }
    .m-row.chosen:active { background:var(--ink-90); }
    /* Last outcome under the current reach. */
    .m-dot { align-self:center; flex:0 0 10px; height:10px; border-radius:50%; }
    .m-dot.pass  { background:var(--pass-edge); }
    .m-dot.block { background:var(--block-edge); }
    .m-row.chosen .m-dot { box-shadow:0 0 0 2px var(--ink-90), 0 0 0 3px var(--paper); }

    .m-paste {
      align-self:flex-start; padding:var(--s-1) 0; border:none; background:none;
      font-family:var(--sans); font-size:14px; font-weight:500; color:var(--ink-70);
      text-decoration:underline; text-underline-offset:3px; cursor:pointer;
    }
  }

  /* ── Reach inside the scan ────────────────────────────────────────
     Rows past the reach are drawn but sit outside it: dashed and quiet,
     so the reach is visible in the scan itself. */
  .step.beyond {
    border-style:dashed; border-color:var(--ink-30); background:transparent;
    color:var(--ink-50);
  }
  .step.beyond .step-note { color:var(--ink-50); font-weight:500; }
  .step.beyond .step-icon { border-style:dashed; background:transparent; }
  .arrow.beyond { color:var(--ink-30); }
  .reach-edge {
    display:flex; align-items:center; gap:var(--s-1); margin:2px 0;
    font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-70);
  }
  .reach-edge::before, .reach-edge::after { content:''; flex:1; height:1px; background:var(--ink-50); }
  .verdict.settled .reach-edge { color:var(--on-62); }
  .verdict.settled .reach-edge::before, .verdict.settled .reach-edge::after { background:var(--on-35); }

  /* Exposure past the reach: amber outline and a triangle, never green. */
  .step.warn {
    border-style:solid; border-color:var(--block-edge);
    background:rgba(255,255,255,.6); color:var(--ink-90);
  }
  .step.warn .step-note { color:#8a4a12; font-weight:600; }
  .step.warn .step-icon {
    border:none; border-radius:0; background:var(--block-edge); color:var(--paper);
    clip-path:polygon(50% 6%, 97% 94%, 3% 94%);
    width:22px; height:20px; font-size:11px; padding-top:4px;
  }
  .step.warn .step-icon::before { content:'!'; }

  .warnline {
    display:flex; align-items:flex-start; gap:10px; margin-top:var(--s-2);
    padding:12px 14px; border-radius:var(--r-sm);
    background:rgba(255,255,255,.62); border:1px solid var(--block-edge);
    font-size:15px; line-height:22px; color:var(--ink-90); max-width:44ch;
  }
  .warn-icon { flex:0 0 20px; width:20px; height:20px; color:var(--block-edge); margin-top:1px; }
  .m-dot.warn {
    border-radius:0; background:var(--block-edge);
    clip-path:polygon(50% 0, 100% 100%, 0 100%); width:12px; height:11px; flex-basis:12px;
  }

  /* ── Rings ─────────────────────────────────────────────────────── */
  .rings { width:100%; height:auto; display:block; overflow:visible; }
  .ring {
    fill:var(--paper); stroke:var(--ink-30); stroke-width:1.5;
    transition:fill .45s ease, stroke .45s ease;
  }
  .ring.off  { fill:var(--paper); stroke:var(--ink-30); stroke-dasharray:4 5; }
  .ring.pass { fill:var(--pass-a); stroke:var(--pass-edge); }
  .ring.hit  { fill:var(--block-a); stroke:var(--block-edge); }
  /* In the console: inside the reach is covered, outside is dashed. */
  .ring.in   { fill:var(--block-a); stroke:var(--block-edge); stroke-dasharray:none; }
  .ring.out  { fill:var(--paper); stroke:var(--ink-30); stroke-dasharray:4 5; }
  .core { fill:var(--ink-90); stroke:var(--ink-90); stroke-width:1.5; transition:fill .45s, stroke .45s; }
  .core.hit { fill:var(--block-edge); stroke:var(--block-edge); }
  .core-label { font:600 13px var(--sans); fill:var(--paper); pointer-events:none; }
  .ring-label {
    font:600 11px var(--sans); letter-spacing:.06em; text-transform:uppercase;
    fill:var(--ink-70); pointer-events:none;
  }
  .wdot { fill:var(--paper); stroke:var(--ink-90); stroke-width:2; transition:fill .2s, stroke .2s; }
  .wmark.you .wdot { fill:var(--ink-90); }
  .wname { font:600 12px var(--sans); fill:var(--ink-90); pointer-events:none; }
  .ring-fig { width:100%; max-width:440px; margin:0 auto; }
  .ring-note {
    margin:var(--s-2) auto 0; max-width:36ch; text-align:center;
    font-size:14px; line-height:21px; color:var(--ink-70); min-height:42px;
  }

  /* ── Console rings ──────────────────────────────────────────────── */
  .reach-rings { max-width:300px; margin:var(--s-2) auto 0; }
  #console-rings .ring { cursor:pointer; }
  @media (hover:hover) {
    #console-rings .ring.out:hover { fill:var(--ink-10); stroke:var(--ink-70); }
    #console-rings .ring.in:hover { stroke:var(--ink-90); }
  }
  #console-rings .ring:focus-visible { outline:none; stroke:var(--ink-90); stroke-width:3; }
  #console-rings .wmark[data-addr] { cursor:pointer; }
  #console-rings .wmark.in .wdot { stroke:var(--block-edge); }
  #console-rings .wmark.out .wdot { stroke:var(--ink-50); }
  #console-rings .wmark.out .wname { fill:var(--ink-50); }
  #console-rings .wmark.chosen .wdot { fill:var(--ink-90); stroke:var(--ink-90); }
  /* The Lazarus example sits on the core, so it reads against the dark disc. */
  #console-rings .wmark:first-of-type .wdot { stroke:var(--paper); }

  /* Chips say whether the current reach covers them. */
  .pk-reach { font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-top:2px; }
  .pk.in .pk-reach { color:var(--block-edge); }
  .pk.out .pk-reach { color:var(--ink-50); }
  .pk.chosen .pk-reach { color:var(--ink-30); }
  .pk.in { border-color:var(--block-edge); }

  /* Phones: the rings figure scales to the room it has. */
  @media (max-width:620px) {
    .ring-fig { max-width:min(320px, 38vh); }
    .ring-note { font-size:13px; line-height:19px; min-height:0; margin-top:var(--s-1); }
    .reach-edge { font-size:10px; margin:0; }
    .warnline { margin-top:var(--s-15); padding:10px 12px; font-size:14px; line-height:20px; }
  }
  /* Short phones: the warning line already says what the reason says, so the
     reason steps aside, and the rows tighten a little. */
  @media (max-width:620px) and (max-height:700px) {
    .ring-fig { max-width:min(240px, 34vh); }
    .intro-grid { gap:16px; }
    #act-copy { min-height:180px; }
    .act .h2 { font-size:26px; }
    .act p { font-size:15px; line-height:22px; margin-top:12px; }
    .warnline ~ .reason { display:none; }
    .step { min-height:38px; padding-block:4px; }
    .steps { gap:2px; }
    .arrow { font-size:11px; line-height:11px; }
    .h1 { font-size:28px; }
    .stats { margin-top:12px; }
    #actions-slot { margin-top:12px; }
  }

  /* ── Wallet list beside the rings ─────────────────────────────────
     The rings set the reach; the list beside them shows which example
     wallets that reach covers. The same rows serve the phone layout. */
  .reach-pair {
    display:grid; grid-template-columns:minmax(0,230px) minmax(0,1fr);
    gap:var(--s-3); align-items:center; margin-top:var(--s-2);
  }
  .reach-pair .reach-rings { max-width:none; margin:0; }
  .reach-list .label { display:block; margin-bottom:var(--s-1); }
  .m-ladder {
    border:1px solid var(--ink-30); border-radius:var(--r-md); overflow:hidden;
    background:var(--paper);
  }
  .m-row {
    display:flex; align-items:stretch; gap:var(--s-15);
    width:100%; min-height:48px; padding:0 var(--s-2) 0 0;
    border:none; border-top:1px solid var(--ink-10);
    background:transparent; text-align:left; cursor:pointer;
    font-family:var(--sans); color:var(--ink-90); transition:background .15s;
  }
  .m-row:first-child { border-top:none; }
  .m-bar { flex:0 0 4px; background:var(--ink-10); transition:background .25s; }
  .m-row.in .m-bar { background:var(--block-edge); }
  .m-text { flex:1; display:flex; flex-direction:column; justify-content:center; gap:1px; padding-block:6px; }
  .m-name { font-size:15px; font-weight:500; }
  .m-sub { font-size:12px; color:var(--ink-50); }
  .m-row.in .m-sub { color:var(--block-edge); font-weight:500; }
  @media (hover:hover) { .m-row:not(.chosen):hover { background:var(--ink-10); } }
  .m-row.chosen { background:var(--ink-90); color:var(--paper); }
  .m-row.chosen .m-sub { color:var(--ink-30); }
  .m-row.chosen .m-bar { background:var(--paper); }
  .m-dot { align-self:center; flex:0 0 10px; height:10px; border-radius:50%; }
  .m-dot.pass  { background:var(--pass-edge); }
  .m-dot.block { background:var(--block-edge); }

  @media (max-width:620px) {
    .d-only { display:none !important; }
    /* On a phone the bar is the ink colour it was designed in. */
    .m-row.in .m-bar { background:var(--ink-90); }
    .m-row.in .m-sub { color:var(--ink-70); font-weight:400; }
    .m-row { min-height:56px; }
    .m-name { font-size:16px; }
    .m-sub { font-size:13px; }
  }

  /* The policy card now carries the choosing, so it takes more of the
     width, and the rings get room for readable labels. */
  @media (min-width:861px) {
    .console { grid-template-columns:minmax(0,3fr) minmax(0,2fr); }
    .reach-pair { grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--s-4); }
  }
  .ring-label { font-size:15px; }
  .core-label { font-size:17px; }
  /* The screening card sits its controls together rather than spread apart. */
  .card-check .card-body { justify-content:flex-start; }

  /* ── Coverage map ─────────────────────────────────────────────── */
  @media (min-width:861px) {
    .console { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  }
  .card-cov .card-body { align-items:center; justify-content:center; }
  .cov { width:100%; display:flex; flex-direction:column; align-items:center; }
  .cov-svg {
    width:100%; max-width:380px; overflow:visible; cursor:pointer;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .cov-svg:focus { outline:none; }
  .cov-svg:focus-visible .cov-knob circle { stroke-width:3.5; }
  .cov-svg.dragging { cursor:grabbing; }

  /* The disc and its glow scale from the centre with a small overshoot, so
     a change of reach reads as the coverage springing out or pulling in. */
  .cov-disc, .cov-halo, .cov-ripple {
    transform-box:view-box; transform-origin:200px 200px;
  }
  .cov-disc { fill:url(#cov-grad); transition:transform .6s cubic-bezier(.34,1.35,.5,1); }
  .cov-halo { fill:#F0A860; opacity:.28; filter:url(#cov-blur); transition:transform .6s cubic-bezier(.34,1.35,.5,1); }
  .cov-ring { fill:none; stroke-width:1.5; transition:stroke .35s, stroke-dasharray .35s, opacity .35s; }
  .cov-ring.in  { stroke:var(--block-edge); opacity:.75; }
  .cov-ring.out { stroke:var(--ink-50); stroke-dasharray:2 6; opacity:.7; }
  .cov-ripple { fill:none; stroke:var(--block-edge); stroke-width:2.5; opacity:0; pointer-events:none; }
  .cov-ripple.go { animation:covRipple .75s ease-out; }
  @keyframes covRipple {
    from { transform:scale(.22); opacity:.7; }
    to   { transform:scale(var(--k, 1)); opacity:0; }
  }

  /* Lazarus at the centre breathes, slowly. */
  .cov-core { fill:var(--ink-90); }
  .cov-core-glow {
    fill:var(--ink-90); opacity:.18; transform-box:fill-box; transform-origin:center;
    animation:coreBreath 3.2s ease-in-out infinite;
  }
  @keyframes coreBreath { 0%,100% { transform:scale(1); opacity:.18; } 50% { transform:scale(1.28); opacity:0; } }
  .cov-core-label { font:600 15px var(--sans); fill:var(--paper); pointer-events:none; }

  .cov-pill rect { fill:var(--paper); stroke:var(--ink-30); stroke-width:1.2; transition:fill .3s, stroke .3s; }
  .cov-pill text { font:600 12px var(--sans); fill:var(--ink-50); transition:fill .3s; pointer-events:none; }
  .cov-pill.on rect { fill:var(--ink-90); stroke:var(--ink-90); }
  .cov-pill.on text { fill:var(--paper); }

  /* The edge handle: slides round with the coverage, and invites a drag. */
  .cov-knob { transition:transform .6s cubic-bezier(.34,1.35,.5,1); cursor:grab; }
  .cov-knob circle { fill:var(--paper); stroke:var(--ink-90); stroke-width:2; filter:drop-shadow(0 2px 4px rgba(27,23,26,.25)); }
  .cov-knob path { fill:none; stroke:var(--ink-90); stroke-width:1.8; stroke-linecap:round; }

  /* The picked wallet, in its band: amber when covered, grey when not. */
  .cov-pick { transition:transform .45s cubic-bezier(.34,1.3,.5,1), opacity .25s; pointer-events:none; color:var(--block-edge); }
  .cov-pick.not { color:var(--ink-50); }
  .cov-pick-dot { fill:currentColor; stroke:var(--paper); stroke-width:2.5; }
  .cov-pick-pulse {
    fill:none; stroke:currentColor; stroke-width:2; transform-box:fill-box; transform-origin:center;
    animation:pickPulse 1.6s ease-out infinite;
  }
  @keyframes pickPulse { from { transform:scale(.55); opacity:.9; } to { transform:scale(1.6); opacity:0; } }

  .cov-sum { margin:var(--s-2) 0 0; font-size:17px; line-height:26px; text-align:center; }
  .cov-hint { margin:4px 0 0; font-size:13px; line-height:20px; color:var(--ink-50); text-align:center; }

  /* The screening card: list, paste link, then Run. */
  .try-wallet .label { display:block; margin-bottom:var(--s-1); }
  .card-check .addr-wrap { display:none; }
  .card-check.show-paste .addr-wrap { display:flex; }
  .card-check.show-paste .paste-link, .card-check.show-paste .m-paste { display:none; }
  .paste-link {
    align-self:flex-start; padding:4px 0; border:none; background:none; cursor:pointer;
    font-family:var(--sans); font-size:14px; font-weight:500; color:var(--ink-70);
    text-decoration:underline; text-underline-offset:3px;
  }
  .paste-link:hover { color:var(--ink-90); }

  @media (prefers-reduced-motion:reduce) {
    .cov-core-glow, .cov-pick-pulse, .cov-ripple.go { animation:none; }
    .cov-disc, .cov-halo, .cov-knob, .cov-pick { transition:none; }
  }

  /* ── Coverage switch under the map ─────────────────────────────── */
  .cov-seg {
    display:flex; gap:3px; padding:3px; margin-top:var(--s-2);
    background:var(--ink-10); border-radius:var(--r-sm);
  }
  .cov-seg .m-seg-btn {
    min-width:84px; height:40px; padding:0 var(--s-2);
    border:none; border-radius:6px; background:transparent; cursor:pointer;
    font-family:var(--sans); font-size:14px; font-weight:600; color:var(--ink-70);
    transition:background .15s, color .15s, box-shadow .15s;
  }
  .cov-seg .m-seg-btn.sel { background:var(--paper); color:var(--ink-90); box-shadow:0 1px 2px rgba(27,23,26,.14); }
  @media (hover:hover) { .cov-seg .m-seg-btn:not(.sel):not(:disabled):hover { color:var(--ink-90); } }
  .cov-seg .m-seg-btn:disabled { opacity:.35; cursor:default; }
  .cov-sum { margin-top:var(--s-15); }
  .cov-ring { cursor:pointer; }

  /* ── Scan map ─────────────────────────────────────────────────── */
  .scan-map { width:clamp(160px, 22vh, 210px); margin:0 0 var(--s-3); }
  .scan-svg { width:100%; height:auto; display:block; overflow:visible; }
  .sband { stroke-width:1.6; transition:fill .45s ease, stroke .45s ease; }
  .sband.pending { fill:rgba(255,255,255,.75); stroke:var(--ink-30); }
  .sband.beyond  { fill:none; stroke:var(--ink-50); stroke-dasharray:2 6; opacity:.75; }
  .sband.clear   { fill:var(--pass-a); stroke:var(--pass-edge); }
  .sband.hit     { fill:var(--block-a); stroke:var(--block-edge); }
  .sband.warn    { fill:rgba(250,225,194,.55); stroke:var(--block-edge); stroke-dasharray:5 4; opacity:1; }
  .sreach { fill:none; stroke:var(--ink-90); stroke-width:1.6; opacity:.55; }
  /* The scan front: a bright ring that travels outward, one hop per step. */
  .swave {
    fill:none; stroke:var(--ink-90); stroke-width:3; opacity:0;
    transform-box:view-box; transform-origin:200px 200px;
    transition:transform .5s cubic-bezier(.3,.7,.3,1), opacity .35s;
    filter:drop-shadow(0 0 6px rgba(27,23,26,.35));
  }
  .swave.on   { opacity:.7; }
  .swave.done { opacity:0; }
  .score { fill:var(--ink-90); transition:fill .45s; }
  .score.clear { fill:var(--pass-edge); }
  .score.hit   { fill:var(--block-edge); }
  .score-label { font:600 15px var(--sans); fill:var(--paper); pointer-events:none; }
  .slaz { opacity:0; transition:opacity .3s; }
  .slaz.shown { opacity:1; }
  .slaz circle {
    fill:var(--ink-90); stroke:var(--paper); stroke-width:3;
    transform-box:fill-box; transform-origin:center;
  }
  .slaz.shown circle { animation:lazDrop .45s cubic-bezier(.34,1.5,.5,1); }
  .slaz.warn circle { fill:var(--block-edge); }
  .slaz text { font:700 14px var(--sans); fill:var(--ink-90); }
  @keyframes lazDrop { from { transform:scale(0); } to { transform:scale(1); } }

  /* Phones keep every state on one screen, so the scan map steps aside. */
  @media (max-width:620px) { .scan-map { display:none; } }
  @media (prefers-reduced-motion:reduce) {
    .swave, .sband, .slaz { transition:none; }
    .slaz.shown circle { animation:none; }
  }

  .cov-core-pick {
    fill:none; stroke:var(--block-edge); stroke-width:3; opacity:0; pointer-events:none;
    transform-box:fill-box; transform-origin:center; transition:opacity .25s;
  }
  .cov-core-pick.on { opacity:1; animation:corePick 1.6s ease-out infinite; }
  @keyframes corePick { 0% { transform:scale(1); opacity:1; } 100% { transform:scale(1.3); opacity:0; } }
  @media (prefers-reduced-motion:reduce) { .cov-core-pick.on { animation:none; } }

  /* The scan map at a size that reads, centred over the steps. */
  .scan-map { width:clamp(180px, 30vh, 280px); margin:0 auto var(--s-3); }
  .score-label { font-size:22px; }
  .slaz text { font-size:21px; }
  .slaz circle { stroke-width:3.5; }
</style>
</head>
