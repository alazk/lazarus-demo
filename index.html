<script>
const stage = document.getElementById("stage");
const short = (a) => (a ? a.slice(0, 6) + "…" + a.slice(-4) : "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function money(n) {
  if (typeof n !== "number") return null;
  if (n >= 1e6) {
    const m = n / 1e6;
    return "$" + (m >= 10 || Number.isInteger(m) ? Math.round(m) : m.toFixed(1)) + "m";
  }
  if (n >= 1e3) return "$" + Math.round(n / 1e3) + "k";
  return "$" + Math.round(n);
}
const usdLabel = (v) =>
  v === 0 ? "any amount"
  : v >= 1e6 ? "over $" + (v / 1e6).toFixed(1) + "m"
  : "over $" + Math.round(v / 1e3) + "k";

/* The deployed contracts, so the policy can be read rather than trusted. */
const POLICY_ADDRESS = "0x5A46A90e0B26Ed56201F24620dbF701D53433BB8";

/* Every combination below is a policy client already bound to the policy
   with those parameters. Selecting one selects which contract the check is
   submitted to, so the rule is fixed onchain before the wallet is screened. */
const RULES = [
  { hops: 1, usd: 0 }, { hops: 2, usd: 0 }, { hops: 3, usd: 0 },
];
const HOP_SHOWN = [1, 2, 3];
const HOP_CHOICES = [...new Set(RULES.map((r) => r.hops))].sort();
const USD_CHOICES = [...new Set(RULES.map((r) => r.usd))].sort((a, b) => a - b);

const STEP_LABELS = [
  "Checking the wallet itself",
  "Looking one hop out",
  "Looking two hops out",
  "Looking three hops out",
];
const WARN_ICON = `<svg class="warn-icon" viewBox="0 0 24 24" aria-hidden="true">
  <path d="M12 3.2 22.4 20.6H1.6Z" fill="currentColor"/>
  <rect x="11" y="9" width="2" height="6.4" rx="1" fill="#fff"/>
  <circle cx="12" cy="17.7" r="1.2" fill="#fff"/></svg>`;
const STEP_SHORT = ["The wallet itself", "One hop out", "Two hops out", "Three hops out"];

/* Captions say where the wallet sits without naming the verdict. */
const LABELS = {
  direct: "Lazarus", one: "1 hop", two: "2 hops", three: "3 hops", clean: "Clean",
};
/* Phone ladder: each example wallet with its known distance. */
const DIST = { direct: 0, one: 1, two: 2, three: 3, clean: null };
const LADDER_NAMES = {
  direct: "Lazarus wallet", one: "1 hop away", two: "2 hops away",
  three: "3 hops away", clean: "No known link",
};
/* The last outcome per wallet, kept with the reach it was checked under, so
   a row only shows a result that is true of the current rule. */
const outcomes = {};
let currentAddress = "";

let view = "intro";
let act = 0;
let hops = 3;
let usd = 0;
let inFlight = false;
let presets = [];


/* The chain reads differently in each act: first only the listed address is
   known, then a list check clears everything downstream of it, then the scan
   covers the whole path. Same four nodes throughout, so the argument is made
   by what lights up rather than by three separate diagrams. */
const CHAIN = ["Lazarus wallet", "Direct counterparty", "Second degree", "Wallet you pay"];

const ACTS = [
  { kicker: "Why this exists", title: "The Lazarus Group",
    body: "A North Korean state hacking operation. They have taken billions from "
        + "exchanges and bridges, and their addresses are designated by OFAC.",
    core: "known", rings: ["off", "off", "off"],
    note: "Lazarus at the centre. Each ring is one transfer further out." },

  { kicker: "The gap", title: "A list checks one address.",
    body: "It compares the wallet you are paying against a set of designated "
        + "addresses. But the money moved along a path. The wallet is not on "
        + "the list, it is one transfer from a wallet that is, and a list check "
        + "cannot tell you that.",
    core: "hit", rings: ["pass", "pass", "pass"],
    note: "What a list covers: the centre only. Every ring around it clears." },

  { kicker: "The policy", title: "Screen the path, not the address.",
    body: "Newton Lazarus Scan walks the transfer graph outward from the wallet you are "
        + "paying and reports how far a known address sits, and how much moved "
        + "along the way.",
    core: "hit", rings: ["hit", "hit", "hit"],
    note: "What the policy covers: every ring inside the reach you set." },
];

const flowSteps = () => [
  "The wallet\u2019s transfers are read from the live graph.",
  `The scan walks outward up to ${hops} ${hops === 1 ? "hop" : "hops"}, `
    + "stopping at the first flagged address.",
  "An operator quorum attests the decision onchain.",
];

/* Concentric rings: the Lazarus address at the centre, one ring per hop.
   A ring's state says whether a rule covers it, which is the whole idea of
   reach drawn as distance. */
const RING_R = [42, 86, 130, 172];     // core, 1 hop, 2 hops, 3 hops (outer edge)
function renderRings({ id = "rings", interactive = false, wallets = [], ringClass = () => "" } = {}) {
  const c = 190;
  const ringCircles = [3, 2, 1].map((n) => `
    <circle class="ring r${n} ${ringClass(n)}" data-ring="${n}" cx="${c}" cy="${c}" r="${RING_R[n]}"
      ${interactive ? `role="button" tabindex="0" aria-label="Set reach to ${n} ${n === 1 ? "hop" : "hops"}"` : ""}/>`).join("");
  const labels = [1, 2, 3].map((n) => {
    const y = c - (RING_R[n - 1] + RING_R[n]) / 2 + 4;
    return `<text class="ring-label" data-label="${n}" x="${c}" y="${y}" text-anchor="middle">${n} ${n === 1 ? "hop" : "hops"}</text>`;
  }).join("");
  // Wallet markers sit in the band for their distance.
  const marks = wallets.map((w) => {
    const d = w.dist;
    let x, y;
    if (d === null) { x = c + 176; y = c + 150; }
    else if (d === 0) { x = c; y = c + 18; }
    else {
      const rr = (RING_R[d - 1] + RING_R[d]) / 2;
      const ang = w.angle * Math.PI / 180;
      x = c + rr * Math.cos(ang); y = c + rr * Math.sin(ang);
    }
    return `<g class="wmark ${w.cls || ""}" data-addr="${esc(w.address || "")}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"
        ${interactive && w.address ? `role="button" tabindex="0" aria-label="${esc(w.name)}"` : ""}>
      <circle class="wdot" r="${w.r || 8}"/>
      ${w.name ? `<text class="wname" y="${(w.r || 8) + 15}" text-anchor="middle">${esc(w.name)}</text>` : ""}
    </g>`;
  }).join("");
  return `<svg class="rings" id="${id}" viewBox="0 0 400 400" role="img" aria-label="Distance from a known Lazarus address, in rings">
    ${ringCircles}
    <circle class="core" cx="${c}" cy="${c}" r="${RING_R[0]}"/>
    <text class="core-label" x="${c}" y="${c - 6}" text-anchor="middle">Lazarus</text>
    ${labels}
    ${marks}
  </svg>`;
}

function renderChain() {
  return `<div class="ring-fig">
    ${renderRings({ id: "intro-rings", wallets: [
      { dist: 3, angle: 38, name: "Wallet you pay", cls: "you", r: 9 },
    ] })}
    <p class="ring-note" id="ring-note"></p>
  </div>`;
}

/** Move the whole intro to an act: the copy crossfades, the chain restates. */
function paintAct(n, animate = true) {
  act = n;
  const a = ACTS[n];

  const copy = document.getElementById("act-copy");
  const apply = () => {
    copy.innerHTML = `
      <div class="h6">${esc(a.kicker)}</div>
      <div class="h2">${esc(a.title)}</div>
      <p class="p-lg">${esc(a.body)}</p>`;
    copy.classList.remove("fading");
  };
  if (animate && copy) {
    copy.classList.add("fading");
    setTimeout(apply, 220);
  } else if (copy) { apply(); }

  // The rings carry their own transitions, so setting a class is the whole
  // animation. They fill from the centre outward.
  const svg = document.getElementById("intro-rings");
  if (svg) {
    const core = svg.querySelector(".core");
    const setCore = () => { if (core) core.setAttribute("class", "core " + a.core); };
    animate ? setTimeout(setCore, 60) : setCore();
    [1, 2, 3].forEach((n) => {
      const ring = svg.querySelector(`.ring.r${n}`);
      const set = () => { if (ring) ring.setAttribute("class", `ring r${n} ${a.rings[n - 1]}`); };
      animate ? setTimeout(set, 60 + 140 * n) : set();
    });
  }
  const note = document.getElementById("ring-note");
  if (note) note.textContent = a.note || "";

  stage.querySelectorAll(".act-dot").forEach((d, i) => {
    d.classList.toggle("on", i === n);
    d.setAttribute("aria-current", i === n ? "step" : "false");
  });
}

function renderIntro() {
  stage.className = "stage";
  stage.innerHTML = `
    <div class="intro">
      <div class="intro-grid">
        <div class="act">
          <div id="act-copy"></div>
          <div class="intro-foot">
            <button class="btn btn-primary btn-lg" id="go-console">Screen a wallet</button>
            <button class="btn btn-tertiary btn-md" id="next-act">Next</button>
            <div class="acts">
              ${ACTS.map((_, i) => `<button class="act-dot" type="button"
                data-act="${i}" aria-label="Section ${i + 1}"></button>`).join("")}
            </div>
          </div>
        </div>
        <div class="act-figure">${renderChain()}</div>
      </div>
    </div>`;

  document.getElementById("go-console").onclick = () => {
    stopAuto(); view = "console"; renderConsole();
  };
  const next = document.getElementById("next-act");
  if (next) next.onclick = () => {
    stopAuto();
    if (act >= ACTS.length - 1) { view = "console"; renderConsole(); return; }
    paintAct(act + 1);
  };
  stage.querySelectorAll(".act-dot").forEach((b) => {
    b.onclick = () => { stopAuto(); paintAct(Number(b.dataset.act)); };
  });

  paintAct(act, false);
  startAuto();
}

/* The three acts are an argument, so they advance on their own until the
   reader takes over. Any interaction stops it for good. */
let autoTimer = null;
function startAuto() {
  stopAuto();
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  autoTimer = setInterval(() => {
    if (view !== "intro") return stopAuto();
    if (act >= ACTS.length - 1) {
      stopAuto();
      view = "console";
      renderConsole();
      return;
    }
    paintAct(act + 1);
  }, 5000);
}
function stopAuto() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
}

/* ── Console ─────────────────────────────────────────────────── */
function setRule(nextHops, nextUsd) {
  let value = nextUsd;
  if (!RULES.some((r) => r.hops === nextHops && r.usd === value)) {
    // Not every combination has a deployed client. Fall to the nearest that
    // does rather than refusing the click and looking broken.
    const atHops = RULES.filter((r) => r.hops === nextHops).map((r) => r.usd);
    if (atHops.length === 0) return;
    value = atHops.reduce((best, v) =>
      Math.abs(v - nextUsd) < Math.abs(best - nextUsd) ? v : best);
  }
  if (nextHops === hops && value === usd) return;
  hops = nextHops;
  usd = value;
  if (document.querySelector(".console")) applyReach();
  else renderConsole(document.getElementById("addr")?.value || "", "", true);
}

/* The rail is the distance control: reach is what is lit. */
/* The rail uses the same words as the intro chain, so a hop count means
   something: 2 is a second-degree counterparty, not just the number two. */
const RAIL_CAPTIONS = { 1: "direct", 2: "second degree", 3: "third degree" };

function renderRail() {
  const cell = (label, caption, extra = "", tag = "span", attrs = "") =>
    `<div class="rail-cell">
       <${tag} class="rail-node ${extra}" ${attrs}>${esc(label)}</${tag}>
       <span class="rail-cap">${esc(caption)}</span>
     </div>`;

  const parts = [cell("You", "wallet you pay")];
  HOP_SHOWN.forEach((n) => {
    const on = n <= hops;
    const live = HOP_CHOICES.includes(n);
    parts.push(`<span class="rail-link ${on ? "on" : ""}"></span>`);
    parts.push(cell(String(n), RAIL_CAPTIONS[n] || "",
      `${on ? "on" : ""} ${n === hops ? "sel" : ""}`,
      live ? "button" : "span",
      live ? `type="button" data-hops="${n}" aria-pressed="${n === hops}"` : ""));
  });
  const lit = hops >= Math.max(...HOP_SHOWN);
  parts.push(`<span class="rail-link ${lit ? "on" : ""}"></span>`);
  parts.push(cell("Lazarus", "on the list", "end"));
  return `<div class="rail">${parts.join("")}</div>`;
}


/* The example wallets in order of distance, with a bar marking the ones the
   current reach covers. Used beside the rings on desktop and on its own on a
   phone, so both show the same picture. */
function renderWalletList(ready, prefill, extra = "") {
  const rows = [...ready].sort((a, b) => (DIST[a.key] ?? 99) - (DIST[b.key] ?? 99));
  const chosenAddr = String(prefill || "").trim().toLowerCase();
  return `
    <div class="m-ladder ${extra}" role="list">
      ${rows.map((r) => {
        const d = DIST[r.key];
        const inside = d !== null && d !== undefined && d <= hops;
        const out = outcomes[r.address.toLowerCase()];
        const tone = out && out.hops === hops ? out.tone : "";
        const sub = rowSub(d);
        const chosen = r.address.toLowerCase() === chosenAddr;
        return `<button class="m-row ${inside ? "in" : ""} ${chosen ? "chosen" : ""}"
            type="button" role="listitem" data-addr="${esc(r.address)}" data-dist="${d ?? ""}"
            aria-pressed="${chosen}" title="${esc(r.address)}">
          <span class="m-bar" aria-hidden="true"></span>
          <span class="m-text">
            <span class="m-name">${esc(LADDER_NAMES[r.key] || r.label || "")}</span>
            <span class="m-sub">${esc(sub)}</span>
          </span>
          <span class="m-dot ${tone}" aria-label="${tone === "block" ? "blocked last time" : tone === "warn" ? "allowed, exposure outside reach" : tone === "pass" ? "allowed last time" : ""}"></span>
        </button>`;
      }).join("")}
    </div>`;
}

/* ── Phone ladder ────────────────────────────────────────────────
   On a phone the reach control and the example wallets are one thing: the
   wallets are listed in order of distance, and a bar marks which ones the
   current reach covers, so what the rule catches is visible before a check
   runs. */
function renderLadder(ready, prefill) {
  const rows = [...ready].sort((a, b) =>
    (DIST[a.key] ?? 99) - (DIST[b.key] ?? 99));
  const chosenAddr = String(prefill || "").trim().toLowerCase();
  const pasted = chosenAddr && !rows.some((r) => r.address.toLowerCase() === chosenAddr);
  return `
    <div class="m-only m-reach">
      <div class="m-reach-top">
        <span class="label">Reach</span>
        <div class="m-seg" role="group" aria-label="How far the scan reaches">
          ${HOP_SHOWN.map((n) => `<button class="m-seg-btn ${n === hops ? "sel" : ""}"
            type="button" data-hops="${n}" aria-pressed="${n === hops}"
            ${HOP_CHOICES.includes(n) ? "" : "disabled"}>${n} ${n === 1 ? "hop" : "hops"}</button>`).join("")}
        </div>
      </div>
      <p class="m-rule">Blocks any wallet inside the reach that connects to a known Lazarus address.</p>
    </div>
    ${renderWalletList(ready, prefill, "m-only")}
    <button class="m-only m-paste ${pasted ? "hide" : ""}" type="button" id="m-paste">
      Paste any address</button>`;
}

/* ── Coverage map ────────────────────────────────────────────────
   Lazarus at the centre, a ring per hop, and one coverage disc that grows
   and shrinks to the reach. Drag its edge or tap a ring to change it. The
   wallet you pick lands in its ring, so you see whether the coverage
   reaches it. Reach changes update in place so the motion can play. */
const COV_C = 200;
const COV_R = [44, 96, 142, 188];          // core, then the outer edge of hops 1–3
/* Every picked wallet sits on this one ray, so changing wallets slides the
   dot straight in or out, clear of the labels stacked above the centre. */
const RAY_DEG = 45;
let pickAddr = "";

const hopWord = (n) => `${n} ${n === 1 ? "hop" : "hops"}`;
const isCovered = (d) => d !== null && d !== undefined && d !== "" && Number(d) <= hops;
function rowSub(d) {
  if (d === 0) return "on the list · covered";
  if (d === null || d === undefined || d === "") return "outside every ring";
  return Number(d) <= hops ? "covered" : "not covered";
}
function coverageSummary(ready) {
  const covered = ready.filter((w) => isCovered(DIST[w.key])).length;
  return `Covering <b>${hopWord(hops)}</b> · ${covered} of ${ready.length} example wallets covered`;
}
function onRay(r) {
  const a = RAY_DEG * Math.PI / 180;
  return [COV_C + r * Math.cos(a), COV_C + r * Math.sin(a)];
}
/** Radius on the ray for a wallet at distance d: the edge of the centre for
 *  the listed address, the middle of its band otherwise, and just past the
 *  last ring for a wallet with no known link. */
function rayRadius(d) {
  if (d === 0) return COV_R[0] - 10;
  if (d === null || d === undefined) return COV_R[3] + 20;
  return (COV_R[d - 1] + COV_R[d]) / 2;
}

function renderCoverage(ready) {
  const c = COV_C, k = COV_R[hops] / COV_R[3];
  const pills = [1, 2, 3].map((n) => {
    const y = c - (COV_R[n - 1] + COV_R[n]) / 2;
    return `<g class="cov-pill ${n <= hops ? "on" : ""}" data-ring="${n}" transform="translate(${c} ${y})">
      <rect x="-32" y="-12" width="64" height="24" rx="12"/>
      <text y="4" text-anchor="middle">${hopWord(n)}</text></g>`;
  }).join("");
  return `
    <div class="cov">
      <svg class="cov-svg" id="cov-svg" viewBox="0 0 400 400" tabindex="0" role="slider"
           aria-label="Coverage in hops" aria-valuemin="1" aria-valuemax="3" aria-valuenow="${hops}"
           aria-valuetext="${hopWord(hops)}">
        <defs>
          <radialGradient id="cov-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#F2B478" stop-opacity=".95"/>
            <stop offset="55%"  stop-color="#F8D6AE" stop-opacity=".92"/>
            <stop offset="100%" stop-color="#FBE6CC" stop-opacity=".95"/>
          </radialGradient>
          <filter id="cov-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
        </defs>
        <circle class="cov-halo" cx="${c}" cy="${c}" r="${COV_R[3]}" style="transform:scale(${k})"/>
        <circle class="cov-disc" id="cov-disc" cx="${c}" cy="${c}" r="${COV_R[3]}" style="transform:scale(${k})"/>
        ${[1, 2, 3].map((n) => `<circle class="cov-ring ${n <= hops ? "in" : "out"}" data-ring="${n}" cx="${c}" cy="${c}" r="${COV_R[n]}"/>`).join("")}
        <circle class="cov-ripple" id="cov-ripple" cx="${c}" cy="${c}" r="${COV_R[3]}"/>
        <circle class="cov-core-glow" cx="${c}" cy="${c}" r="${COV_R[0]}"/>
        <circle class="cov-core-pick" id="cov-core-pick" cx="${c}" cy="${c}" r="${COV_R[0] + 7}"/>
        <circle class="cov-core" cx="${c}" cy="${c}" r="${COV_R[0]}"/>
        <text class="cov-core-label" x="${c}" y="${c + 5}" text-anchor="middle">Lazarus</text>
        ${pills}
        <g class="cov-pick" id="cov-pick" style="opacity:0">
          <circle class="cov-pick-pulse" r="15"/><circle class="cov-pick-dot" r="8"/>
        </g>
      </svg>
      <div class="cov-seg" role="group" aria-label="Coverage">
        ${[1, 2, 3].map((n) => `<button class="m-seg-btn ${n === hops ? "sel" : ""}" type="button"
          data-hops="${n}" aria-pressed="${n === hops}"
          ${HOP_CHOICES.includes(n) ? "" : "disabled"}>${hopWord(n)}</button>`).join("")}
      </div>
      <p class="cov-sum" id="cov-sum">${coverageSummary(ready)}</p>
    </div>`;
}

/** Place the picked wallet on the map, in the band for its distance. */
function placePick(addr) {
  pickAddr = String(addr || "").trim().toLowerCase();
  const g = document.getElementById("cov-pick");
  if (!g) return;
  const w = presets.find((x) => x.address.toLowerCase() === pickAddr);
  if (!w) {
    g.style.opacity = "0";
    document.getElementById("cov-core-pick")?.classList.remove("on");
    return;
  }
  const d = DIST[w.key];
  // The listed wallet is the centre itself: ring the centre, draw no dot.
  const ring = document.getElementById("cov-core-pick");
  if (ring) ring.classList.toggle("on", d === 0);
  if (d === 0) { g.style.opacity = "0"; return; }
  const [x, y] = onRay(rayRadius(d));
  const cls = "cov-pick" + (d === 0 || isCovered(d) ? "" : " not");
  g.setAttribute("class", cls);
  g.style.opacity = "1";
  g.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
}

/** Update everything that depends on the reach without redrawing, so the
 *  disc, the knob and the rows can animate to their new state. */
function applyReach() {
  const ready = presets.filter((p) => p.address);
  const svg = document.getElementById("cov-svg");
  if (svg) {
    const k = COV_R[hops] / COV_R[3];
    svg.querySelectorAll(".cov-disc, .cov-halo").forEach((e) => { e.style.transform = `scale(${k})`; });
    svg.querySelectorAll(".cov-ring").forEach((r) =>
      r.setAttribute("class", `cov-ring ${Number(r.dataset.ring) <= hops ? "in" : "out"}`));
    svg.querySelectorAll(".cov-pill").forEach((g) =>
      g.setAttribute("class", `cov-pill ${Number(g.dataset.ring) <= hops ? "on" : ""}`));
    const ripple = document.getElementById("cov-ripple");
    if (ripple) {
      ripple.style.setProperty("--k", k);
      ripple.setAttribute("class", "cov-ripple");
      ripple.getBoundingClientRect();               // restart the animation
      ripple.setAttribute("class", "cov-ripple go");
    }
    svg.setAttribute("aria-valuenow", hops);
    svg.setAttribute("aria-valuetext", hopWord(hops));
    placePick(pickAddr);
  }
  const sum = document.getElementById("cov-sum");
  if (sum) sum.innerHTML = coverageSummary(ready);

  stage.querySelectorAll(".m-row").forEach((row) => {
    const raw = row.dataset.dist;
    const d = raw === "" ? null : Number(raw);
    row.classList.toggle("in", isCovered(d));
    const sub = row.querySelector(".m-sub");
    if (sub) sub.textContent = rowSub(d);
    const out = outcomes[(row.dataset.addr || "").toLowerCase()];
    const dot = row.querySelector(".m-dot");
    if (dot) dot.className = "m-dot " + (out && out.hops === hops ? out.tone : "");
  });
  stage.querySelectorAll(".m-seg-btn").forEach((b) => {
    const on = Number(b.dataset.hops) === hops;
    b.classList.toggle("sel", on);
    b.setAttribute("aria-pressed", String(on));
  });
}

function renderConsole(prefill = "", error = "", still = false) {
  document.title = "Lazarus Scan · Newton";
  const ready = presets.filter((p) => p.address);
  const pasted = prefill && !ready.some((r) => r.address.toLowerCase() === String(prefill).trim().toLowerCase());
  stage.className = "stage";
  stage.innerHTML = `
    <div class="console ${still ? "still" : ""}">
      <div class="col">
        <div class="h6 muted">Coverage</div>
        <div class="card card-policy card-cov">
          <div class="card-body">${renderCoverage(ready)}</div>
        </div>
      </div>

      <div class="col">
        <div class="h6 muted">Screen a wallet</div>
        <div class="card card-check ${pasted ? "show-paste" : ""}">
          <div class="card-body">
            ${renderLadder(ready, prefill)}
            <div class="d-only try-wallet">
              <span class="label">Try a wallet</span>
              ${renderWalletList(ready, prefill, "d-only")}
            </div>
            <button class="d-only paste-link" type="button" id="d-paste">Paste any address</button>
            <div class="addr-wrap">
              <label class="label" for="addr">Paste any Ethereum address</label>
              <input class="field" id="addr" spellcheck="false" autocomplete="off"
                     placeholder="0x…" value="${esc(prefill)}" />
              <p class="err" id="err">${esc(error)}</p>
            </div>
          </div>
          <button class="btn btn-primary btn-lg btn-block" id="run">Run the check</button>
        </div>
      </div>
    </div>`;

  const input = document.getElementById("addr");
  const run = document.getElementById("run");

  stage.querySelectorAll(".rail-node[data-hops]").forEach((b) => {
    b.onclick = () => setRule(Number(b.dataset.hops), usd);
  });

  // One selection shared by the chips, the ring markers and the phone rows.
  const selectAddress = (addr) => {
    const a = String(addr || "").toLowerCase();
    stage.querySelectorAll(".pk, .m-row").forEach((x) => {
      const on = (x.dataset.addr || "").toLowerCase() === a;
      x.classList.toggle("chosen", on);
      x.setAttribute("aria-pressed", String(on));
    });
    stage.querySelectorAll("#console-rings .wmark").forEach((g) => {
      const on = (g.dataset.addr || "").toLowerCase() === a;
      g.setAttribute("class", g.getAttribute("class").replace(/\s*chosen/g, "") + (on ? " chosen" : ""));
    });
    input.value = addr;
    input.classList.remove("invalid");
    document.getElementById("err").textContent = "";
    placePick(addr);
    sync();
  };

  stage.querySelectorAll(".pk").forEach((b) => {
    b.onclick = () => selectAddress(b.dataset.addr);
  });

  // Coverage map: tap a ring or drag the edge; arrow keys step the reach.
  const svg = document.getElementById("cov-svg");
  if (svg) {
    const bandAt = (ev) => {
      const pt = svg.createSVGPoint();
      pt.x = ev.clientX; pt.y = ev.clientY;
      const m = svg.getScreenCTM();
      if (!m) return null;
      const q = pt.matrixTransform(m.inverse());
      const r = Math.hypot(q.x - COV_C, q.y - COV_C);
      return r <= COV_R[1] ? 1 : r <= COV_R[2] ? 2 : 3;
    };
    svg.addEventListener("click", (ev) => {
      const n = bandAt(ev); if (n) setRule(n, usd);
    });
    svg.addEventListener("keydown", (e) => {
      if (["ArrowRight", "ArrowUp"].includes(e.key)) { e.preventDefault(); setRule(Math.min(3, hops + 1), usd); }
      if (["ArrowLeft", "ArrowDown"].includes(e.key)) { e.preventDefault(); setRule(Math.max(1, hops - 1), usd); }
    });
  }

  // The coverage switches, under the map on desktop and on the phone.
  stage.querySelectorAll(".m-seg-btn").forEach((b) => {
    b.onclick = () => setRule(Number(b.dataset.hops), usd);
  });
  stage.querySelectorAll(".m-row").forEach((b) => {
    b.onclick = () => {
      stage.querySelector(".card-check")?.classList.remove("show-paste");
      selectAddress(b.dataset.addr);
    };
  });
  const openPaste = () => {
    stage.querySelectorAll(".m-row").forEach((x) => {
      x.classList.remove("chosen"); x.setAttribute("aria-pressed", "false");
    });
    stage.querySelector(".card-check")?.classList.add("show-paste");
    input.value = "";
    placePick("");
    sync();
    input.focus();
  };
  const dPaste = document.getElementById("d-paste");
  if (dPaste) dPaste.onclick = openPaste;
  const paste = document.getElementById("m-paste");
  if (paste) paste.onclick = () => {
    stage.querySelectorAll(".m-row").forEach((x) => {
      x.classList.remove("chosen"); x.setAttribute("aria-pressed", "false");
    });
    stage.querySelector(".card-check")?.classList.add("show-paste");
    input.value = "";
    sync();
    input.focus();
  };

  const valid = (v) => /^0x[0-9a-fA-F]{40}$/.test(String(v ?? "").trim());
  const sync = () => { run.disabled = !valid(input.value); };
  input.oninput = () => {
    input.classList.remove("invalid");
    document.getElementById("err").textContent = "";
    const typed = input.value.trim().toLowerCase();
    placePick(typed);
    stage.querySelectorAll(".pk, .m-row").forEach((x) => {
      const on = (x.dataset.addr || "").toLowerCase() === typed;
      x.classList.toggle("chosen", on);
      x.setAttribute("aria-pressed", String(on));
    });
    sync();
  };
  input.onkeydown = (e) => { if (e.key === "Enter" && !run.disabled) run.click(); };
  run.onclick = () => submit(String(input.value ?? "").trim());
  placePick(prefill);
  sync();
  if (window.matchMedia("(min-width: 861px)").matches) input.focus();
}

/* ── Checking, then the verdict in the same frame ────────────────
   One panel for both. The scan runs in the left column and stays exactly
   where it is; when the outcome lands the panel takes its colour and the
   right column fills in. Nothing moves, so the result reads as the scan
   resolving rather than as a new screen. */
/* ── Scan map ────────────────────────────────────────────────────
   The same rings, centred on the wallet being screened, because the scan
   searches outward from it. A scan front expands one ring per step, each
   ring settles as it resolves, and a found Lazarus address drops onto the
   same ray the console uses. Rings past the reach are dashed. */
function renderScanMap() {
  const c = COV_C;
  return `<svg class="scan-svg" id="scan-svg" viewBox="0 0 400 400" aria-hidden="true">
    ${[3, 2, 1].map((n) => `<circle class="sband ${n <= hops ? "pending" : "beyond"}" data-band="${n}"
      cx="${c}" cy="${c}" r="${COV_R[n]}"/>`).join("")}
    <circle class="sreach" cx="${c}" cy="${c}" r="${COV_R[hops]}"/>
    <circle class="swave" id="swave" cx="${c}" cy="${c}" r="${COV_R[3]}"
      style="transform:scale(${(COV_R[0] / COV_R[3]).toFixed(3)})"/>
    <circle class="score" id="score" cx="${c}" cy="${c}" r="${COV_R[0]}"/>
    <text class="score-label" id="score-label" x="${c}" y="${c + 5}" text-anchor="middle">Wallet</text>
    <g class="slaz" id="slaz"><circle r="13"/><text x="20" y="7">Lazarus</text></g>
  </svg>`;
}

function scanMapController() {
  const svg = document.getElementById("scan-svg");
  const q = (sel) => svg && svg.querySelector(sel);
  const wave = q("#swave"), core = q("#score"), label = q("#score-label"), laz = q("#slaz");
  return {
    /** Push the scan front out to hop n. */
    reach(n) {
      if (!wave) return;
      wave.style.transform = `scale(${((n === 0 ? COV_R[0] : COV_R[n]) / COV_R[3]).toFixed(3)})`;
      wave.setAttribute("class", "swave on");
    },
    /** Settle hop n as clear, hit, or found past the reach. */
    settle(n, state) {
      if (!svg) return;
      if (n === 0) {
        core.setAttribute("class", `score ${state}`);
        if (state === "hit") label.textContent = "Lazarus";
        return;
      }
      const band = q(`.sband[data-band="${n}"]`);
      if (band) band.setAttribute("class", `sband ${state}`);
    },
    /** Drop the Lazarus marker on the ray at hop n. */
    found(n, warn) {
      if (!laz || n === 0) return;
      const [x, y] = onRay((COV_R[n - 1] + COV_R[n]) / 2);
      laz.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
      laz.setAttribute("class", `slaz shown ${warn ? "warn" : ""}`);
    },
    done() { if (wave) wave.setAttribute("class", "swave done"); },
  };
}

function renderChecking(address) {
  document.title = "Checking… · Lazarus Scan";
  stage.className = "stage";
  stage.innerHTML = `
    <div class="verdict" id="panel">
      <div class="grid">
        <div class="left">
          <div class="left-stack">
            <div class="scan-map">${renderScanMap()}</div>
            <div class="steps">
              ${STEP_LABELS.map((label, n) => `
                ${n ? `<span class="arrow ${n > hops ? "beyond" : ""}" aria-hidden="true"></span>` : ""}
                ${n === hops + 1 ? `<div class="reach-edge"><span>Your reach ends here</span></div>` : ""}
                <div class="step ${n > hops ? "beyond" : n === 0 ? "active" : "idle"}" data-step="${n}">
                  <span class="step-icon" aria-hidden="true"></span>
                  <span class="step-label"><span class="lbl-long">${esc(label)}</span><span class="lbl-short">${esc(STEP_SHORT[n])}</span></span>
                  <span class="step-note">${n > hops ? "outside reach" : ""}</span>
                </div>`).join("")}
            </div>
          </div>
        </div>
        <div class="right" id="right-slot">
          <div class="h1">Checking</div>
          <p class="reason p-lg">Tracing the graph outward from this wallet, then
            waiting on an operator quorum.</p>
          <div class="mono p-sm" style="word-break:break-all;margin-top:var(--s-3);color:var(--on-62)">${esc(address)}</div>
        </div>
      </div>
      <div class="actions" id="actions-slot"></div>
    </div>`;

  const rows = () => [...stage.querySelectorAll(".step")];
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const map = scanMapController();

  return {
    /** Walk the rows inside the reach. The step that finds a path inside
     *  the reach goes amber and stops the walk. A path found past the reach
     *  is marked on its own row with a warning: it exists, and the rule you
     *  set does not cover it. */
    async settle(hitAt, kind) {
      const list = rows();
      if (!list.length) return;
      const inside = list.filter((r) => Number(r.dataset.step) <= hops);
      const arrows = [...stage.querySelectorAll(".steps .arrow:not(.beyond)")];
      const hit = hitAt === null || hitAt === undefined ? null : hitAt;

      for (let n = 0; n < inside.length; n++) {
        const row = inside[n];
        if (n > 0 && arrows[n - 1]) {
          arrows[n - 1].classList.add("lit");
          await wait(140);
        }
        row.classList.remove("idle");
        row.classList.add("active");
        map.reach(n);
        await wait(560);
        row.classList.remove("active");

        if (kind === "hit" && n === hit) {
          map.settle(n, "hit");
          map.found(n, false);
          map.done();
          row.classList.add("hit", "resolved");
          row.querySelector(".step-note").textContent = "exposure found";
          inside.slice(n + 1).forEach((r) => r.classList.add("idle"));
          await wait(500);
          row.classList.add("waiting");
          return;
        }
        row.classList.add("clear", "resolved");
        row.querySelector(".step-note").textContent = "clear";
        map.settle(n, "clear");
        await wait(120);
      }
      map.done();

      if (kind === "warn" && hit !== null && list[hit]) {
        await wait(260);
        const row = list[hit];
        map.settle(hit, "warn");
        map.found(hit, true);
        row.classList.add("warn", "resolved");
        row.querySelector(".step-note").innerHTML = 'outside reach';
        await wait(500);
        row.classList.add("waiting");
        return;
      }
      await wait(300);
      const last = inside[inside.length - 1];
      if (last) {
        const note = last.querySelector(".step-note");
        if (note) note.textContent = "waiting on quorum";
        last.classList.add("waiting");
      }
    },
  };
}

/* ── Submit ──────────────────────────────────────────────────── */
async function submit(address) {
  if (inFlight) return;
  const input = document.getElementById("addr");
  if (!/^0x[0-9a-fA-F]{40}$/.test(address)) {
    if (input) {
      input.classList.add("invalid");
      document.getElementById("err").textContent = "That is not a 42-character Ethereum address.";
      input.focus();
    }
    return;
  }
  inFlight = true;
  currentAddress = address.toLowerCase();
  const search = renderChecking(address);
  try {
    const resp = await fetch("/api/evaluate?address=" + encodeURIComponent(address)
      + "&max_hops=" + hops + "&min_usd=" + usd);
    const result = await resp.json();
    if (result.status === "INVALID_ADDRESS") return renderConsole(address, result.reason);

    // A path found but allowed means the policy's value floor let it through:
    // its own outcome, not a plain pass.
    // Exposure the policy allowed means it sits past the reach you set.
    const outsideReach = result.exposure && result.decision === "ALLOW"
      && typeof result.hop_count === "number" && result.hop_count > hops;
    await search.settle(result.exposure ? result.hop_count : null,
                        outsideReach ? "warn" : "hit");
    await fillVerdict(result, outsideReach);
  } catch (e) {
    await fillVerdict({
      wallet: address.toLowerCase(), status: "SCREENING_FAILED", decision: "DENY",
      detail: String(e.message || e),
    }, false);
  } finally { inFlight = false; }
}

/* ── Verdict ─────────────────────────────────────────────────── */
function renderStats(r) {
  const max = r.dataset?.max_hops ?? hops;
  const distance = r.direct_match ? "On the list"
    : r.exposure ? `${r.hop_count} ${r.hop_count === 1 ? "hop" : "hops"}`
    : "None";
  const value = r.direct_match ? "—"
    : typeof r.exposure_usd === "number" ? money(r.exposure_usd) : "—";
  const decision = r.decision === "ALLOW" ? "Allowed" : "Blocked";

  // The figure links to its transfer only when that transfer is the one the
  // screening reported. When the smallest sits deeper in the path there is
  // no hash for it, and linking the first edge would point at the wrong one.
  const tx = (r.edges || [])[0]?.tx;
  const isFirstEdge = typeof r.first_edge_usd === "number"
    && r.first_edge_usd === r.exposure_usd;
  const valueCell = (tx && isFirstEdge)
    ? `<a class="stat-v stat-link" href="https://etherscan.io/tx/${esc(tx)}"
         target="_blank" rel="noopener" title="The transfer this figure comes from"
         >${esc(value)} <span class="stat-ext">↗</span></a>`
    : `<div class="stat-v">${esc(value)}</div>`;

  return `<div class="stats">
    <div class="stat"><div class="stat-k">Distance</div>
      <div class="stat-v">${esc(distance)}</div></div>
    <div class="stat"><div class="stat-k">Smallest transfer</div>${valueCell}</div>
    <div class="stat"><div class="stat-k">Decision</div>
      <div class="stat-v">${esc(decision)}</div></div>
  </div>`;
}

/** Fill the panel the scan is already sitting in: colour it, write the right
 *  column, add the path below the settled steps. The steps do not move. */
async function fillVerdict(r, outsideReach) {
  const panel = document.getElementById("panel");
  const right = document.getElementById("right-slot");

  const actions = document.getElementById("actions-slot");
  if (!panel || !right) return;

  const max = r.dataset?.max_hops ?? hops;
  const hopWord = (n) => `${n} ${n === 1 ? "hop" : "hops"}`;
  let tone, headline, reason;

  if (r.status === "SCREENING_FAILED") {
    tone = "fail"; headline = "Screening failed";
    reason = "The transaction graph could not be read, so the wallet was not "
           + "screened. The policy denies by default, which is not a finding of exposure.";
  } else if (r.status === "ATTESTATION_FAILED") {
    tone = "fail"; headline = "Not attested";
    reason = "The wallet was screened, but the decision could not be attested, "
           + "so the policy denies by default.";
  } else if (outsideReach) {
    // Allowed, and it should not read as clean: the exposure is real, the
    // rule you chose just does not reach it.
    tone = "pass"; headline = "Compliant";
    reason = `Allowed under your reach of ${hopWord(max)}. The policy only blocks `
           + "exposure inside the reach you set.";
  } else if (r.exposure) {
    tone = "block"; headline = "Non Compliant";
    reason = r.direct_match
      ? "This wallet is a known Lazarus Group address."
      : `This wallet reaches a known Lazarus Group address in ${hopWord(r.hop_count)}.`;
  } else {
    tone = "pass"; headline = "Compliant";
    reason = `No path to a known Lazarus Group address was found within `
           + `${hopWord(max)}.`;
  }

  right.classList.add("swapping");
  await new Promise((r) => setTimeout(r, 220));
  panel.classList.add(tone, "settled");
  if (currentAddress && tone !== "fail") {
    outcomes[currentAddress] = { tone: outsideReach ? "warn" : tone, hops: r.dataset?.max_hops ?? hops };
  }
  document.title = `${headline} · Lazarus Scan`;
  // The scan's last note said it was waiting; the verdict answers that.
  stage.querySelectorAll(".step.waiting").forEach((row) => {
    row.classList.remove("waiting");
    const note = row.querySelector(".step-note");
    if (note && note.textContent === "waiting on quorum" && !row.classList.contains("warn")) {
      note.textContent = row.classList.contains("hit") ? "exposure found"
        : "clear";
    }
  });

  const detail = r.detail || r.attestation?.detail;
  right.innerHTML = `
    <div class="h1">${esc(headline)}</div>
    ${outsideReach ? `<div class="warnline" role="note">${WARN_ICON}
      <span><b>Exposure found ${esc(hopWord(r.hop_count))} out</b>, outside your reach
      of ${esc(hopWord(max))}.</span></div>` : ""}
    <p class="reason p-lg">${esc(reason)}</p>
    ${detail ? `<div class="detail">${esc(detail)}</div>` : ""}
    ${r.status === "SCREENING_FAILED" ? "" : renderStats(r)}`;
  requestAnimationFrame(() => right.classList.remove("swapping"));

  actions.innerHTML = `
    <span class="line"></span>
    <button class="btn btn-tertiary btn-md" id="again">New check</button>
    ${r.explorer_url ? `<a class="btn btn-primary btn-md" href="${esc(r.explorer_url)}"
       target="_blank" rel="noopener"><span>View attestation<span class="btn-long"> on the Newton explorer</span></span><span aria-hidden="true">↗</span></a>` : ""}`;
  actions.classList.add("on");
  document.getElementById("again").onclick = () => renderConsole(r.wallet || "");
}

/* ── Boot ────────────────────────────────────────────────────────
   Wait for the example wallets before the first paint, with a cap so a slow
   file cannot hold the page blank. Painting twice shows an empty console. */
document.getElementById("home").onclick = () => {
  if (view === "intro") return;
  view = "intro"; act = 0; renderIntro();
};

(async function boot() {
  const wallets = fetch("data/demo_wallets.json")
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null);
  // The intro paints straight away and does not need the wallets, so there
  // is nothing to wait for. The wallets arrive whenever the file does: a slow
  // mobile connection used to miss a fixed deadline and the late response was
  // thrown away, leaving the console with no examples for the whole session.
  renderIntro();
  const data = await wallets;
  const loaded = data?.wallets;
  if (!Array.isArray(loaded)) return;
  presets = loaded.filter((w) => w.address);
  // If the reader is already on the console, give it the examples now.
  if (view === "console" && !inFlight && document.getElementById("addr")) {
    renderConsole(document.getElementById("addr").value || "", "", true);
  }
})();
</script>
